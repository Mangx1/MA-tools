<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MA Tools Hub</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 4px;
    }
    header p {
      font-size: 12px;
      color: #8b949e;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 1 baris isi 2 card */
      gap: 10px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card img {
      width: 100%;
      aspect-ratio: 1 / 1; /* Rasio gambar 1:1 persegi */
      object-fit: cover;
      background-color: #21262d;
    }
    .card-body {
      padding: 10px 8px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <header>
    <h1>🛠️ MA Tools Portal</h1>
    <p>Kumpulan alat web serbaguna</p>
  </header>

  <div class="grid">
    <a href="MA-MultiUtilitySuite.html" class="card">
      <img src="MA-MultiUtilitySuite.jpg" alt="MA Multi Utility Suite" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Multi Utility Suite</div></div>
    </a>

    <a href="Multi AI.html" class="card">
      <img src="Multi AI.jpg" alt="Multi AI" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Multi AI</div></div>
    </a>

    <a href="Braille Generator.html" class="card">
      <img src="Braille Generator.jpg" alt="Braille Generator" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Braille Generator</div></div>
    </a>

    <a href="Foto Editor.html" class="card">
      <img src="Foto Editor.jpg" alt="Foto Editor" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Foto Editor</div></div>
    </a>

    <a href="Cuaca.html" class="card">
      <img src="Cuaca.jpg" alt="Cuaca" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Informasi Cuaca</div></div>
    </a>

    <a href="Live Score.html" class="card">
      <img src="Live Score.jpg" alt="Live Score" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Live Score</div></div>
    </a>

    <a href="Muslim.html" class="card">
      <img src="Muslim.jpg" alt="Muslim" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Jadwal & Tool Muslim</div></div>
    </a>

    <a href="Omni Sketch.html" class="card">
      <img src="Omni Sketch.jpg" alt="Omni Sketch" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Omni Sketch</div></div>
    </a>

    <a href="PencariFilm.html" class="card">
      <img src="PencariFilm.jpg" alt="Pencari Film" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Pencari Film</div></div>
    </a>

    <a href="RADIO.html" class="card">
      <img src="RADIO.jpg" alt="Radio" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Radio Online</div></div>
    </a>

    <a href="Video Multi.html" class="card">
      <img src="Video Multi.jpg" alt="Video Multi" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Video Multi</div></div>
    </a>

    <a href="YT Subtitle.html" class="card">
      <img src="YT Subtitle.jpg" alt="YT Subtitle" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">YouTube Subtitle</div></div>
    </a>
  </div>

</body>
</html>
