<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MA Tools Hub</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 4px;
    }
    header p {
      font-size: 12px;
      color: #8b949e;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background-color: #21262d;
    }
    .card-body {
      padding: 10px 8px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <header>
    <h1>🛠️ MA Tools Portal</h1>
    <p>Kumpulan alat web serbaguna</p>
  </header>

  <div class="grid">
    <a href="Braille Generator.html" class="card">
      <img src="Braille Generator.png" alt="Braille Generator" onerror="this.style.display='none'">
      <div class="card-body"><div class="card-title">Braille Generator</div></div>
    </a>

    <a href="Catatan Presisi.html" class="card">
      <img src="Catatan Presisi.png" alt="Catatan Presisi" onerror="this.style.display='none'">

    </a>

    <a href="Cuaca.html" class="card">

    </a>

    <a href="Editor Html.html" class="card">
      <img src="Editor Html.png" alt="Editor HTML" onerror="this.style.display='none'">

    <a href="Foto Editor.html" class="card">

    <a href="Movie Search.html" class="card">

    <a href="Multi AI.html" class="card">

    <a href="MultiUtility.html" class="card">
      <img src="MultiUtility.png" alt="Multi Utility" onerror="this.style.display='none'">

    <a href="Muslim.html" class="card">

    <a href="Radio.html" class="card">

  </div>

</body>
</html>
