<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>MA Temp Mail</title>
<style>
:root{--bg:#080c16;--card:#101728;--card2:#151d30;--line:#263149;--text:#eef3ff;--muted:#8f9bb3;--accent:#6ea8ff;--danger:#ff6b7a;--ok:#53d39b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16213a 0,#080c16 45%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
header{padding:8px 4px 16px}.brand{font-size:25px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:rgba(16,23,40,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 12px 30px #0005}
.address{display:flex;gap:8px;align-items:center;background:#0a1020;border:1px solid var(--line);border-radius:13px;padding:12px}
.email{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer}
button.secondary{background:#202a40}button.danger{background:#8e2937}button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.status{font-size:12px;color:var(--muted);margin-top:9px}
.inbox-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title{font-weight:800}.count{font-size:12px;color:var(--muted)}
.mail{padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--card2);margin-top:8px;cursor:pointer}
.mail:hover{border-color:#46618f}.from{font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subject{font-weight:750;margin:4px 0}.date{font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:13px}
.reader{display:none}.reader.show{display:block}.back{margin-bottom:12px}.meta{color:var(--muted);font-size:12px;line-height:1.6}.body{margin-top:14px;background:#0a1020;border:1px solid var(--line);border-radius:13px;padding:14px;overflow:auto;line-height:1.55}
.notice{font-size:11px;color:var(--muted);line-height:1.5}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:430px){.actions{grid-template-columns:1fr}.address{align-items:flex-start}.address button{padding:9px 11px}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand">📧 MA Temp Mail</div><div class="sub">Email sementara, langsung dari browser</div></header>

<section id="mainView">
<div class="card">
  <div class="address"><div id="email" class="email">Membuat alamat...</div><button class="secondary" id="copyBtn" onclick="copyEmail()" disabled>Copy</button></div>
  <div class="actions">
    <button id="newBtn" onclick="newMailbox()">＋ Email Baru</button>
    <button class="secondary" id="refreshBtn" onclick="loadInbox()">↻ Refresh Inbox</button>
  </div>
  <div id="status" class="status"><span class="spinner"></span>Menyiapkan mailbox...</div>
</div>

<div class="card">
  <div class="inbox-head"><div class="title">Inbox</div><div id="count" class="count">0 email</div></div>
  <div id="inbox"><div class="empty">Menunggu email masuk...</div></div>
</div>

<div class="card notice">
  Untuk penggunaan sementara/non-rahasia. Jangan gunakan alamat ini untuk akun penting, password, atau data sensitif. Layanan inbox disediakan oleh <a href="https://tempmailportal.com/" target="_blank" rel="noopener">TempMailPortal</a>.
</div>
</section>

<section id="readerView" class="reader">
  <button class="secondary back" onclick="showInbox()">← Kembali ke Inbox</button>
  <div class="card">
    <div id="rSubject" class="title">Email</div>
    <div id="rMeta" class="meta"></div>
    <div id="rBody" class="body"></div>
  </div>
</section>
</main>

<script>
const API='https://api.tempmailportal.com';
let token='', address='', messages=[], timer=null;

const $=id=>document.getElementById(id);
function setStatus(t,loading=false){$('status').innerHTML=(loading?'<span class="spinner"></span>':'')+t}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function authHeaders(){return token?{Authorization:'Bearer '+token}:{}}

async function api(path,opts={}){
  const headers={Accept:'application/json',...(opts.headers||{})};
  if(opts.body) headers['Content-Type']='application/json';
  Object.assign(headers,authHeaders());
  const r=await fetch(API+path,{...opts,headers});
  if(!r.ok){
    let msg='HTTP '+r.status;
    try{msg=(await r.json()).error||msg}catch{}
    throw Error(msg);
  }
  return r.status===204?null:r.json();
}

async function newMailbox(){
  clearInterval(timer);
  token=''; address='';
  $('newBtn').disabled=true; $('copyBtn').disabled=true;
  $('email').textContent='Membuat alamat...';
  $('inbox').innerHTML='<div class="empty">Menyiapkan mailbox...</div>';
  setStatus('Membuat alamat email...',true);

  try{
    const x=await api('/api/inbox',{method:'POST'});
    address=x.address;
    token=x.token;

    $('email').textContent=address;
    $('copyBtn').disabled=false;

    localStorage.setItem('ma_temp_session',JSON.stringify({address,token}));
    messages=[];
    renderInbox();
    setStatus('Mailbox aktif • menunggu email');
    await loadInbox();
    timer=setInterval(loadInbox,10000);
  }catch(e){
    $('email').textContent='Gagal membuat email';
    $('copyBtn').disabled=true;
    setStatus('Gagal: '+esc(e.message||'Failed to fetch'));
    $('inbox').innerHTML='<div class="empty">Tidak dapat membuat mailbox.<br>Coba tekan <b>Email Baru</b> lagi.</div>';
  }finally{
    $('newBtn').disabled=false;
  }
}

async function loadInbox(){
  if(!token)return;
  $('refreshBtn').disabled=true;
  try{
    const data=await api('/api/messages');
    messages=Array.isArray(data)?data:[];
    renderInbox();
    setStatus(messages.length?'Inbox diperbarui ✓':'Mailbox aktif • belum ada email');
  }catch(e){
    setStatus('Inbox gagal dimuat: '+esc(e.message));
  }finally{
    $('refreshBtn').disabled=false;
  }
}

function renderInbox(){
  $('count').textContent=messages.length+' email';
  if(!messages.length){
    $('inbox').innerHTML='<div class="empty">📭 Belum ada email masuk.<br>Inbox otomatis dicek setiap 10 detik.</div>';
    return;
  }
  $('inbox').innerHTML=messages.map((m,i)=>`
    <div class="mail" onclick="openMessage(${i})">
      <div class="from">${esc(m.fromName?m.fromName+' • ':'')}${esc(m.from||'Unknown')}</div>
      <div class="subject">${esc(m.subject||'(Tanpa subjek)')}</div>
      <div class="date">${esc(new Date(m.date).toLocaleString('id-ID'))}</div>
      ${m.intro?`<div class="date" style="margin-top:4px">${esc(m.intro)}</div>`:''}
    </div>`).join('');
}

async function openMessage(i){
  const m=messages[i];
  try{
    const full=await api('/api/messages/'+encodeURIComponent(m.id));
    $('rSubject').textContent=full.subject||'(Tanpa subjek)';
    $('rMeta').innerHTML=
      'Dari: '+esc(full.fromName?full.fromName+' • '+full.from:full.from||'-')+
      '<br>'+esc(new Date(full.date).toLocaleString('id-ID'));
    // TempMailPortal returns sanitized HTML according to its documentation.
    $('rBody').innerHTML=full.html||('<pre style="white-space:pre-wrap;margin:0">'+esc(full.text||'Tidak ada isi.')+'</pre>');
    $('mainView').style.display='none';
    $('readerView').classList.add('show');
  }catch(e){
    alert('Gagal membuka email: '+e.message);
  }
}

function showInbox(){
  $('readerView').classList.remove('show');
  $('mainView').style.display='block';
}

async function copyEmail(){
  try{
    await navigator.clipboard.writeText(address);
    setStatus('Alamat email berhasil disalin ✓');
  }catch{
    alert(address);
  }
}

async function deleteInbox(){
  if(!token)return;
  try{await api('/api/inbox',{method:'DELETE'});}catch{}
  clearInterval(timer);
  token='';address='';messages=[];
  localStorage.removeItem('ma_temp_session');
  $('email').textContent='Mailbox dihapus';
  $('copyBtn').disabled=true;
  renderInbox();
  setStatus('Mailbox dihapus');
}

function restore(){
  try{
    const x=JSON.parse(localStorage.getItem('ma_temp_session')||'null');
    if(x?.token&&x?.address){
      token=x.token;address=x.address;
      $('email').textContent=address;
      $('copyBtn').disabled=false;
      setStatus('Mailbox dipulihkan • mengecek inbox',true);
      loadInbox();
      timer=setInterval(loadInbox,10000);
      return true;
    }
  }catch{}
  return false;
}

if(!restore())newMailbox();
</script>
</body>
</html>
