<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Sholat & Al-Qur'an Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #12181b; color: #f0f0f0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }
    
    /* Header & Navigation Tabs */
    .app-header { text-align: center; margin-bottom: 15px; }
    .app-header h2 { color: #4db6ac; font-size: 1.4rem; }
    
    .nav-tabs { display: flex; background: #1e272c; border-radius: 10px; padding: 4px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #a0a0a0; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .tab-btn.active { background: #4db6ac; color: #12181b; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Component: Cards & Buttons */
    .card { background: #1e272c; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #37474f; background: #12181b; color: #fff; font-size: 0.9rem; margin-bottom: 10px; }
    .btn { background: #4db6ac; color: #12181b; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    
    /* Tab 1: Sholat Styling */
    .next-prayer-box { text-align: center; background: linear-gradient(135deg, #004d40, #1e272c); border: 1px solid #4db6ac; }
    .next-prayer-title { font-size: 0.85rem; color: #b0bec5; }
    .next-prayer-name { font-size: 1.5rem; color: #ffca28; font-weight: bold; margin: 4px 0; }
    .countdown { font-size: 1.1rem; color: #fff; font-family: monospace; }
    
    .sholat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .sholat-item { background: #263238; padding: 12px; border-radius: 8px; text-align: center; }
    .sholat-item.highlight { border: 1px solid #ffca28; background: #2e3b41; }
    .sholat-name { font-size: 0.85rem; color: #b0bec5; display: block; }
    .sholat-time { font-size: 1.1rem; font-weight: bold; color: #4db6ac; margin-top: 4px; }

    /* Tab 2: Quran Styling */
    .audio-player { width: 100%; margin-top: 10px; height: 35px; }
    .ayat-card { background: #1e272c; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-bottom: 2px solid #263238; }
    .ayat-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .ayat-num { background: #4db6ac; color: #12181b; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; }
    .ayat-arab { font-family: 'Amiri', serif; font-size: 1.5rem; text-align: right; line-height: 2.2rem; color: #fff; margin-bottom: 10px; direction: rtl; }
    .ayat-latin { font-size: 0.85rem; color: #4db6ac; font-style: italic; margin-bottom: 5px; }
    .ayat-indo { font-size: 0.85rem; color: #cfd8dc; line-height: 1.2rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="app-header">
    <h2>Muslim Tools</h2>
  </div>

  <!-- Tab Switcher -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('sholat')">🕌 Jadwal Sholat</button>
    <button class="tab-btn" onclick="switchTab('quran')">📖 Al-Qur'an</button>
  </div>

  <!-- TAB 1: JADWAL SHOLAT -->
  <div id="tab-sholat" class="tab-content active">
    <div class="card">
      <select id="citySelect" onchange="loadPrayerByCity()">
        <option value="Jakarta">Jakarta</option>
        <option value="Surabaya">Surabaya</option>
        <option value="Bandung">Bandung</option>
        <option value="Medan">Medan</option>
        <option value="Makassar">Makassar</option>
        <option value="Yogyakarta">Yogyakarta</option>
        <option value="Semarang">Semarang</option>
      </select>
      <button class="btn" onclick="useGPS()">📍 Gunakan Lokasi GPS HP</button>
    </div>

    <div class="card next-prayer-box">
      <div class="next-prayer-title">Menuju Waktu Sholat Berikutnya</div>
      <div id="nextPrayerName" class="next-prayer-name">Memuat...</div>
      <div id="countdown" class="countdown">- : - : -</div>
    </div>

    <div id="sholatGrid" class="sholat-grid">
      <!-- Jadwal sholat diisi via JS -->
    </div>
  </div>

  <!-- TAB 2: AL-QUR'AN DIGITAL -->
  <div id="tab-quran" class="tab-content">
    <div class="card">
      <select id="surahSelect" onchange="loadSurahDetail(this.value)">
        <option value="">-- Pilih Surah --</option>
      </select>
      <div id="surahInfo" style="margin-top: 10px; display: none; text-align: center;">
        <h3 id="surahTitle" style="color: #4db6ac;"></h3>
        <p id="surahSubtitle" style="font-size: 0.8rem; color: #b0bec5;"></p>
        <audio id="quranAudio" class="audio-player" controls></audio>
      </div>
    </div>

    <div id="ayatList">
      <!-- List ayat diisi via JS -->
    </div>
  </div>
</div>

<script>
  // --- APLIKASI TABS ---
  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if(tabName === 'sholat') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-sholat').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-quran').classList.add('active');
      if(surahListCache.length === 0) fetchSurahList();
    }
  }

  // --- TAB 1: JADWAL SHOLAT LOGIC ---
  let prayerTimings = {};
  let countdownInterval = null;

  async function loadPrayerByCity() {
    const city = document.getElementById('citySelect').value;
    try {
      const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Indonesia&method=11`);
      const data = await res.json();
      prayerTimings = data.data.timings;
      renderSholatGrid();
    } catch (err) {
      alert("Gagal mengambil data jadwal sholat.");
    }
  }

  function useGPS() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        try {
          const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=11`);
          const data = await res.json();
          prayerTimings = data.data.timings;
          renderSholatGrid();
        } catch (err) {
          alert("Gagal mengambil data GPS.");
        }
      }, () => alert("Izin lokasi GPS ditolak."));
    } else {
      alert("Browser/HP kamu tidak mendukung GPS.");
    }
  }

  function renderSholatGrid() {
    const grid = document.getElementById('sholatGrid');
    grid.innerHTML = '';
    
    const listSholat = [
      { name: 'Subuh', key: 'Fajr' },
      { name: 'Terbit', key: 'Sunrise' },
      { name: 'Dzuhur', key: 'Dhuhr' },
      { name: 'Ashar', key: 'Asr' },
      { name: 'Maghrib', key: 'Maghrib' },
      { name: 'Isya', key: 'Isha' }
    ];

    listSholat.forEach(item => {
      grid.innerHTML += `
        <div class="sholat-item" id="item-${item.key}">
          <span class="sholat-name">${item.name}</span>
          <div class="sholat-time">${prayerTimings[item.key]}</div>
        </div>
      `;
    });

    startCountdown(listSholat);
  }

  function startCountdown(listSholat) {
    if (countdownInterval) clearInterval(countdownInterval);

    countdownInterval = setInterval(() => {
      const now = new Date();
      let nextPrayer = null;

      for (let item of listSholat) {
        const [hours, minutes] = prayerTimings[item.key].split(':');
        const prayerTime = new Date();
        prayerTime.setHours(hours, minutes, 0, 0);

        if (prayerTime > now) {
          nextPrayer = { name: item.name, time: prayerTime, key: item.key };
          break;
        }
      }

      // Jika lewat Isya, target sholat berikutnya adalah Subuh besok
      if (!nextPrayer) {
        const [hours, minutes] = prayerTimings['Fajr'].split(':');
        const tomorrowFajr = new Date();
        tomorrowFajr.setDate(tomorrowFajr.getDate() + 1);
        tomorrowFajr.setHours(hours, minutes, 0, 0);
        nextPrayer = { name: 'Subuh', time: tomorrowFajr, key: 'Fajr' };
      }

      document.querySelectorAll('.sholat-item').forEach(el => el.classList.remove('highlight'));
      document.getElementById(`item-${nextPrayer.key}`)?.classList.add('highlight');

      const diff = nextPrayer.time - now;
      const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
      const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
      const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');

      document.getElementById('nextPrayerName').innerText = nextPrayer.name;
      document.getElementById('countdown').innerText = `${h} : ${m} : ${s}`;
    }, 1000);
  }

  // --- TAB 2: AL-QUR'AN LOGIC ---
  let surahListCache = [];

  async function fetchSurahList() {
    const select = document.getElementById('surahSelect');
    select.innerHTML = '<option>Memuat daftar surah...</option>';
    try {
      const res = await fetch('https://equran.id/api/v2/surat');
      const data = await res.json();
      surahListCache = data.data;

      select.innerHTML = '<option value="">-- Pilih Surah --</option>';
      surahListCache.forEach(surah => {
        select.innerHTML += `<option value="${surah.nomor}">${surah.nomor}. ${surah.namaLatin} (${surah.arti})</option>`;
      });
    } catch (err) {
      select.innerHTML = '<option>Gagal memuat surah</option>';
    }
  }

  async function loadSurahDetail(nomor) {
    if (!nomor) return;
    const ayatList = document.getElementById('ayatList');
    const infoBox = document.getElementById('surahInfo');
    
    ayatList.innerHTML = '<div style="text-align:center; padding:20px; color:#ffca28;">Memuat ayat Al-Qur\'an...</div>';
    infoBox.style.display = 'none';

    try {
      const res = await fetch(`https://equran.id/api/v2/surat/${nomor}`);
      const result = await res.json();
      const surah = result.data;

      // Header Info & Audio
      document.getElementById('surahTitle').innerText = `${surah.namaLatin} (${surah.nama})`;
      document.getElementById('surahSubtitle').innerText = `${surah.tempatTurun} • ${surah.jumlahAyat} Ayat • "${surah.arti}"`;
      document.getElementById('quranAudio').src = surah.audioFull['05']; // Qori Misyari Rasyid
      infoBox.style.display = 'block';

      // List Ayat
      ayatList.innerHTML = '';
      surah.ayat.forEach(item => {
        ayatList.innerHTML += `
          <div class="ayat-card">
            <div class="ayat-header">
              <div class="ayat-num">${item.nomorAyat}</div>
            </div>
            <div class="ayat-arab">${item.teksArab}</div>
            <div class="ayat-latin">${item.teksLatin}</div>
            <div class="ayat-indo">${item.teksIndonesia}</div>
          </div>
        `;
      });
    } catch (err) {
      ayatList.innerHTML = '<div style="text-align:center; color:#ff5252;">Gagal memuat detail ayat.</div>';
    }
  }

  // Load awal
  loadPrayerByCity();
</script>

</body>
</html>
