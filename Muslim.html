<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MA-MuslimTools v3.0</title>

  <!-- Google Fonts: Amiri (Arab) & Plus Jakarta Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b1329;
      --bg-card: #152238;
      --bg-card-hover: #1e2d4a;
      --accent-primary: #10b981;
      --accent-hover: #059669;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-gold: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #243452;
      
      /* Safe Zone Top & Bottom Guarantee */
      --safe-top: max(env(safe-area-inset-top, 0px), 36px);
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 10px);
      padding-bottom: calc(var(--safe-bottom) + 12px);
      overflow-x: hidden;
    }

    /* Sticky Header dengan Top Safe Zone */
    header {
      background-color: rgba(21, 34, 56, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      margin-top: calc(-1 * (var(--safe-top) + 10px));
      padding-top: calc(var(--safe-top) + 10px);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .badge {
      font-size: 10px;
      background: var(--border-color);
      color: var(--accent-cyan);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      padding: 14px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Tab Switcher Navigation */
    .source-tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .source-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 6px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 42px;
    }

    .source-tab-btn.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      color: #000;
    }

    /* Cards Layout */
    .card {
      background-color: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .input-field, select.input-field {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      outline: none;
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--accent-primary);
    }

    .btn {
      appearance: none;
      border: none;
      background-color: var(--bg-card-hover);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 44px;
      touch-action: manipulation;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      color: #000;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-action {
      background: var(--bg-card-hover);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      transition: all 0.2s ease;
    }

    .btn:active, .btn-action:active { transform: scale(0.97); }

    /* Tab 1: Sholat Styles */
    .next-prayer-card {
      text-align: center;
      background: linear-gradient(135deg, #0d382c 0%, var(--bg-card) 100%);
      border: 1px solid var(--accent-primary);
    }

    .next-prayer-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .next-prayer-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent-gold);
      margin: 4px 0;
    }

    .countdown {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      font-family: monospace;
      letter-spacing: 1px;
    }

    .sholat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .sholat-item {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .sholat-item.highlight {
      border-color: var(--accent-gold);
      background: rgba(251, 191, 36, 0.1);
    }

    .sholat-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: block;
    }

    .sholat-time {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-top: 4px;
    }

    /* Tab 2: Quran Styles */
    .audio-player {
      width: 100%;
      margin-top: 10px;
      height: 40px;
      border-radius: 8px;
    }

    .ayat-card {
      background: var(--bg-card);
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ayat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ayat-num {
      background: var(--accent-primary);
      color: #000;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }

    .ayat-arab {
      font-family: 'Amiri', serif;
      font-size: 26px;
      text-align: right;
      line-height: 2.2;
      color: var(--accent-gold);
      direction: rtl;
    }

    .ayat-latin {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-cyan);
      font-style: italic;
      line-height: 1.4;
    }

    .ayat-indo {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Tab 3: Doa Styles */
    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: 26px;
      line-height: 2;
      text-align: right;
      color: var(--accent-gold);
      direction: rtl;
      padding: 6px 0;
    }

    .latin-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-cyan);
      font-style: italic;
      line-height: 1.5;
    }

    .translation-text {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Status Banner & Spinner */
    .status-banner {
      background-color: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(6, 182, 212, 0.3);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #1e293b;
      color: #fff;
      border: 1px solid var(--accent-primary);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">🕌</div>
      <div class="brand-title">MA-MuslimTools</div>
    </div>
    <span class="badge">v3.0 All-In-One</span>
  </header>

  <main>
    <!-- Tab Switcher Navigation -->
    <div class="source-tabs">
      <button class="source-tab-btn active" onclick="switchTab('sholat', event)">🕌 Jadwal Sholat</button>
      <button class="source-tab-btn" onclick="switchTab('quran', event)">📖 Al-Qur'an</button>
      <button class="source-tab-btn" onclick="switchTab('doa', event)">🤲 Kumpulan Doa</button>
    </div>

    <!-- TAB 1: JADWAL SHOLAT -->
    <div id="panelSholat" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="card">
        <select id="citySelect" class="input-field" onchange="loadPrayerByCity()">
          <option value="Jakarta">Jakarta</option>
          <option value="Surabaya">Surabaya</option>
          <option value="Bandung">Bandung</option>
          <option value="Medan">Medan</option>
          <option value="Makassar">Makassar</option>
          <option value="Yogyakarta">Yogyakarta</option>
          <option value="Semarang">Semarang</option>
          <option value="Palembang">Palembang</option>
          <option value="Denpasar">Denpasar</option>
        </select>
        <button class="btn btn-primary" onclick="useGPS()">
          📍 Gunakan Lokasi GPS HP
        </button>
      </div>

      <div class="card next-prayer-card">
        <div class="next-prayer-title">Menuju Waktu Sholat Berikutnya</div>
        <div id="nextPrayerName" class="next-prayer-name">Memuat...</div>
        <div id="countdown" class="countdown">- : - : -</div>
      </div>

      <div id="sholatGrid" class="sholat-grid"></div>
    </div>

    <!-- TAB 2: AL-QUR'AN DIGITAL -->
    <div id="panelQuran" class="hidden" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="card">
        <select id="surahSelect" class="input-field" onchange="loadSurahDetail(this.value)">
          <option value="">-- Pilih Surah --</option>
        </select>

        <div id="surahInfo" class="hidden" style="margin-top: 10px; text-align: center;">
          <h3 id="surahTitle" style="color: var(--accent-cyan); font-size: 16px; font-weight: 800;"></h3>
          <p id="surahSubtitle" style="font-size: 12px; color: var(--text-muted); margin-top: 4px;"></p>
          <audio id="quranAudio" class="audio-player" controls></audio>
        </div>
      </div>

      <div class="status-banner hidden" id="quranStatusBanner">
        <div class="spinner"></div>
        <span id="quranStatusText">Memuat ayat Al-Qur'an...</span>
      </div>

      <div id="ayatList"></div>
    </div>

    <!-- TAB 3: KUMPULAN DOA (MYQURAN API) -->
    <div id="panelDoa" class="hidden" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="card">
        <input type="text" id="searchDoaInput" class="input-field" placeholder="🔍 Cari doa (misal: makan, tidur, tua, masjid)..." oninput="filterDoa()">
      </div>

      <div class="status-banner" id="doaStatusBanner">
        <div class="spinner"></div>
        <span id="doaStatusText">Mengambil data doa dari API MyQuran...</span>
      </div>

      <div id="doaListContainer" style="display: flex; flex-direction: column; gap: 14px;"></div>
    </div>
  </main>

  <div class="toast" id="toast">Notifikasi</div>

  <script>
    // --- APP GLOBAL STATE ---
    const toast = document.getElementById('toast');
    
    // Panels
    const panelSholat = document.getElementById('panelSholat');
    const panelQuran = document.getElementById('panelQuran');
    const panelDoa = document.getElementById('panelDoa');

    // --- TAB SWITCHER ---
    function switchTab(tab, e) {
      document.querySelectorAll('.source-tab-btn').forEach(btn => btn.classList.remove('active'));
      if (e) e.target.classList.add('active');

      panelSholat.classList.add('hidden');
      panelQuran.classList.add('hidden');
      panelDoa.classList.add('hidden');

      if (tab === 'sholat') {
        panelSholat.classList.remove('hidden');
      } else if (tab === 'quran') {
        panelQuran.classList.remove('hidden');
        if (surahListCache.length === 0) fetchSurahList();
      } else if (tab === 'doa') {
        panelDoa.classList.remove('hidden');
        if (fetchedDoaList.length === 0) fetchDoaFromMyQuranAPI();
      }
    }

    // --- TAB 1: JADWAL SHOLAT LOGIC ---
    let prayerTimings = {};
    let countdownInterval = null;

    async function loadPrayerByCity() {
      const city = document.getElementById('citySelect').value;
      try {
        const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=Indonesia&method=11`);
        const data = await res.json();
        prayerTimings = data.data.timings;
        renderSholatGrid();
        showToast(`Jadwal Sholat ${city} diperbarui.`);
      } catch (err) {
        showToast("Gagal mengambil jadwal sholat.");
      }
    }

    function useGPS() {
      if (navigator.geolocation) {
        showToast("Mendeteksi lokasi GPS...");
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          try {
            const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=11`);
            const data = await res.json();
            prayerTimings = data.data.timings;
            renderSholatGrid();
            showToast("Jadwal Sholat GPS berhasil diperbarui!");
          } catch (err) {
            showToast("Gagal mengambil data jadwal dari GPS.");
          }
        }, () => showToast("Izin lokasi GPS ditolak."));
      } else {
        showToast("Perangkat tidak mendukung GPS.");
      }
    }

    function renderSholatGrid() {
      const grid = document.getElementById('sholatGrid');
      grid.innerHTML = '';
      
      const listSholat = [
        { name: 'Subuh', key: 'Fajr' },
        { name: 'Terbit', key: 'Sunrise' },
        { name: 'Dzuhur', key: 'Dhuhr' },
        { name: 'Ashar', key: 'Asr' },
        { name: 'Maghrib', key: 'Maghrib' },
        { name: 'Isya', key: 'Isha' }
      ];

      listSholat.forEach(item => {
        grid.innerHTML += `
          <div class="sholat-item" id="item-${item.key}">
            <span class="sholat-name">${item.name}</span>
            <div class="sholat-time">${prayerTimings[item.key]}</div>
          </div>
        `;
      });

      startCountdown(listSholat);
    }

    function startCountdown(listSholat) {
      if (countdownInterval) clearInterval(countdownInterval);

      countdownInterval = setInterval(() => {
        const now = new Date();
        let nextPrayer = null;

        for (let item of listSholat) {
          const [hours, minutes] = prayerTimings[item.key].split(':');
          const prayerTime = new Date();
          prayerTime.setHours(hours, minutes, 0, 0);

          if (prayerTime > now) {
            nextPrayer = { name: item.name, time: prayerTime, key: item.key };
            break;
          }
        }

        if (!nextPrayer) {
          const [hours, minutes] = prayerTimings['Fajr'].split(':');
          const tomorrowFajr = new Date();
          tomorrowFajr.setDate(tomorrowFajr.getDate() + 1);
          tomorrowFajr.setHours(hours, minutes, 0, 0);
          nextPrayer = { name: 'Subuh', time: tomorrowFajr, key: 'Fajr' };
        }

        document.querySelectorAll('.sholat-item').forEach(el => el.classList.remove('highlight'));
        document.getElementById(`item-${nextPrayer.key}`)?.classList.add('highlight');

        const diff = nextPrayer.time - now;
        const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
        const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');

        document.getElementById('nextPrayerName').innerText = nextPrayer.name;
        document.getElementById('countdown').innerText = `${h} : ${m} : ${s}`;
      }, 1000);
    }

    // --- TAB 2: AL-QUR'AN LOGIC ---
    let surahListCache = [];
    const quranStatusBanner = document.getElementById('quranStatusBanner');

    async function fetchSurahList() {
      const select = document.getElementById('surahSelect');
      select.innerHTML = '<option>Memuat daftar surah...</option>';
      try {
        const res = await fetch('https://equran.id/api/v2/surat');
        const data = await res.json();
        surahListCache = data.data;

        select.innerHTML = '<option value="">-- Pilih Surah --</option>';
        surahListCache.forEach(surah => {
          select.innerHTML += `<option value="${surah.nomor}">${surah.nomor}. ${surah.namaLatin} (${surah.arti})</option>`;
        });
      } catch (err) {
        select.innerHTML = '<option>Gagal memuat surah</option>';
        showToast("Gagal memuat daftar surah.");
      }
    }

    async function loadSurahDetail(nomor) {
      if (!nomor) return;
      const ayatList = document.getElementById('ayatList');
      const infoBox = document.getElementById('surahInfo');
      
      quranStatusBanner.classList.remove('hidden');
      ayatList.innerHTML = '';
      infoBox.classList.add('hidden');

      try {
        const res = await fetch(`https://equran.id/api/v2/surat/${nomor}`);
        const result = await res.json();
        const surah = result.data;

        document.getElementById('surahTitle').innerText = `${surah.namaLatin} (${surah.nama})`;
        document.getElementById('surahSubtitle').innerText = `${surah.tempatTurun} • ${surah.jumlahAyat} Ayat • "${surah.arti}"`;
        document.getElementById('quranAudio').src = surah.audioFull['05'];
        infoBox.classList.remove('hidden');

        surah.ayat.forEach(item => {
          ayatList.innerHTML += `
            <div class="ayat-card">
              <div class="ayat-header">
                <div class="ayat-num">${item.nomorAyat}</div>
              </div>
              <div class="ayat-arab">${item.teksArab}</div>
              <div class="ayat-latin">${item.teksLatin}</div>
              <div class="ayat-indo">${item.teksIndonesia}</div>
            </div>
          `;
        });
        quranStatusBanner.classList.add('hidden');
      } catch (err) {
        quranStatusBanner.classList.add('hidden');
        showToast("Gagal memuat detail ayat.");
      }
    }

    // --- TAB 3: KUMPULAN DOA LOGIC ---
    let fetchedDoaList = [];
    const doaListContainer = document.getElementById('doaListContainer');
    const doaStatusBanner = document.getElementById('doaStatusBanner');
    const doaStatusText = document.getElementById('doaStatusText');

    async function fetchDoaFromMyQuranAPI() {
      doaStatusBanner.classList.remove('hidden');
      doaStatusText.innerText = "Mengambil data doa dari API MyQuran...";

      try {
        const response = await fetch('https://open-api.myquran.com/v2/doa/semua');
        const result = await response.json();

        if (result && result.status && result.data) {
          fetchedDoaList = result.data.map(item => ({
            id: item.id,
            title: item.judul || "Doa Harian",
            arabic: item.arab || "",
            latin: item.latin || "",
            translation: item.terjemah || ""
          }));

          doaStatusBanner.classList.add('hidden');
          renderDoaList(fetchedDoaList);
          showToast(`Berhasil memuat ${fetchedDoaList.length} Doa!`);
        } else {
          throw new Error("Format API tidak sesuai");
        }
      } catch (err) {
        console.warn("API Error, fallback lokal:", err);
        doaStatusText.innerText = "Mode Offline: Menampilkan Doa Lokal.";
        
        fetchedDoaList = [
          {
            id: 1,
            title: "Doa Sebelum Makan",
            arabic: "اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ",
            latin: "Allahumma baarik lanaa fiimaa razaqtanaa wa qinaa 'adzaaban-naar.",
            translation: "Ya Allah, berkahilah kami dalam rezeki yang telah Engkau berikan kepada kami dan peliharalah kami dari siksa neraka."
          },
          {
            id: 2,
            title: "Doa Setelah Makan",
            arabic: "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مِنَ الْمُسْلِمِينَ",
            latin: "Alhamdu lillaahilladzii ath'amanaa wa saqaanaa wa ja'alanaa minal muslimiin.",
            translation: "Segala puji bagi Allah yang telah memberi kami makan dan minum serta menjadikan kami bagian dari orang-orang muslim."
          },
          {
            id: 3,
            title: "Doa Sebelum Tidur",
            arabic: "بِاسْمِكَ اللَّهُمَّ أَحْيَا وَبِاسْمِكَ أَمُوتُ",
            latin: "Bismikallahumma ahyaa wa bismika amuut.",
            translation: "Dengan nama-Mu ya Allah aku hidup dan dengan nama-Mu aku mati."
          },
          {
            id: 4,
            title: "Doa Bangun Tidur",
            arabic: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ",
            latin: "Alhamdu lillaahilladzii ahyaanaa ba'da maa amaatanaa wa ilaihin-nusyuur.",
            translation: "Segala puji bagi Allah yang telah menghidupkan kami kembali setelah mematikan kami, dan hanya kepada-Nya kami dibangkitkan."
          },
          {
            id: 5,
            title: "Doa Untuk Kedua Orang Tua",
            arabic: "رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا",
            latin: "Rabbighfir lii wa liwaalidayya warhamhumaa kamaa rabbayaanii shaghiiraa.",
            translation: "Ya Tuhanku, ampunilah aku dan kedua orang tuaku, dan sayangilah keduanya sebagaimana mereka merawatku di waktu kecil."
          }
        ];

        setTimeout(() => doaStatusBanner.classList.add('hidden'), 2000);
        renderDoaList(fetchedDoaList);
      }
    }

    function renderDoaList(list) {
      doaListContainer.innerHTML = '';
      
      if (list.length === 0) {
        doaListContainer.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted); font-size:13px;">Doa tidak ditemukan.</div>';
        return;
      }

      list.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="font-size: 15px; font-weight: 800; color: var(--accent-primary);">${item.title}</div>
          ${item.arabic ? `<div class="arabic-text">${item.arabic}</div>` : ''}
          ${item.latin ? `<div class="latin-text">${item.latin}</div>` : ''}
          ${item.translation ? `<div class="translation-text"><strong>Artinya:</strong> "${item.translation}"</div>` : ''}
          <button class="btn-action" onclick="copyDoa('${escapeHtml(item.title)}', '${escapeHtml(item.arabic)}', '${escapeHtml(item.latin)}', '${escapeHtml(item.translation)}')">
            📋 Salin Teks Doa
          </button>
        `;
        doaListContainer.appendChild(card);
      });
    }

    function filterDoa() {
      const keyword = document.getElementById('searchDoaInput').value.toLowerCase().trim();
      const filtered = fetchedDoaList.filter(item => 
        (item.title && item.title.toLowerCase().includes(keyword)) ||
        (item.latin && item.latin.toLowerCase().includes(keyword)) ||
        (item.translation && item.translation.toLowerCase().includes(keyword))
      );
      renderDoaList(filtered);
    }

    function copyDoa(title, arabic, latin, translation) {
      const textToCopy = `${title}\n\n${arabic}\n\n${latin}\n\nArtinya: "${translation}"`;
      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast("Doa berhasil disalin!");
      }).catch(() => {
        showToast("Gagal menyalin doa.");
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/\n/g, " ");
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Inisialisasi awal
    loadPrayerByCity();
  </script>
</body>
</html>
