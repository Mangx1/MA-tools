<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MA-UniversalStreamPlayer</title>
  
  <!-- HLS Engine -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Shaka Player Engine (DASH & DRM Support) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --accent-primary: #10b981;
      --accent-hover: #059669;
      --accent-cyan: #06b6d4;
      --accent-amber: #ffca28;
      --accent-orange: #f97316;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      
      /* Safe Zone Top & Bottom Guarantee */
      --safe-top: max(env(safe-area-inset-top, 0px), 36px);
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 10px);
      padding-bottom: calc(var(--safe-bottom) + 12px);
      overflow-x: hidden;
    }

    /* Sticky Header dengan Top Safe Zone */
    header {
      background-color: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      margin-top: calc(-1 * (var(--safe-top) + 10px));
      padding-top: calc(var(--safe-top) + 10px);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #000;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .badge {
      font-size: 10px;
      background: var(--border-color);
      color: var(--accent-cyan);
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      padding: 14px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Tab Switcher Source */
    .source-tabs {
      display: flex;
      gap: 8px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .source-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 40px;
    }

    .source-tab-btn.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      color: #000;
    }

    /* Video Player Container */
    .player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    video::cue {
      background-color: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      font-size: 16px;
      font-family: sans-serif;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .subtitle-overlay {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.75);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      pointer-events: none;
      max-width: 90%;
      line-height: 1.3;
      display: none;
      z-index: 20;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      transition: all 0.1s ease;
    }

    /* Minimalist Floating Icon Fullscreen Button */
    .btn-fullscreen-icon {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      opacity: 0.7;
    }

    .btn-fullscreen-icon:hover, .btn-fullscreen-icon:active {
      opacity: 1;
      background: rgba(15, 23, 42, 0.85);
      transform: scale(1.05);
    }

    .btn-fullscreen-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .input-field, select.input-field {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      outline: none;
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--accent-primary);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .btn, .btn-label {
      appearance: none;
      border: none;
      background-color: var(--bg-card-hover);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      min-height: 42px;
      touch-action: manipulation;
      width: 100%;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      color: #000;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-vlc {
      background: linear-gradient(135deg, var(--accent-orange), #c2410c);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
    }

    .btn-small {
      padding: 6px 12px;
      min-height: 34px;
      font-size: 12px;
      width: auto;
    }

    .btn:active, .btn-label:active { transform: scale(0.97); }

    /* Hidden File Inputs */
    input[type="file"] {
      display: none !important;
      opacity: 0;
      width: 0;
      height: 0;
    }

    input[type="color"] {
      border: none;
      width: 100%;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      background: var(--bg-main);
    }

    /* Video Information Grid */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .info-item {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .info-value {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-cyan);
      word-break: break-word;
    }

    .status-banner {
      background-color: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(6, 182, 212, 0.3);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #1e293b;
      color: #fff;
      border: 1px solid var(--accent-primary);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Sticky Header dengan Top Safe Area -->
  <header>
    <div class="brand">
      <div class="brand-logo">MA</div>
      <div class="brand-title">MA-UniversalStreamPlayer</div>
    </div>
    <span class="badge">v4.4 Native Picker</span>
  </header>

  <main>
    <!-- Video Player Container & Overlay Subtitle -->
    <div class="player-wrapper" id="playerWrapper">
      <!-- Minimalist Icon Fullscreen Button -->
      <button class="btn-fullscreen-icon" onclick="toggleContainerFullscreen()" title="Layar Penuh">
        <svg viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>
      <video id="videoPlayer" controls playsinline></video>
      <div id="subtitleOverlay" class="subtitle-overlay"></div>
    </div>

    <!-- Status Loading Engine -->
    <div class="status-banner hidden" id="statusBanner">
      <div class="spinner"></div>
      <span id="statusText">Memuat stream...</span>
    </div>

    <!-- Source Tabs Selector -->
    <div class="source-tabs">
      <button class="source-tab-btn active" onclick="switchTab('stream', event)">Single Stream Link</button>
      <button class="source-tab-btn" onclick="switchTab('local', event)">File Video Lokal</button>
      <button class="source-tab-btn" onclick="switchTab('srt', event)">Pengaturan Subtitle SRT</button>
    </div>

    <!-- PANEL 1: Single Stream URL -->
    <div class="card" id="panelStream">
      <div class="input-group">
        <label>URL STREAM (HLS .m3u8, DASH .mpd, Direct MP4/MKV)</label>
        <div class="input-row">
          <input type="url" id="streamUrlInput" class="input-field" placeholder="https://domain.com/stream.m3u8">
          <button class="btn btn-primary" style="width: auto;" onclick="playSingleUrl()">Putar Web</button>
        </div>
      </div>

      <!-- VLC Native App Bridge -->
      <div class="input-group">
        <label>OPSI STREAM ALTERNATIF (NATIVE ENGINE):</label>
        <button class="btn btn-vlc" onclick="openInVlcApp()">
          🍊 Buka & Putar Langsung di Aplikasi VLC (Bypass Semua CORS)
        </button>
      </div>

      <div class="input-group">
        <label>DRM LICENSE SERVER URL (Opsional / Widevine)</label>
        <input type="url" id="drmLicenseInput" class="input-field" placeholder="https://license.domain.com/widevine">
      </div>
    </div>

    <!-- PANEL 2: File Video Lokal (Menggunakan Native Label Bridge) -->
    <div class="card hidden" id="panelLocal">
      <div class="input-group">
        <label>PILIH FILE VIDEO LOKAL (MP4, MKV, WebM, MOV, TS)</label>
        <!-- Label Berfungsi Sebagai Tombol Native Pemicu File Picker OS -->
        <label for="localVideoInput" class="btn-label btn-primary">
          🎬 Pilih Video dari Galeri / File
        </label>
        <input type="file" id="localVideoInput" accept="video/*, .mp4, .mkv, .webm, .mov, .ts, .mkv, .flv" onchange="playLocalVideo(event)">
      </div>
    </div>

    <!-- PANEL 3: SRT Subtitle Engine (Menggunakan Native Label Bridge) -->
    <div class="card hidden" id="panelSrt">
      <div class="input-group">
        <label>UNGGAH FILE SUBTITLE (.SRT)</label>
        <!-- Label Berfungsi Sebagai Tombol Native Pemicu File Picker OS -->
        <label for="srtFileInput" class="btn-label btn-primary">
          💬 Unggah File Subtitle (.srt)
        </label>
        <input type="file" id="srtFileInput" accept=".srt, .txt, text/plain, text/vtt, application/x-subrip" onchange="loadSrtFromFile(event)">
      </div>

      <div class="input-group">
        <label>ATAU MASUKKAN URL SUBTITLE (.SRT)</label>
        <div class="input-row">
          <input type="url" id="srtUrlInput" class="input-field" placeholder="https://domain.com/subtitles.srt">
          <button class="btn" style="width: auto;" onclick="loadSrtFromUrl()">Muat SRT</button>
        </div>
      </div>

      <!-- Control Adjustments -->
      <div class="card" style="background: var(--bg-main); padding: 12px; border-radius: 12px;">
        <div class="input-group">
          <label>DELAY SUBTITLE (SINKRONISASI DETIK): <span id="srtDelayVal" style="color:var(--accent-amber);">0.0s</span></label>
          <div class="input-row" style="align-items: center;">
            <button class="btn btn-small" onclick="adjustSrtDelay(-1.0)">-1s</button>
            <button class="btn btn-small" onclick="adjustSrtDelay(-0.1)">-0.1s</button>
            <input type="number" id="srtDelayInput" class="input-field" step="0.1" value="0.0" style="text-align: center;" onchange="setSrtDelay(parseFloat(this.value))">
            <button class="btn btn-small" onclick="adjustSrtDelay(0.1)">+0.1s</button>
            <button class="btn btn-small" onclick="adjustSrtDelay(1.0)">+1s</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;">
          <div class="input-group">
            <label>UKURAN FONT: <span id="srtSizeVal">16px</span></label>
            <input type="range" id="srtSizeInput" min="12" max="36" value="16" oninput="updateSrtStyle()" style="accent-color:var(--accent-primary); height:24px;">
          </div>
          <div class="input-group">
            <label>TRANSPARANSI BG: <span id="srtBgAlphaVal">75%</span></label>
            <input type="range" id="srtBgAlphaInput" min="0" max="100" value="75" oninput="updateSrtStyle()" style="accent-color:var(--accent-primary); height:24px;">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;">
          <div class="input-group">
            <label>WARNA TEKS SUBTITLE</label>
            <input type="color" id="srtTextColorInput" value="#ffffff" onchange="updateSrtStyle()">
          </div>
          <div class="input-group">
            <label>WARNA BACKGROUND</label>
            <input type="color" id="srtBgColorInput" value="#000000" onchange="updateSrtStyle()">
          </div>
        </div>
      </div>
    </div>

    <!-- PANEL 4: Detailed Video Media Information -->
    <div class="card">
      <div style="font-size: 12px; font-weight: 800; color: var(--accent-cyan); display: flex; align-items: center; gap: 6px;">
        <span>📊</span> INFORMASI MEDIA VIDEO LENGKAP
      </div>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Resolusi Video</span>
          <span class="info-value" id="infoResolution">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Aspect Ratio</span>
          <span class="info-value" id="infoAspectRatio">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Durasi Total</span>
          <span class="info-value" id="infoDuration">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Tipe / Container</span>
          <span class="info-value" id="infoContainer">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Engine Player</span>
          <span class="info-value" id="infoEngine">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Status Subtitle</span>
          <span class="info-value" id="infoSrtStatus">Nonaktif</span>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Notifikasi</div>

  <script>
    // --- APP ENGINE STATE ---
    const video = document.getElementById('videoPlayer');
    const playerWrapper = document.getElementById('playerWrapper');
    const subtitleOverlay = document.getElementById('subtitleOverlay');
    
    let hlsInstance = null;
    let shakaInstance = null;
    let srtCues = [];
    let srtDelay = 0;
    let nativeTextTrack = null;
    let currentSourceType = 'N/A';
    let currentEngineName = 'HTML5 Native';

    // --- DOM ELEMENTS ---
    const statusBanner = document.getElementById('statusBanner');
    const statusText = document.getElementById('statusText');
    const toast = document.getElementById('toast');
    
    const panelStream = document.getElementById('panelStream');
    const panelLocal = document.getElementById('panelLocal');
    const panelSrt = document.getElementById('panelSrt');

    // Subtitle Custom Controls
    const srtDelayInput = document.getElementById('srtDelayInput');
    const srtDelayVal = document.getElementById('srtDelayVal');
    const srtSizeInput = document.getElementById('srtSizeInput');
    const srtSizeVal = document.getElementById('srtSizeVal');
    const srtBgAlphaInput = document.getElementById('srtBgAlphaInput');
    const srtBgAlphaVal = document.getElementById('srtBgAlphaVal');
    const srtTextColorInput = document.getElementById('srtTextColorInput');
    const srtBgColorInput = document.getElementById('srtBgColorInput');

    // Info Display Elements
    const infoResolution = document.getElementById('infoResolution');
    const infoAspectRatio = document.getElementById('infoAspectRatio');
    const infoDuration = document.getElementById('infoDuration');
    const infoContainer = document.getElementById('infoContainer');
    const infoEngine = document.getElementById('infoEngine');
    const infoSrtStatus = document.getElementById('infoSrtStatus');

    shaka.polyfill.installAll();

    // --- TAB SWITCHER ---
    function switchTab(tab, e) {
      document.querySelectorAll('.source-tab-btn').forEach(btn => btn.classList.remove('active'));
      if (e) e.target.classList.add('active');

      panelStream.classList.add('hidden');
      panelLocal.classList.add('hidden');
      panelSrt.classList.add('hidden');

      if (tab === 'stream') panelStream.classList.remove('hidden');
      if (tab === 'local') panelLocal.classList.remove('hidden');
      if (tab === 'srt') panelSrt.classList.remove('hidden');
    }

    // --- FULLSCREEN CONTAINER API ---
    function toggleContainerFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (playerWrapper.requestFullscreen) {
          playerWrapper.requestFullscreen();
        } else if (playerWrapper.webkitRequestFullscreen) {
          playerWrapper.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // --- VLC LAUNCHER INTENT BRIDGE ---
    function openInVlcApp() {
      const url = document.getElementById('streamUrlInput').value.trim();
      if (!url) {
        showToast("Masukkan URL Stream terlebih dahulu!");
        return;
      }

      showToast("Membuka di aplikasi VLC...");
      window.location.href = `vlc://${url}`;
      
      setTimeout(() => {
        window.location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=https;type=video/*;package=org.videolan.vlc;end`;
      }, 800);
    }

    // --- ARRAYBUFFER BINARY PROXY PIPELINE ---
    function wrapCorsProxyUrl(targetUrl) {
      if (!targetUrl || targetUrl.startsWith('blob:') || targetUrl.startsWith('data:')) {
        return targetUrl;
      }
      return `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
    }

    class CustomHlsCorsLoader extends Hls.DefaultConfig.loader {
      constructor(config) {
        super(config);
        const load = this.load.bind(this);
        this.load = function(context, config, callbacks) {
          if (context && context.url) {
            context.url = wrapCorsProxyUrl(context.url);
          }
          load(context, config, callbacks);
        };
      }
    }

    // --- UNIVERSAL PLAYBACK ENGINE ---
    async function playStreamUrl(url, drmLicense = '') {
      showStatus("Memutar stream...");
      resetPlayers();

      try {
        if (url.includes('.mpd') || drmLicense) {
          currentSourceType = 'DASH / MPEG-DASH';
          currentEngineName = 'Shaka Player DRM';
          shakaInstance = new shaka.Player(video);
          
          if (drmLicense) {
            shakaInstance.configure({
              drm: { servers: { 'com.widevine.alpha': drmLicense } }
            });
          }

          await shakaInstance.load(wrapCorsProxyUrl(url));
          hideStatus();
          showToast("Memutar DASH / DRM Stream");
          return;
        }

        if (url.includes('.m3u8') || url.includes('hls')) {
          currentSourceType = 'HLS (.m3u8)';
          if (Hls.isSupported()) {
            currentEngineName = 'Hls.js Binary Pipe';
            hlsInstance = new Hls({
              enableWorker: true,
              fLoader: CustomHlsCorsLoader,
              pLoader: CustomHlsCorsLoader
            });

            hlsInstance.loadSource(wrapCorsProxyUrl(url));
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
              video.play().catch(() => {});
              hideStatus();
              showToast("Memutar HLS Stream");
            });

            hlsInstance.on(Hls.Events.ERROR, (event, data) => {
              if (data.fatal) {
                console.warn("HLS Error:", data);
                hideStatus();
                showToast("Server CDN menolak akses browser. Gunakan tombol 'Buka di VLC'.");
              }
            });
            return;
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            currentEngineName = 'Safari Native HLS';
            video.src = wrapCorsProxyUrl(url);
            video.play();
            hideStatus();
            return;
          }
        }

        currentSourceType = url.substring(url.lastIndexOf('.') + 1).toUpperCase() || 'Direct Video';
        currentEngineName = 'HTML5 Native Player';
        video.src = wrapCorsProxyUrl(url);
        video.play().then(() => {
          hideStatus();
          showToast("Memutar Direct Stream");
        }).catch(() => {
          hideStatus();
        });

      } catch (err) {
        console.error(err);
        hideStatus();
        showToast("Gagal memutar stream.");
      }
    }

    function resetPlayers() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      if (shakaInstance) {
        shakaInstance.destroy();
        shakaInstance = null;
      }
      video.pause();
      video.removeAttribute('src');
      video.load();
    }

    function playSingleUrl() {
      const url = document.getElementById('streamUrlInput').value.trim();
      const drm = document.getElementById('drmLicenseInput').value.trim();

      if (!url) {
        showToast("Masukkan URL Stream terlebih dahulu!");
        return;
      }
      playStreamUrl(url, drm);
    }

    // --- LOCAL VIDEO PLAYER ENGINE ---
    function playLocalVideo(e) {
      const file = e.target.files[0];
      if (!file) return;

      resetPlayers();
      showStatus(`Memuat file ${file.name}...`);
      
      const ext = file.name.substring(file.name.lastIndexOf('.') + 1).toUpperCase();
      currentSourceType = `${ext} (Lokal)`;
      currentEngineName = "HTML5 Local File";

      const fileUrl = URL.createObjectURL(file);
      video.src = fileUrl;
      video.play().then(() => {
        hideStatus();
        showToast(`Memutar file lokal: ${file.name}`);
      }).catch((err) => {
        console.error(err);
        hideStatus();
        showToast("Format video lokal diputar oleh browser.");
      });
    }

    // --- SRT SUBTITLE ENGINE ---
    function loadSrtFromFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        parseSRTContent(evt.target.result);
        showToast(`Subtitle terpasang: ${file.name}`);
      };
      reader.readAsText(file);
    }

    async function loadSrtFromUrl() {
      const url = document.getElementById('srtUrlInput').value.trim();
      if (!url) {
        showToast("Masukkan URL Subtitle SRT!");
        return;
      }

      showStatus("Mengunduh subtitle SRT...");
      try {
        const res = await fetch(wrapCorsProxyUrl(url));
        if (!res.ok) throw new Error("Gagal mengunduh SRT");
        const text = await res.text();
        parseSRTContent(text);
        hideStatus();
        showToast("Subtitle SRT terpasang!");
      } catch (err) {
        console.error(err);
        hideStatus();
        showToast("Gagal memuat file SRT dari URL ini.");
      }
    }

    function parseSRTContent(srtText) {
      srtCues = [];
      const regex = /(\d+)\r?\n(\d{2}:\d{2}:\d{2}[,\.]\d{3}) --> (\d{2}:\d{2}:\d{2}[,\.]\d{3})\r?\n([\s\S]*?)(?=\r?\n\r?\n|\r?\n*$)/g;
      let match;

      while ((match = regex.exec(srtText)) !== null) {
        const startTime = timeToSeconds(match[2]);
        const endTime = timeToSeconds(match[3]);
        const text = match[4].replace(/\r?\n/g, '<br>').trim();
        srtCues.push({ start: startTime, end: endTime, text: text });
      }

      infoSrtStatus.innerText = `Aktif (${srtCues.length} Baris)`;
      
      injectNativeTextTrack();
      updateSrtStyle();
    }

    function injectNativeTextTrack() {
      if (nativeTextTrack) {
        nativeTextTrack.mode = 'disabled';
      }

      nativeTextTrack = video.addTextTrack("subtitles", "Indonesia SRT", "id");
      nativeTextTrack.mode = "showing";

      srtCues.forEach(cueObj => {
        const start = Math.max(0, cueObj.start + srtDelay);
        const end = Math.max(0, cueObj.end + srtDelay);
        const cleanText = cueObj.text.replace(/<br\s*\/?>/gi, '\n');

        if (window.VTTCue) {
          const vttCue = new VTTCue(start, end, cleanText);
          nativeTextTrack.addCue(vttCue);
        }
      });
    }

    function timeToSeconds(timeStr) {
      const parts = timeStr.replace(',', '.').split(':');
      const hours = parseFloat(parts[0]);
      const minutes = parseFloat(parts[1]);
      const seconds = parseFloat(parts[2]);
      return hours * 3600 + minutes * 60 + seconds;
    }

    // Subtitle Time Loop Sync
    video.addEventListener('timeupdate', () => {
      updateVideoInfo();

      const isNativeFullscreen = document.fullscreenElement === video || document.webkitFullscreenElement === video;

      if (!srtCues.length || isNativeFullscreen) {
        subtitleOverlay.style.display = 'none';
        return;
      }

      const adjustedTime = video.currentTime - srtDelay;
      const activeCue = srtCues.find(c => adjustedTime >= c.start && adjustedTime <= c.end);

      if (activeCue) {
        subtitleOverlay.innerHTML = activeCue.text;
        subtitleOverlay.style.display = 'inline-block';
      } else {
        subtitleOverlay.innerHTML = '';
        subtitleOverlay.style.display = 'none';
      }
    });

    // Subtitle Styling Adjustments
    function adjustSrtDelay(amount) {
      setSrtDelay(srtDelay + amount);
    }

    function setSrtDelay(value) {
      srtDelay = Math.round(value * 10) / 10;
      srtDelayInput.value = srtDelay.toFixed(1);
      srtDelayVal.innerText = `${srtDelay > 0 ? '+' : ''}${srtDelay.toFixed(1)}s`;
      
      if (srtCues.length > 0) {
        injectNativeTextTrack();
      }
      showToast(`Delay Subtitle: ${srtDelay.toFixed(1)}s`);
    }

    function updateSrtStyle() {
      const fontSize = srtSizeInput.value;
      const bgAlpha = parseFloat(srtBgAlphaInput.value) / 100;
      const textColor = srtTextColorInput.value;
      const bgColorHex = srtBgColorInput.value;

      srtSizeVal.innerText = `${fontSize}px`;
      srtBgAlphaVal.innerText = `${srtBgAlphaInput.value}%`;

      const r = parseInt(bgColorHex.slice(1, 3), 16);
      const g = parseInt(bgColorHex.slice(3, 5), 16);
      const b = parseInt(bgColorHex.slice(5, 7), 16);

      subtitleOverlay.style.fontSize = `${fontSize}px`;
      subtitleOverlay.style.color = textColor;
      subtitleOverlay.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${bgAlpha})`;
    }

    // --- VIDEO MEDIA INFORMATION ENGINE ---
    video.addEventListener('loadedmetadata', updateVideoInfo);

    function updateVideoInfo() {
      if (video.videoWidth && video.videoHeight) {
        infoResolution.innerText = `${video.videoWidth} x ${video.videoHeight} Px`;
        
        const gcdVal = gcd(video.videoWidth, video.videoHeight);
        const aspectW = video.videoWidth / gcdVal;
        const aspectH = video.videoHeight / gcdVal;
        infoAspectRatio.innerText = `${aspectW}:${aspectH}`;
      } else {
        infoResolution.innerText = '-';
        infoAspectRatio.innerText = '-';
      }

      if (video.duration && !isNaN(video.duration)) {
        infoDuration.innerText = formatDuration(video.duration);
      } else {
        infoDuration.innerText = 'Live Stream';
      }

      infoContainer.innerText = currentSourceType;
      infoEngine.innerText = currentEngineName;
    }

    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }

    function formatDuration(seconds) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = Math.floor(seconds % 60);
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // --- UI UTILITIES ---
    function showStatus(msg) {
      statusText.innerText = msg;
      statusBanner.classList.remove('hidden');
    }

    function hideStatus() {
      statusBanner.classList.add('hidden');
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
