<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline OCR Engine Pro</title>

    <!-- Tesseract.js Web Worker Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #263346;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-top: 8px;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            margin-top: 6px;
            font-weight: 700;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        input[type="file"], select, input[type="range"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        input[type="file"]::file-selector-button {
            background: var(--border);
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .canvas-container {
            width: 100%;
            max-height: 280px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
        }

        canvas {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-success { background-color: var(--success); color: #000; }

        .progress-bar-container {
            width: 100%;
            background-color: var(--bg-color);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.2s;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .confidence-badge {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            display: none;
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>OCR Text Extractor Engine Pro</h1>
        <p>High-DPI Upsampling, Sharpness Convolution & Layout Tuning</p>
        <span class="badge">Engine Precision Upgrade</span>
    </div>

    <div class="card">
        <div class="form-group">
            <label for="imageInput">Pilih Foto / Gambar Dokumen</label>
            <input type="file" id="imageInput" accept="image/*" onchange="loadImage(event)">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="psmSelect">Mode Tata Letak (PSM)</label>
                <select id="psmSelect" onchange="processImage()">
                    <option value="6" selected>Blok Teks (Buku / Dokumen)</option>
                    <option value="4">Kolom / Tabel (Struk Belanja)</option>
                    <option value="3">Auto Detection (Campuran)</option>
                    <option value="7">Satu Baris Teks Tunggal</option>
                    <option value="11">Teks Acak / Terdistorsi</option>
                </select>
            </div>
            <div class="form-group">
                <label for="scaleSelect">Perpembesaran Huruf (DPI Scale)</label>
                <select id="scaleSelect" onchange="processImage()">
                    <option value="1">1x (Resolusi Asli)</option>
                    <option value="1.5" selected>1.5x (Optimal Rata-rata)</option>
                    <option value="2">2x (Untuk Huruf Kecil/Struk)</option>
                    <option value="2.5">2.5x (Huruf Sangat Mikro)</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="algoSelect">Metode Pengolahan Gambar</label>
                <select id="algoSelect" onchange="processImage()">
                    <option value="sauvola_sharp" selected>Sauvola + Sharpen (Rekomendasi)</option>
                    <option value="sauvola">Sauvola Adaptive Saja</option>
                    <option value="otsu">Otsu Global Thresholding</option>
                    <option value="grayscale">Grayscale High-Contrast</option>
                    <option value="original">Gambar Asli</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tajamkan Karakter (Sharpen): <span id="sharpVal">1.2</span></label>
                <input type="range" id="sharpSlider" min="0" max="3" step="0.2" value="1.2" oninput="processImage()">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="imageCanvas"></canvas>
        </div>

        <button id="ocrBtn" class="btn" onclick="runOCR()" disabled>Ekstrak Teks Detail</button>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status-row">
            <span id="statusText">Silakan unggah foto dokumen.</span>
            <span id="confidenceBadge" class="confidence-badge">Akurasi: 0%</span>
        </div>
    </div>

    <div class="card">
        <label for="outputResult">Hasil Ekstraksi Detail:</label>
        <textarea id="outputResult" placeholder="Hasil ekstraksi teks presisi tinggi akan muncul di sini..." readonly></textarea>
        <div class="btn-group">
            <button id="copyBtn" class="btn btn-success" onclick="copyText()" disabled>Salin Teks (Copy)</button>
        </div>
    </div>
</div>

<script>
    let originalImage = null;
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function loadImage(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                originalImage = img;
                processImage();
                document.getElementById('ocrBtn').disabled = false;
                document.getElementById('statusText').innerText = 'Foto berhasil dimuat & dioptimalkan.';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function processImage() {
        if (!originalImage) return;

        const scale = parseFloat(document.getElementById('scaleSelect').value);
        const sharpStrength = parseFloat(document.getElementById('sharpSlider').value);
        document.getElementById('sharpVal').innerText = sharpStrength.toFixed(1);

        // Scaling Canvas (Upsampling)
        const targetWidth = Math.round(originalImage.width * scale);
        const targetHeight = Math.round(originalImage.height * scale);

        // Batas maksimum kanvas agar tidak *crash* di browser mobile
        const maxPixels = 4000 * 4000;
        let finalW = targetWidth;
        let finalH = targetHeight;
        if (finalW * finalH > maxPixels) {
            const ratio = Math.sqrt(maxPixels / (finalW * finalH));
            finalW = Math.round(finalW * ratio);
            finalH = Math.round(finalH * ratio);
        }

        canvas.width = finalW;
        canvas.height = finalH;

        // Render awal dengan smoothing untuk sharpening
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(originalImage, 0, 0, finalW, finalH);

        const algo = document.getElementById('algoSelect').value;
        if (algo === 'original') return;

        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        // Step 1: Penajaman Tepi (Unsharp Masking Convolution)
        if (sharpStrength > 0 && (algo.includes('sharp') || algo === 'grayscale')) {
            imgData = applySharpen(imgData, sharpStrength);
        }

        // Step 2: Binarisasi Gambar
        if (algo === 'grayscale') {
            applyHighContrastGrayscale(imgData);
        } else if (algo === 'otsu') {
            applyOtsu(imgData);
        } else if (algo.includes('sauvola')) {
            applySauvolaIntegral(imgData, 15, 0.2);
        }

        ctx.putImageData(imgData, 0, 0);
    }

    // Filter Konvolusi Penajam Tepi Karakter (Unsharp Masking)
    function applySharpen(imageData, strength) {
        const w = imageData.width;
        const h = imageData.height;
        const input = imageData.data;
        const output = ctx.createImageData(w, h);
        const outData = output.data;

        // Kernel matriks penajam
        const k = strength;
        const kernel = [
            0, -k, 0,
           -k, 1 + 4 * k, -k,
            0, -k, 0
        ];

        for (let y = 1; y < h - 1; y++) {
            for (let x = 1; x < w - 1; x++) {
                const idx = (y * w + x) * 4;
                for (let c = 0; c < 3; c++) {
                    let res = 0;
                    res += input[((y - 1) * w + (x)) * 4 + c] * kernel[1];
                    res += input[(y * w + (x - 1)) * 4 + c] * kernel[3];
                    res += input[idx + c] * kernel[4];
                    res += input[(y * w + (x + 1)) * 4 + c] * kernel[5];
                    res += input[((y + 1) * w + (x)) * 4 + c] * kernel[7];

                    outData[idx + c] = Math.min(255, Math.max(0, res));
                }
                outData[idx + 3] = input[idx + 3];
            }
        }
        return output;
    }

    function applyHighContrastGrayscale(imageData) {
        const d = imageData.data;
        for (let i = 0; i < d.length; i += 4) {
            let gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
            // Stretch contrast
            gray = (gray - 128) * 1.3 + 128;
            gray = Math.min(255, Math.max(0, gray));
            d[i] = d[i+1] = d[i+2] = gray;
        }
    }

    function applyOtsu(imageData) {
        const d = imageData.data;
        const total = imageData.width * imageData.height;
        const histogram = new Int32Array(256);

        for (let i = 0; i < d.length; i += 4) {
            const gray = Math.round(0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]);
            d[i] = gray;
            histogram[gray]++;
        }

        let sum = 0;
        for (let t = 0; t < 256; t++) sum += t * histogram[t];

        let sumB = 0, wB = 0, wF = 0, varMax = 0, threshold = 128;

        for (let t = 0; t < 256; t++) {
            wB += histogram[t];
            if (wB === 0) continue;
            wF = total - wB;
            if (wF === 0) break;

            sumB += t * histogram[t];
            const mB = sumB / wB;
            const mF = (sum - sumB) / wF;

            const varBetween = wB * wF * (mB - mF) * (mB - mF);
            if (varBetween > varMax) {
                varMax = varBetween;
                threshold = t;
            }
        }

        for (let i = 0; i < d.length; i += 4) {
            const val = d[i] < threshold ? 0 : 255;
            d[i] = d[i+1] = d[i+2] = val;
        }
    }

    function applySauvolaIntegral(imageData, windowSize = 15, k = 0.2, R = 128) {
        const width = imageData.width;
        const height = imageData.height;
        const d = imageData.data;

        const gray = new Float32Array(width * height);
        for (let i = 0; i < d.length; i += 4) {
            gray[i / 4] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        }

        const integral = new Float64Array((width + 1) * (height + 1));
        const integralSq = new Float64Array((width + 1) * (height + 1));

        for (let y = 0; y < height; y++) {
            let sum = 0, sumSq = 0;
            for (let x = 0; x < width; x++) {
                const val = gray[y * width + x];
                sum += val;
                sumSq += val * val;

                const idx = (y + 1) * (width + 1) + (x + 1);
                const prevY = y * (width + 1) + (x + 1);

                integral[idx] = integral[prevY] + sum;
                integralSq[idx] = integralSq[prevY] + sumSq;
            }
        }

        const halfW = Math.floor(windowSize / 2);

        function getBoxSum(integ, x1, y1, x2, y2) {
            const A = integ[y1 * (width + 1) + x1];
            const B = integ[y1 * (width + 1) + (x2 + 1)];
            const C = integ[(y2 + 1) * (width + 1) + x1];
            const D = integ[(y2 + 1) * (width + 1) + (x2 + 1)];
            return D - B - C + A;
        }

        for (let y = 0; y < height; y++) {
            const y1 = Math.max(0, y - halfW);
            const y2 = Math.min(height - 1, y + halfW);

            for (let x = 0; x < width; x++) {
                const x1 = Math.max(0, x - halfW);
                const x2 = Math.min(width - 1, x + halfW);

                const count = (x2 - x1 + 1) * (y2 - y1 + 1);
                const sum = getBoxSum(integral, x1, y1, x2, y2);
                const sumSq = getBoxSum(integralSq, x1, y1, x2, y2);

                const mean = sum / count;
                const variance = Math.max(0, (sumSq / count) - (mean * mean));
                const stdDev = Math.sqrt(variance);

                const threshold = mean * (1 + k * ((stdDev / R) - 1));

                const pixelIdx = (y * width + x);
                const val = gray[pixelIdx] < threshold ? 0 : 255;

                const outIdx = pixelIdx * 4;
                d[outIdx] = d[outIdx + 1] = d[outIdx + 2] = val;
            }
        }
    }

    async function runOCR() {
        if (!originalImage) return;

        const ocrBtn = document.getElementById('ocrBtn');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const outputResult = document.getElementById('outputResult');
        const copyBtn = document.getElementById('copyBtn');
        const confBadge = document.getElementById('confidenceBadge');
        const psmMode = document.getElementById('psmSelect').value;

        ocrBtn.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        confBadge.style.display = 'none';
        statusText.innerText = 'Menginisialisasi Engine Tesseract LSTM...';

        try {
            const worker = await Tesseract.createWorker('ind+eng', 1, {
                logger: m => {
                    if (m.status === 'recognizing text') {
                        const pct = Math.round(m.progress * 100);
                        progressBar.style.width = pct + '%';
                        statusText.innerText = `Menganalisis & Ekstraksi: ${pct}%`;
                    }
                }
            });

            // Optimasi Parameter Engine
            await worker.setParameters({
                tessedit_pageseg_mode: psmMode,
                preserve_interword_spaces: '1',
                user_defined_dpi: '300'
            });

            const dataUrl = canvas.toDataURL('image/png');
            const { data: { text, confidence } } = await worker.recognize(dataUrl);

            outputResult.value = text.trim() ? text : '[Tidak ada teks terdeteksi. Coba sesuaikan skala DPI atau ubah mode PSM]';
            statusText.innerText = 'Proses ekstraksi presisi selesai!';
            
            confBadge.innerText = `Akurasi: ${Math.round(confidence)}%`;
            confBadge.style.display = 'inline-block';
            confBadge.style.background = confidence > 75 ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.15)';
            confBadge.style.color = confidence > 75 ? 'var(--success)' : 'var(--danger)';

            copyBtn.disabled = !text.trim();

            await worker.terminate();
        } catch (err) {
            statusText.innerText = 'Gagal memproses: ' + err.message;
            console.error(err);
        } finally {
            ocrBtn.disabled = false;
        }
    }

    function copyText() {
        const textarea = document.getElementById('outputResult');
        textarea.select();
        navigator.clipboard.writeText(textarea.value).then(() => {
            document.getElementById('statusText').innerText = 'Teks berhasil disalin!';
        });
    }
</script>

</body>
</html>
