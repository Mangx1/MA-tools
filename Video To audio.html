<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MA-VideoAudioStudio</title>
  <!-- MP3 Encoder Engine Library -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --accent-primary: #10b981;
      --accent-hover: #059669;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --wave-bg: #090d16;
      /* Jaminan minimum 36px agar aman dari status bar HP / Android WebView / Notch */
      --safe-top: max(env(safe-area-inset-top, 0px), 36px);
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 10px);
      padding-bottom: calc(var(--safe-bottom) + 12px);
      overflow-x: hidden;
    }

    header {
      background-color: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      margin-top: calc(-1 * (var(--safe-top) + 10px));
      padding-top: calc(var(--safe-top) + 10px);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #000;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .badge {
      font-size: 10px;
      background: var(--border-color);
      color: var(--accent-cyan);
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      padding: 14px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .dropzone {
      border: 2px dashed var(--border-color);
      background-color: var(--bg-card);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .dropzone:active, .dropzone.dragover {
      border-color: var(--accent-primary);
      background-color: var(--bg-card-hover);
      transform: scale(0.99);
    }

    .dropzone-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dropzone-title {
      font-size: 15px;
      font-weight: 600;
    }

    .dropzone-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    .card {
      background-color: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-preview-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      max-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
    }

    .waveform-container {
      position: relative;
      width: 100%;
      height: 100px;
      background-color: var(--wave-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .time-controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .input-field, select.input-field {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    .input-field:focus {
      border-color: var(--accent-primary);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      background-color: var(--bg-card-hover);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      min-height: 44px;
      touch-action: manipulation;
      flex: 1;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      color: #000;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-secondary {
      background-color: #334155;
      color: #fff;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-small {
      padding: 8px 12px;
      min-height: 36px;
      font-size: 12px;
      flex: initial;
    }

    .audio-effects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      background-color: var(--bg-main);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .effect-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .effect-item label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .effect-item input[type="range"] {
      accent-color: var(--accent-primary);
      height: 22px;
      width: 100%;
    }

    .status-banner {
      background-color: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(6, 182, 212, 0.3);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .duration-pill {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-primary);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      font-family: monospace;
    }

    .size-estimate-badge {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #1e293b;
      color: #fff;
      border: 1px solid var(--accent-primary);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header Diturunkan dari Bar HP -->
  <header>
    <div class="brand">
      <div class="brand-logo">MA</div>
      <div>
        <div class="brand-title">MA-VideoAudioStudio</div>
      </div>
    </div>
    <span class="badge">v2.6 Worker Engine</span>
  </header>

  <main>
    <!-- Dropzone Input File -->
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 10l5 5m0 0l-5 5m5-5H3"></path>
          <path d="M7 18a4 4 0 010-8 5 5 0 018.27-3.3 4 4 0 015.73 4.3 4 4 0 01-2 7.7H7z"></path>
        </svg>
      </div>
      <div class="dropzone-title">Pilih Video atau Audio</div>
      <div class="dropzone-sub">Format: MP4, WebM, MOV, MKV, MP3, WAV</div>
      <input type="file" id="fileInput" accept="video/*,audio/*">
    </div>

    <!-- Status Processing Bar -->
    <div class="status-banner hidden" id="statusBanner">
      <div class="spinner"></div>
      <span id="statusText">Mengekstrak audio dari video...</span>
    </div>

    <!-- Main Editor Section -->
    <div class="card hidden" id="editorCard">
      <!-- Video Preview Player -->
      <div class="video-preview-wrapper hidden" id="videoWrapper">
        <video id="videoPlayer" playsinline controls></video>
      </div>

      <!-- Waveform Interactive Canvas -->
      <div class="waveform-container" id="waveformContainer">
        <canvas id="waveformCanvas"></canvas>
      </div>

      <!-- Time Trimming Display & Inputs -->
      <div class="time-controls-grid">
        <div class="input-group">
          <label>DETIK MULAI (START) <span id="startDisplay">00:00.00</span></label>
          <input type="number" id="startTimeInput" class="input-field" step="0.1" min="0" value="0.0">
        </div>
        <div class="input-group">
          <label>DETIK SELESAI (END) <span id="endDisplay">00:00.00</span></label>
          <input type="number" id="endTimeInput" class="input-field" step="0.1" min="0" value="0.0">
        </div>
      </div>

      <!-- Opsi Format Ekspor & Ukuran File -->
      <div class="input-group">
        <label>FORMAT EKSPOR & KECEPATAN PROSES</label>
        <select id="formatSelect" class="input-field">
          <option value="mp3" selected>MP3 Worker (Komprensi Ringan ~3.8 MB) — Cepat</option>
          <option value="webm">WebM Audio Opus (Sangat Cepat &lt;0.5 detik ~2.5 MB)</option>
          <option value="wav">WAV Lossless (~47 MB) — Instan</option>
        </select>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 0;">
        <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">DURASI & ESTIMASI UKURAN:</span>
        <div style="display: flex; gap: 6px; align-items: center;">
          <span class="duration-pill" id="cutDurationDisplay">0.00 Detik</span>
          <span class="size-estimate-badge" id="sizeEstimateDisplay">~0 MB</span>
        </div>
      </div>

      <!-- Audio Parameter Effects -->
      <div class="audio-effects-grid">
        <div class="effect-item">
          <label>VOLUME BOOST: <span id="volVal">100%</span></label>
          <input type="range" id="volRange" min="0" max="300" value="100">
        </div>
        <div class="effect-item">
          <label>FADE IN: <span id="fadeInVal">0.0s</span></label>
          <input type="range" id="fadeInRange" min="0" max="5" step="0.5" value="0">
        </div>
        <div class="effect-item">
          <label>FADE OUT: <span id="fadeOutVal">0.0s</span></label>
          <input type="range" id="fadeOutRange" min="0" max="5" step="0.5" value="0">
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="controls-row">
        <button class="btn btn-secondary" id="btnPreview">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Putar Potongan
        </button>
        <button class="btn btn-primary" id="btnExport">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          Simpan Audio
        </button>
      </div>

      <!-- Reset & Option Controls -->
      <div class="controls-row" style="margin-top: -4px;">
        <button class="btn btn-outline btn-small" id="btnResetSelection">Reset Pilihan</button>
        <button class="btn btn-outline btn-small" id="btnSyncToVideo">Samakan Video & Audio</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Notifikasi</div>

  <script>
    // --- APP STATE ---
    let audioCtx = null;
    let decodedAudioBuffer = null;
    let originalFileName = "audio_extracted";
    let isVideoFile = false;

    let startTime = 0;
    let endTime = 0;
    let totalDuration = 0;

    let previewSource = null;
    let isPlayingPreview = false;

    // --- DOM ELEMENTS ---
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const statusBanner = document.getElementById('statusBanner');
    const statusText = document.getElementById('statusText');
    const editorCard = document.getElementById('editorCard');
    const videoWrapper = document.getElementById('videoWrapper');
    const videoPlayer = document.getElementById('videoPlayer');
    const waveformContainer = document.getElementById('waveformContainer');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const startTimeInput = document.getElementById('startTimeInput');
    const endTimeInput = document.getElementById('endTimeInput');
    const startDisplay = document.getElementById('startDisplay');
    const endDisplay = document.getElementById('endDisplay');
    const cutDurationDisplay = document.getElementById('cutDurationDisplay');
    const sizeEstimateDisplay = document.getElementById('sizeEstimateDisplay');
    const formatSelect = document.getElementById('formatSelect');
    
    // Controls & Effects
    const volRange = document.getElementById('volRange');
    const volVal = document.getElementById('volVal');
    const fadeInRange = document.getElementById('fadeInRange');
    const fadeInVal = document.getElementById('fadeInVal');
    const fadeOutRange = document.getElementById('fadeOutRange');
    const fadeOutVal = document.getElementById('fadeOutVal');
    
    const btnPreview = document.getElementById('btnPreview');
    const btnExport = document.getElementById('btnExport');
    const btnResetSelection = document.getElementById('btnResetSelection');
    const btnSyncToVideo = document.getElementById('btnSyncToVideo');
    const toast = document.getElementById('toast');

    // --- EVENT LISTENERS ---
    dropzone.addEventListener('click', () => fileInput.click());
    
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    volRange.addEventListener('input', () => volVal.innerText = `${volRange.value}%`);
    fadeInRange.addEventListener('input', () => fadeInVal.innerText = `${parseFloat(fadeInRange.value).toFixed(1)}s`);
    fadeOutRange.addEventListener('input', () => fadeOutVal.innerText = `${parseFloat(fadeOutRange.value).toFixed(1)}s`);

    startTimeInput.addEventListener('change', () => validateAndSetTimeRange(parseFloat(startTimeInput.value), endTime));
    endTimeInput.addEventListener('change', () => validateAndSetTimeRange(startTime, parseFloat(endTimeInput.value)));
    formatSelect.addEventListener('change', calculateEstimatedSize);

    btnPreview.addEventListener('click', togglePreview);
    btnExport.addEventListener('click', processAndExportAudio);
    btnResetSelection.addEventListener('click', () => validateAndSetTimeRange(0, totalDuration));
    btnSyncToVideo.addEventListener('click', syncVideoToCurrentSelection);

    window.addEventListener('resize', () => {
      if (decodedAudioBuffer) drawWaveform();
    });

    // --- FILE PROCESSING ENGINE ---
    async function handleFileSelect(file) {
      if (!file) return;

      originalFileName = file.name.substring(0, file.name.lastIndexOf('.')) || "audio_cut";
      isVideoFile = file.type.startsWith('video');

      showStatus(`Membaca audio dari ${file.name}...`);
      editorCard.classList.add('hidden');

      if (isVideoFile) {
        videoPlayer.src = URL.createObjectURL(file);
        videoWrapper.classList.remove('hidden');
      } else {
        videoWrapper.classList.add('hidden');
        videoPlayer.src = "";
      }

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        const arrayBuffer = await file.arrayBuffer();
        showStatus("Mendekode audio (Hardware Decoder)...");
        
        decodedAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        totalDuration = decodedAudioBuffer.duration;

        startTime = 0;
        endTime = totalDuration;

        updateTimeInputs();
        drawWaveform();
        setupTouchInteraction();

        hideStatus();
        editorCard.classList.remove('hidden');
        showToast("Audio berhasil diekstrak!");

      } catch (error) {
        console.error(error);
        hideStatus();
        showToast("Gagal mendecode audio dari file video ini.");
      }
    }

    // --- TIME VALIDATION & ESTIMATION ---
    function validateAndSetTimeRange(newStart, newEnd) {
      if (isNaN(newStart) || newStart < 0) newStart = 0;
      if (isNaN(newEnd) || newEnd > totalDuration) newEnd = totalDuration;
      
      if (newStart >= newEnd) {
        if (newStart >= totalDuration - 0.2) {
          newStart = Math.max(0, totalDuration - 0.5);
        }
        newEnd = Math.min(totalDuration, newStart + 0.2);
      }

      startTime = newStart;
      endTime = newEnd;

      updateTimeInputs();
      drawWaveform();

      if (isVideoFile && !videoPlayer.paused) {
        videoPlayer.currentTime = startTime;
      }
    }

    function updateTimeInputs() {
      startTimeInput.value = startTime.toFixed(2);
      endTimeInput.value = endTime.toFixed(2);
      startDisplay.innerText = formatTime(startTime);
      endDisplay.innerText = formatTime(endTime);
      
      calculateEstimatedSize();
    }

    function calculateEstimatedSize() {
      const duration = endTime - startTime;
      cutDurationDisplay.innerText = `${duration.toFixed(2)} Detik`;

      const fmt = formatSelect.value;
      let estMB = 0;
      if (fmt === 'mp3') {
        estMB = (128 * 1000 * duration) / 8 / 1024 / 1024;
      } else if (fmt === 'webm') {
        estMB = (96 * 1000 * duration) / 8 / 1024 / 1024;
      } else if (fmt === 'wav') {
        const sampleRate = decodedAudioBuffer ? decodedAudioBuffer.sampleRate : 44100;
        const channels = decodedAudioBuffer ? decodedAudioBuffer.numberOfChannels : 2;
        estMB = (sampleRate * channels * 2 * duration) / 1024 / 1024;
      }
      sizeEstimateDisplay.innerText = `~${estMB.toFixed(2)} MB`;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 100);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    // --- CANVAS WAVEFORM RENDERER ---
    function drawWaveform() {
      if (!decodedAudioBuffer) return;

      const rect = waveformContainer.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      waveformCanvas.width = rect.width * dpr;
      waveformCanvas.height = rect.height * dpr;

      const ctx = waveformCanvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;

      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, width, height);

      const channelData = decodedAudioBuffer.getChannelData(0);
      const step = Math.ceil(channelData.length / width);
      const amp = height / 2;

      ctx.fillStyle = '#38bdf8';
      for (let i = 0; i < width; i++) {
        let min = 1.0;
        let max = -1.0;
        for (let j = 0; j < step; j++) {
          const datum = channelData[(i * step) + j];
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
      }

      const startX = (startTime / totalDuration) * width;
      const endX = (endTime / totalDuration) * width;

      ctx.fillStyle = 'rgba(16, 185, 129, 0.35)';
      ctx.fillRect(startX, 0, endX - startX, height);

      ctx.fillStyle = '#10b981';
      ctx.fillRect(startX - 2, 0, 4, height);
      ctx.beginPath();
      ctx.arc(startX, 12, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#10b981';
      ctx.fillRect(endX - 2, 0, 4, height);
      ctx.beginPath();
      ctx.arc(endX, height - 12, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- TOUCH DRAG HANDLERS ---
    let activeHandle = null;

    function setupTouchInteraction() {
      const getPosSec = (e) => {
        const rect = waveformContainer.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
        return (x / rect.width) * totalDuration;
      };

      const handleStart = (e) => {
        const sec = getPosSec(e);
        const distStart = Math.abs(sec - startTime);
        const distEnd = Math.abs(sec - endTime);

        if (distStart < distEnd && distStart < (totalDuration * 0.15)) {
          activeHandle = 'start';
        } else if (distEnd < (totalDuration * 0.15)) {
          activeHandle = 'end';
        } else {
          activeHandle = distStart < distEnd ? 'start' : 'end';
        }

        if (activeHandle === 'start') validateAndSetTimeRange(sec, endTime);
        else validateAndSetTimeRange(startTime, sec);
      };

      const handleMove = (e) => {
        if (!activeHandle) return;
        e.preventDefault();
        const sec = getPosSec(e);
        if (activeHandle === 'start') validateAndSetTimeRange(sec, endTime);
        if (activeHandle === 'end') validateAndSetTimeRange(startTime, sec);
      };

      const handleEnd = () => {
        activeHandle = null;
      };

      waveformContainer.onmousedown = handleStart;
      window.onmousemove = handleMove;
      window.onmouseup = handleEnd;

      waveformContainer.ontouchstart = handleStart;
      window.ontouchmove = handleMove;
      window.ontouchend = handleEnd;
    }

    // --- PREVIEW ENGINE ---
    function togglePreview() {
      if (isPlayingPreview) {
        stopPreview();
      } else {
        startPreview();
      }
    }

    function startPreview() {
      if (!decodedAudioBuffer) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      stopPreview();

      previewSource = audioCtx.createBufferSource();
      previewSource.buffer = decodedAudioBuffer;

      const gainNode = audioCtx.createGain();
      const volRatio = parseFloat(volRange.value) / 100;
      gainNode.gain.setValueAtTime(volRatio, audioCtx.currentTime);

      previewSource.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      const duration = endTime - startTime;
      previewSource.start(0, startTime, duration);
      isPlayingPreview = true;

      btnPreview.innerHTML = `
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        Hentikan Pratinjau
      `;

      if (isVideoFile) {
        videoPlayer.currentTime = startTime;
        videoPlayer.play();
      }

      previewSource.onended = () => stopPreview();
    }

    function stopPreview() {
      if (previewSource) {
        try { previewSource.stop(); } catch (e) {}
        previewSource = null;
      }
      isPlayingPreview = false;
      btnPreview.innerHTML = `
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Putar Potongan
      `;

      if (isVideoFile) {
        videoPlayer.pause();
      }
    }

    function syncVideoToCurrentSelection() {
      if (isVideoFile) {
        videoPlayer.currentTime = startTime;
        showToast("Video disinkronkan ke detik awal.");
      }
    }

    // --- MAIN EXPORT ENGINE ---
    async function processAndExportAudio() {
      if (!decodedAudioBuffer) return;

      const duration = endTime - startTime;
      if (duration <= 0) {
        showToast("Durasi potongan tidak valid!");
        return;
      }

      const format = formatSelect.value;
      showStatus(`Memproses audio (${format.toUpperCase()})...`);

      try {
        // Downsample ke standard 44.1 kHz untuk mempercepat proses kompresi MP3
        const targetSampleRate = 44100;
        const numberOfChannels = decodedAudioBuffer.numberOfChannels;
        const durationSamples = Math.floor(duration * targetSampleRate);

        const offlineCtx = new OfflineAudioContext(numberOfChannels, durationSamples, targetSampleRate);
        const source = offlineCtx.createBufferSource();
        source.buffer = decodedAudioBuffer;

        const gainNode = offlineCtx.createGain();
        const volRatio = parseFloat(volRange.value) / 100;
        const fadeIn = parseFloat(fadeInRange.value);
        const fadeOut = parseFloat(fadeOutRange.value);

        gainNode.gain.setValueAtTime(volRatio, offlineCtx.currentTime);

        if (fadeIn > 0) {
          gainNode.gain.setValueAtTime(0, offlineCtx.currentTime);
          gainNode.gain.linearRampToValueAtTime(volRatio, offlineCtx.currentTime + Math.min(fadeIn, duration));
        }

        if (fadeOut > 0 && duration > fadeOut) {
          const fadeOutStart = duration - fadeOut;
          gainNode.gain.setValueAtTime(volRatio, offlineCtx.currentTime + fadeOutStart);
          gainNode.gain.linearRampToValueAtTime(0, offlineCtx.currentTime + duration);
        }

        source.connect(gainNode);
        gainNode.connect(offlineCtx.destination);
        source.start(0, startTime, duration);

        const renderedBuffer = await offlineCtx.startRendering();

        let exportBlob = null;
        let ext = "mp3";

        if (format === 'mp3') {
          showStatus("Mengompresi MP3 (Background Worker Thread)... 0%");
          exportBlob = await convertBufferToMp3Worker(renderedBuffer, 128);
          ext = "mp3";
        } else if (format === 'webm') {
          showStatus("Mengompresi WebM Audio Opus...");
          exportBlob = await convertBufferToWebM(renderedBuffer);
          ext = "webm";
        } else {
          showStatus("Menyusun file WAV Lossless...");
          exportBlob = audioBufferToWavBlob(renderedBuffer);
          ext = "wav";
        }

        // Trigger Download
        const url = URL.createObjectURL(exportBlob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `${originalFileName}_cut_${startTime.toFixed(1)}s-${endTime.toFixed(1)}s.${ext}`;
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);

        hideStatus();
        const finalMB = (exportBlob.size / 1024 / 1024).toFixed(2);
        showToast(`Berhasil diunduh! Ukuran: ${finalMB} MB`);

      } catch (err) {
        console.error(err);
        hideStatus();
        showToast("Gagal memproses ekspor audio.");
      }
    }

    // --- FAST MP3 WEB WORKER ENCODER (MULTITHREADED) ---
    function convertBufferToMp3Worker(buffer, bitrate = 128) {
      return new Promise((resolve, reject) => {
        const channels = buffer.numberOfChannels;
        const sampleRate = buffer.sampleRate;
        const left = floatTo16BitArray(buffer.getChannelData(0));
        const right = channels > 1 ? floatTo16BitArray(buffer.getChannelData(1)) : left;

        // Web Worker Inline Script Blob
        const workerCode = `
          importScripts('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js');

          self.onmessage = function(e) {
            const { left, right, sampleRate, channels, bitrate } = e.data;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, bitrate);
            const mp3Data = [];
            const sampleBlockSize = 1152;
            const total = left.length;

            for (let i = 0; i < total; i += sampleBlockSize) {
              const leftChunk = left.subarray(i, i + sampleBlockSize);
              const rightChunk = channels === 2 ? right.subarray(i, i + sampleBlockSize) : null;
              
              const mp3buf = (channels === 2) 
                ? mp3encoder.encodeBuffer(leftChunk, rightChunk)
                : mp3encoder.encodeBuffer(leftChunk);
                
              if (mp3buf.length > 0) mp3Data.push(mp3buf);

              if (i % (sampleBlockSize * 100) === 0) {
                const pct = Math.round((i / total) * 100);
                self.postMessage({ type: 'progress', percent: pct });
              }
            }

            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);

            self.postMessage({ type: 'complete', mp3Data: mp3Data });
          };
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(blob));

        worker.onmessage = (e) => {
          if (e.data.type === 'progress') {
            showStatus(`Mengompresi MP3 (Background Thread)... ${e.data.percent}%`);
          } else if (e.data.type === 'complete') {
            const mp3Blob = new Blob(e.data.mp3Data, { type: 'audio/mp3' });
            worker.terminate();
            resolve(mp3Blob);
          }
        };

        worker.onerror = (err) => {
          worker.terminate();
          reject(err);
        };

        // Transfer Data ArrayBuffer ke Worker
        worker.postMessage({
          left: left,
          right: right,
          sampleRate: sampleRate,
          channels: channels,
          bitrate: bitrate
        }, [left.buffer, right.buffer]);
      });
    }

    function floatTo16BitArray(input) {
      const output = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return output;
    }

    // --- ULTRA FAST WEBM AUDIO ENCODER ---
    async function convertBufferToWebM(buffer) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = ctx.createMediaStreamDestination();
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(dest);

      const mediaRecorder = new MediaRecorder(dest.stream, { mimeType: 'audio/webm' });
      const chunks = [];

      return new Promise((resolve) => {
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          ctx.close();
          resolve(new Blob(chunks, { type: 'audio/webm' }));
        };

        mediaRecorder.start();
        source.start(0);
        source.onended = () => {
          mediaRecorder.stop();
        };
      });
    }

    // --- NATIVE WAV PCM ENCODER ---
    function audioBufferToWavBlob(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      let result;
      if (numChannels === 2) {
        result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
      } else {
        result = buffer.getChannelData(0);
      }
      return createWavBlob(result, numChannels, sampleRate, 16);
    }

    function interleave(leftChannel, rightChannel) {
      const length = leftChannel.length + rightChannel.length;
      const result = new Float32Array(length);
      let inputIndex = 0;
      for (let index = 0; index < length;) {
        result[index++] = leftChannel[inputIndex];
        result[index++] = rightChannel[inputIndex];
        inputIndex++;
      }
      return result;
    }

    function createWavBlob(samples, numChannels, sampleRate, bitDepth) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numChannels * 2, true);
      view.setUint16(32, numChannels * 2, true);
      view.setUint16(34, bitDepth, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    // --- UI UTILITIES ---
    function showStatus(msg) {
      statusText.innerText = msg;
      statusBanner.classList.remove('hidden');
    }

    function hideStatus() {
      statusBanner.classList.add('hidden');
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
