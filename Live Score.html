<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MA-LiveScoreStudio</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --accent-primary: #10b981;
      --accent-hover: #059669;
      --accent-cyan: #06b6d4;
      --accent-amber: #ffca28;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      
      /* Safe Zone Top & Bottom Guarantee */
      --safe-top: max(env(safe-area-inset-top, 0px), 36px);
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: calc(var(--safe-bottom) + 16px);
      overflow-x: hidden;
    }

    /* Sticky Header dengan Top Safe Zone */
    header {
      background-color: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      margin-top: calc(-1 * (var(--safe-top) + 12px));
      padding-top: calc(var(--safe-top) + 10px);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      color: #000;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 900;
    }

    .clock-wib {
      font-family: monospace;
      color: var(--accent-amber);
      font-size: 13px;
      font-weight: 700;
    }

    main {
      flex: 1;
      padding: 14px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Tab Scrollable Horizontal */
    .scroll-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-btn:active { transform: scale(0.96); }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
      color: #000;
      border-color: var(--accent-primary);
    }

    .date-btn {
      flex: 0 0 auto;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      min-height: 38px;
    }

    .date-btn.active {
      background: var(--bg-card-hover);
      color: var(--accent-amber);
      border-color: var(--accent-amber);
    }

    .refresh-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .league-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }

    .btn-refresh {
      background: var(--bg-card);
      color: var(--accent-cyan);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
    }

    .btn-refresh:active { transform: scale(0.95); }

    .status-msg {
      text-align: center;
      padding: 28px 16px;
      color: var(--accent-amber);
      font-size: 13px;
      font-weight: 600;
      background: var(--bg-card);
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    /* Match Card UI */
    .match-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .match-card.live { border-left-color: var(--accent-red); }
    .match-card.post { border-left-color: var(--accent-primary); }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .badge-status {
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      text-transform: uppercase;
    }
    .badge-live { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); animation: blink 1.2s infinite; }
    .badge-post { background: rgba(16, 185, 129, 0.2); color: var(--accent-primary); }
    .badge-pre { background: rgba(255, 202, 40, 0.15); color: var(--accent-amber); }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .btn-bell {
      background: transparent;
      border: none;
      font-size: 16px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--text-muted);
      touch-action: manipulation;
    }
    .btn-bell.active { color: var(--accent-amber); filter: drop-shadow(0 0 6px rgba(255, 202, 40, 0.6)); }

    .match-body {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .team-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .team-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .score-box {
      text-align: center;
      min-width: 80px;
    }

    .score-num {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent-amber);
      font-family: monospace;
    }

    .time-wib-display {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent-cyan);
    }

    .vs-text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 800;
    }

    .click-hint {
      text-align: center;
      font-size: 11px;
      color: var(--accent-primary);
      font-weight: 700;
      padding-top: 4px;
      border-top: 1px dashed var(--border-color);
    }

    /* BANNER NOTIFIKASI FLOATING */
    .notif-banner {
      position: fixed;
      top: calc(var(--safe-top) + 10px);
      left: 16px;
      right: 16px;
      background: var(--accent-red);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 2000;
      animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes bounceIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* MODAL BOTTOM SHEET WITH BOTTOM SAFE ZONE */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-content {
      background: var(--bg-card);
      width: 100%;
      max-width: 600px;
      max-height: 85dvh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s cubic-bezier(0, 0, 0.2, 1);
      /* Proteksi area navigasi bawah HP */
      padding-bottom: var(--safe-bottom);
      border-top: 1px solid var(--border-color);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header {
      background: var(--bg-main);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title { font-size: 14px; font-weight: 800; color: var(--accent-amber); }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }

    .modal-score-summary {
      background: var(--bg-main);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-tabs {
      display: flex;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
    }

    .modal-tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      min-height: 44px;
    }
    .modal-tab-btn.active { color: var(--accent-primary); border-bottom: 3px solid var(--accent-primary); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Timeline & Stats Styles */
    .timeline-item { display: flex; align-items: center; font-size: 12px; }
    .timeline-time { background: var(--bg-main); color: var(--accent-amber); padding: 4px 8px; border-radius: 12px; font-weight: 800; font-size: 11px; min-width: 46px; text-align: center; margin: 0 8px; }
    .timeline-left { flex: 1; text-align: right; font-weight: 600; }
    .timeline-right { flex: 1; text-align: left; font-weight: 600; }
    .icon-event { font-size: 14px; margin: 0 4px; }

    .stat-row { margin-bottom: 10px; }
    .stat-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    .stat-bar-container { display: flex; height: 8px; background: var(--bg-main); border-radius: 4px; overflow: hidden; }
    .stat-bar-left { background: var(--accent-primary); height: 100%; }
    .stat-bar-right { background: var(--accent-amber); height: 100%; }
  </style>
</head>
<body>

  <!-- BANNER NOTIFIKASI PERTANDINGAN -->
  <div class="notif-banner" id="notifBanner">
    <div>
      <div style="font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;">🚨 Pengingat Pertandingan</div>
      <div id="notifMatchName" style="font-weight: 800; font-size: 13px; margin-top: 2px;">-</div>
    </div>
    <button onclick="dismissBanner()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer; padding:4px;">✕</button>
  </div>

  <!-- HEADER APLIKASI DENGAN TOP SAFE ZONE -->
  <header>
    <div class="brand-title">
      MA-LiveScoreStudio <span>WIB ENGINE</span>
    </div>
    <div class="clock-wib" id="liveClockWIB">--:--:-- WIB</div>
  </header>

  <main>
    <!-- Tab Pilihan Olahraga Lengkap -->
    <div class="scroll-tabs" id="sportTabs">
      <button class="tab-btn active" onclick="switchLeague('eng.1', 'Premier League 🇬🇧', 'soccer', event)">Premier League</button>
      <button class="tab-btn" onclick="switchLeague('uefa.champions', 'Champions League 🇪🇺', 'soccer', event)">UCL</button>
      <button class="tab-btn" onclick="switchLeague('esp.1', 'La Liga 🇪🇸', 'soccer', event)">La Liga</button>
      <button class="tab-btn" onclick="switchLeague('ita.1', 'Serie A 🇮🇹', 'soccer', event)">Serie A</button>
      <button class="tab-btn" onclick="switchLeague('ufc', 'UFC / MMA 🥊', 'mma', event)">UFC 🥊</button>
      <button class="tab-btn" onclick="switchLeague('nba', 'NBA Basketball 🇺🇸', 'basketball', event)">NBA</button>
      <button class="tab-btn" onclick="switchLeague('f1', 'Formula 1 🏎️', 'racing', event)">F1 Racing</button>
      <button class="tab-btn" onclick="switchLeague('motogp', 'MotoGP 🏍️', 'custom_motogp', event)">MotoGP 🏍️</button>
      <button class="tab-btn" onclick="switchLeague('wrc', 'WRC Rally 🚗', 'custom_wrc', event)">WRC 🚗</button>
      <button class="tab-btn" onclick="switchLeague('volleyball', 'Bola Voli 🏐', 'volleyball', event)">Voli 🏐</button>
    </div>

    <!-- Filter Rentang Tanggal Pertandingan -->
    <div class="scroll-tabs" id="dateTabs">
      <button class="date-btn" onclick="setDateFilter('yesterday', event)">📅 Kemarin</button>
      <button class="date-btn" onclick="setDateFilter('today', event)">📅 Hari Ini</button>
      <button class="date-btn active" onclick="setDateFilter('7days', event)">📅 7 Hari Ke Depan</button>
      <button class="date-btn" onclick="setDateFilter('14days', event)">📅 14 Hari Ke Depan</button>
    </div>

    <div class="refresh-bar">
      <div class="league-title" id="currentLeagueTitle">Premier League 🇬🇧</div>
      <button class="btn-refresh" onclick="loadSportsSchedule()">🔄 Refresh</button>
    </div>

    <!-- Container Match List -->
    <div id="matchContainer">
      <div class="status-msg">Memuat jadwal pertandingan terkini...</div>
    </div>
  </main>

  <!-- MODAL DETAIL PERTANDINGAN (BOTTOM SHEET) -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalLeagueName">Detail Pertandingan</span>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>

      <div class="modal-score-summary" id="modalScoreSummary"></div>

      <div class="modal-tabs">
        <button class="modal-tab-btn active" onclick="switchModalTab('events', event)">Timeline (Gol & Kartu)</button>
        <button class="modal-tab-btn" onclick="switchModalTab('stats', event)">Statistik Match</button>
      </div>

      <div class="modal-body" id="modalBody">
        <div class="status-msg">Memuat detail...</div>
      </div>
    </div>
  </div>

  <script>
    // --- APP STATE & CONFIGURATION ---
    let currentLeagueCode = 'eng.1';
    let currentLeagueName = 'Premier League 🇬🇧';
    let currentSportCategory = 'soccer';
    let currentDateRange = '7days';
    let cachedMatchSummary = null;

    const DEFAULT_LOGO = 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/default-team-logo.png';

    // --- WIB CLOCK ENGINE ---
    function updateWIBClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('liveClockWIB').innerText = now.toLocaleTimeString('id-ID', options) + ' WIB';
    }
    setInterval(updateWIBClock, 1000);
    updateWIBClock();

    // --- DATE PARSER & ESPN PARAMS ---
    function getYYYYMMDD(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }

    function getDateParam() {
      const now = new Date();
      if (currentDateRange === 'yesterday') {
        const yesterday = new Date();
        yesterday.setDate(now.getDate() - 1);
        return getYYYYMMDD(yesterday);
      }
      if (currentDateRange === 'today') {
        return getYYYYMMDD(now);
      }
      
      const startStr = getYYYYMMDD(now);
      const future = new Date();
      future.setDate(now.getDate() + (currentDateRange === '14days' ? 14 : 7));
      return `${startStr}-${getYYYYMMDD(future)}`;
    }

    function setDateFilter(range, e) {
      currentDateRange = range;
      document.querySelectorAll('#dateTabs .date-btn').forEach(btn => btn.classList.remove('active'));
      if (e) e.target.classList.add('active');
      loadSportsSchedule();
    }

    function switchLeague(code, name, category, e) {
      currentLeagueCode = code;
      currentLeagueName = name;
      currentSportCategory = category;
      
      document.querySelectorAll('#sportTabs .tab-btn').forEach(btn => btn.classList.remove('active'));
      if (e) e.target.classList.add('active');
      
      document.getElementById('currentLeagueTitle').innerText = name;
      loadSportsSchedule();
    }

    function formatWIBDate(isoString) {
      const d = new Date(isoString);
      const dateOptions = { timeZone: 'Asia/Jakarta', weekday: 'short', day: 'numeric', month: 'short' };
      const timeOptions = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit' };
      return { 
        dateStr: d.toLocaleDateString('id-ID', dateOptions), 
        timeStr: d.toLocaleTimeString('id-ID', timeOptions) + ' WIB' 
      };
    }

    function getTeamLogo(teamObj) {
      if (!teamObj) return DEFAULT_LOGO;
      if (teamObj.logo && typeof teamObj.logo === 'string') return teamObj.logo;
      if (teamObj.logos && teamObj.logos.length > 0 && teamObj.logos[0].href) return teamObj.logos[0].href;
      return DEFAULT_LOGO;
    }

    // --- REMINDER & BOOKMARK ENGINE ---
    let bookmarkedEvents = JSON.parse(localStorage.getItem('sports_bookmarks') || '[]');

    function saveBookmarks() {
      localStorage.setItem('sports_bookmarks', JSON.stringify(bookmarkedEvents));
    }

    function isBookmarked(eventId) {
      return bookmarkedEvents.some(b => b.id === eventId);
    }

    function toggleBookmark(eventId, eventTitle, isoDate, eventObj) {
      if (eventObj) eventObj.stopPropagation();

      const idx = bookmarkedEvents.findIndex(b => b.id === eventId);
      if (idx >= 0) {
        bookmarkedEvents.splice(idx, 1);
        alert(`Pengingat "${eventTitle}" dibatalkan.`);
      } else {
        bookmarkedEvents.push({
          id: eventId,
          title: eventTitle,
          startTime: new Date(isoDate).getTime(),
          notified: false
        });
        alert(`🔔 Pengingat aktif untuk "${eventTitle}". Notifikasi akan aktif saat tanding!`);
        
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }
      }

      saveBookmarks();
      loadSportsSchedule();
    }

    setInterval(checkReminders, 10000);

    function checkReminders() {
      const now = Date.now();
      bookmarkedEvents.forEach(b => {
        if (!b.notified && now >= (b.startTime - 60000)) {
          triggerNotification(b.title);
          b.notified = true;
          saveBookmarks();
        }
      });
    }

    function triggerNotification(matchTitle) {
      playBeepSound();
      if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 400]);

      document.getElementById('notifMatchName').innerText = matchTitle + " DIMULAI!";
      document.getElementById('notifBanner').style.display = 'flex';

      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("🚨 Pertandingan Dimulai!", { body: matchTitle, icon: DEFAULT_LOGO });
      }
    }

    function playBeepSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch(e) {}
    }

    function dismissBanner() {
      document.getElementById('notifBanner').style.display = 'none';
    }

    // --- MAIN FETCH & RENDER ENGINE ---
    async function loadSportsSchedule() {
      const container = document.getElementById('matchContainer');
      container.innerHTML = '<div class="status-msg">Memuat data pertandingan terkini...</div>';

      if (currentSportCategory === 'custom_motogp') {
        renderCustomRacingCard('MotoGP World Championship 🏍️', [
          { id: 'motogp-1', name: 'San Marino GP (Misano)', date: '2026-09-13T12:00:00Z', status: 'MENDATANG' },
          { id: 'motogp-2', name: 'Emilia Romagna GP', date: '2026-09-20T12:00:00Z', status: 'MENDATANG' },
          { id: 'motogp-3', name: 'Indonesian GP (Mandalika 🇮🇩)', date: '2026-09-27T07:00:00Z', status: 'MENDATANG' }
        ]);
        return;
      }

      if (currentSportCategory === 'custom_wrc') {
        renderCustomRacingCard('WRC World Rally Championship 🚗', [
          { id: 'wrc-1', name: 'Rally Greece (Acropolis)', date: '2026-09-10T08:00:00Z', status: 'MENDATANG' },
          { id: 'wrc-2', name: 'Rally Chile', date: '2026-09-24T08:00:00Z', status: 'MENDATANG' }
        ]);
        return;
      }

      const dateParam = getDateParam();
      let endpoint = '';

      if (currentSportCategory === 'soccer') {
        endpoint = `https://site.api.espn.com/apis/site/v2/sports/soccer/${currentLeagueCode}/scoreboard?dates=${dateParam}`;
      } else if (currentSportCategory === 'mma') {
        endpoint = `https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard?dates=${dateParam}`;
      } else if (currentSportCategory === 'basketball') {
        endpoint = `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${dateParam}`;
      } else if (currentSportCategory === 'racing') {
        endpoint = `https://site.api.espn.com/apis/site/v2/sports/racing/${currentLeagueCode}/scoreboard?dates=${dateParam}`;
      } else if (currentSportCategory === 'volleyball') {
        endpoint = `https://site.api.espn.com/apis/site/v2/sports/volleyball/mens-college-volleyball/scoreboard?dates=${dateParam}`;
      }

      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("Gagal memuat API");
        
        const data = await res.json();
        const events = data.events || [];

        if (events.length === 0) {
          container.innerHTML = '<div class="status-msg">Tidak ada jadwal pertandingan pada rentang tanggal ini.</div>';
          return;
        }

        container.innerHTML = '';
        
        events.forEach(event => {
          const statusType = event.status.type.state;
          const statusDetail = event.status.type.shortDetail || '';
          const { dateStr, timeStr } = formatWIBDate(event.date);
          const marked = isBookmarked(event.id);
          const bellIcon = marked ? '🔔' : '🔕';
          const bellClass = marked ? 'active' : '';

          if (currentSportCategory === 'mma') {
            container.innerHTML += renderUFCCard(event, dateStr, timeStr, bellIcon, bellClass);
            return;
          }

          if (currentSportCategory === 'racing') {
            container.innerHTML += renderRacingCard(event, statusDetail, dateStr, timeStr, bellIcon, bellClass);
            return;
          }

          const comp = event.competitions[0];
          const homeTeam = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors[0];
          const awayTeam = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors[1];

          let statusBadge = '';
          let cardClass = '';

          if (statusType === 'in') {
            statusBadge = `<span class="badge-status badge-live">LIVE • ${statusDetail}</span>`;
            cardClass = 'live';
          } else if (statusType === 'post') {
            statusBadge = `<span class="badge-status badge-post">SELESAI (${statusDetail})</span>`;
            cardClass = 'post';
          } else {
            statusBadge = `<span class="badge-status badge-pre">MENDATANG</span>`;
          }

          const scoreHTML = (statusType === 'in' || statusType === 'post') 
            ? `<div class="score-num">${homeTeam.score} - ${awayTeam.score}</div>`
            : `<div class="time-wib-display">${timeStr}</div><div class="vs-text">VS</div>`;

          const isSoccer = currentSportCategory === 'soccer';
          const clickHint = isSoccer ? '<div class="click-hint">📊 Klik untuk Detail & Timeline</div>' : '';

          const homeLogo = getTeamLogo(homeTeam.team);
          const awayLogo = getTeamLogo(awayTeam.team);
          const matchTitle = `${homeTeam.team.name} vs ${awayTeam.team.name}`;

          container.innerHTML += `
            <div class="match-card ${cardClass}">
              <div class="match-header">
                <span>📅 ${dateStr}</span>
                <div style="display:flex; align-items:center; gap:6px;">
                  ${statusBadge}
                  <button class="btn-bell ${bellClass}" onclick="toggleBookmark('${event.id}', '${matchTitle}', '${event.date}', event)">${bellIcon}</button>
                </div>
              </div>
              <div class="match-body" ${isSoccer ? `onclick="openMatchDetail('${event.id}')"` : ''}>
                <div class="team">
                  <img class="team-logo" src="${homeLogo}" onerror="this.onerror=null; this.src='${DEFAULT_LOGO}';" alt="logo">
                  <span class="team-name">${homeTeam.team.shortDisplayName || homeTeam.team.name}</span>
                </div>
                <div class="score-box">
                  ${scoreHTML}
                </div>
                <div class="team">
                  <img class="team-logo" src="${awayLogo}" onerror="this.onerror=null; this.src='${DEFAULT_LOGO}';" alt="logo">
                  <span class="team-name">${awayTeam.team.shortDisplayName || awayTeam.team.name}</span>
                </div>
              </div>
              ${clickHint}
            </div>
          `;
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="status-msg" style="color:var(--accent-red);">Gagal memuat data. Periksa koneksi internet.</div>';
      }
    }

    function renderUFCCard(event, dateStr, timeStr, bellIcon, bellClass) {
      const comp = event.competitions[0];
      const f1 = comp.competitors[0];
      const f2 = comp.competitors[1];

      const f1Name = f1?.athlete?.displayName || f1?.athlete?.fullName || 'Fighter 1';
      const f2Name = f2?.athlete?.displayName || f2?.athlete?.fullName || 'Fighter 2';
      const f1Img = f1?.athlete?.headshot?.href || DEFAULT_LOGO;
      const f2Img = f2?.athlete?.headshot?.href || DEFAULT_LOGO;
      const matchTitle = `UFC: ${f1Name} vs ${f2Name}`;

      return `
        <div class="match-card">
          <div class="match-header">
            <span>📅 ${dateStr} • ${timeStr}</span>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="badge-status badge-pre">${event.name}</span>
              <button class="btn-bell ${bellClass}" onclick="toggleBookmark('${event.id}', '${matchTitle}', '${event.date}', event)">${bellIcon}</button>
            </div>
          </div>
          <div class="match-body">
            <div class="team">
              <img class="team-logo" src="${f1Img}" onerror="this.onerror=null; this.src='${DEFAULT_LOGO}';" style="border-radius:50%;">
              <span class="team-name">${f1Name}</span>
            </div>
            <div class="score-box">
              <div class="vs-text" style="color:var(--accent-red); font-size:16px;">VS</div>
            </div>
            <div class="team">
              <img class="team-logo" src="${f2Img}" onerror="this.onerror=null; this.src='${DEFAULT_LOGO}';" style="border-radius:50%;">
              <span class="team-name">${f2Name}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderRacingCard(event, statusDetail, dateStr, timeStr, bellIcon, bellClass) {
      return `
        <div class="match-card">
          <div class="match-header">
            <span>📅 ${dateStr} • ${timeStr}</span>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="badge-status badge-pre">JADWAL BALAPAN</span>
              <button class="btn-bell ${bellClass}" onclick="toggleBookmark('${event.id}', '${event.name}', '${event.date}', event)">${bellIcon}</button>
            </div>
          </div>
          <div style="text-align: center; padding: 6px 0;">
            <h4 style="color:var(--accent-cyan); font-size:15px; margin-bottom:4px;">🏁 ${event.name}</h4>
            <p style="font-size:12px; color:var(--text-muted);">${event.circuit?.name || statusDetail}</p>
          </div>
        </div>
      `;
    }

    function renderCustomRacingCard(title, list) {
      const container = document.getElementById('matchContainer');
      container.innerHTML = '';
      list.forEach(item => {
        const { dateStr, timeStr } = formatWIBDate(item.date);
        const marked = isBookmarked(item.id);
        const bellIcon = marked ? '🔔' : '🔕';
        const bellClass = marked ? 'active' : '';

        container.innerHTML += `
          <div class="match-card">
            <div class="match-header">
              <span>📅 ${dateStr} • ${timeStr}</span>
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="badge-status badge-pre">${item.status}</span>
                <button class="btn-bell ${bellClass}" onclick="toggleBookmark('${item.id}', '${item.name}', '${item.date}', event)">${bellIcon}</button>
              </div>
            </div>
            <div style="text-align: center; padding: 6px 0;">
              <h4 style="color:var(--accent-amber); font-size:15px; margin-bottom:4px;">${item.name}</h4>
              <p style="font-size:12px; color:var(--text-muted);">${title}</p>
            </div>
          </div>
        `;
      });
    }

    // --- MODAL MATCH DETAIL (SOCCER) ---
    async function openMatchDetail(eventId) {
      const modal = document.getElementById('detailModal');
      const summaryBox = document.getElementById('modalScoreSummary');
      const modalBody = document.getElementById('modalBody');
      
      modal.style.display = 'flex';
      document.getElementById('modalLeagueName').innerText = currentLeagueName;
      summaryBox.innerHTML = '<div style="color:var(--accent-amber);">Memuat detail pertandigan...</div>';
      modalBody.innerHTML = '';

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${currentLeagueCode}/summary?event=${eventId}`);
        const data = await res.json();
        cachedMatchSummary = data;

        const header = data.header.competitions[0];
        const home = header.competitors.find(c => c.homeAway === 'home');
        const away = header.competitors.find(c => c.homeAway === 'away');

        const homeLogo = getTeamLogo(home.team);
        const awayLogo = getTeamLogo(away.team);

        summaryBox.innerHTML = `
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">${header.status.type.detail || 'Full Time'}</div>
          <div style="display:flex; justify-content:space-around; align-items:center;">
            <div style="flex:1; text-align:center;">
              <img src="${homeLogo}" onerror="this.onerror=null; this.src='${DEFAULT_LOGO}';" style="width:40px; height:40px; object-fit:contain;"><br>
              <strong style="font-size:13px; color:#fff;">${home.team.name}</strong>
            </div>
            <div style="font-size:24px; font-weight:900; color:var(--accent-amber); font-family:monospace; padding:0 12px;">
              ${home.score || 0} - ${away.score || 0}
            </div>
            <div style="flex:1; text-align:center;">
              <img src="${awayLogo}" onerror="this.onerror=null; this.src='${DEFAULT_LOGO}';" style="width:40px; height:40px; object-fit:contain;"><br>
              <strong style="font-size:13px; color:#fff;">${away.team.name}</strong>
            </div>
          </div>
        `;

        renderModalEvents();

      } catch (err) {
        summaryBox.innerHTML = '<div style="color:var(--accent-red);">Gagal memuat detail pertandingan.</div>';
      }
    }

    function renderModalEvents() {
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = '';

      if (!cachedMatchSummary || !cachedMatchSummary.keyEvents || cachedMatchSummary.keyEvents.length === 0) {
        modalBody.innerHTML = '<div class="status-msg">Belum ada kejadian/gol pada pertandingan ini.</div>';
        return;
      }

      const homeTeamId = cachedMatchSummary.header.competitions[0].competitors.find(c => c.homeAway === 'home').id;

      cachedMatchSummary.keyEvents.forEach(evt => {
        const isHome = evt.team && evt.team.id === homeTeamId;
        const clock = evt.clock ? evt.clock.displayValue : '';
        let icon = '⚽';
        let text = evt.text || '';

        if (evt.type?.text?.includes('Card') || evt.type?.text?.includes('Yellow')) icon = '🟨';
        if (evt.type?.text?.includes('Red Card')) icon = '🟥';
        if (evt.type?.text?.includes('Substitution')) icon = '🔄';

        modalBody.innerHTML += `
          <div class="timeline-item">
            <div class="timeline-left">${isHome ? `${text} <span class="icon-event">${icon}</span>` : ''}</div>
            <div class="timeline-time">${clock}</div>
            <div class="timeline-right">${!isHome ? `<span class="icon-event">${icon}</span> ${text}` : ''}</div>
          </div>
        `;
      });
    }

    function renderModalStats() {
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = '';

      if (!cachedMatchSummary || !cachedMatchSummary.boxscore || !cachedMatchSummary.boxscore.teams) {
        modalBody.innerHTML = '<div class="status-msg">Statistik pertandingan belum tersedia.</div>';
        return;
      }

      const homeStats = cachedMatchSummary.boxscore.teams[0]?.statistics || [];
      const awayStats = cachedMatchSummary.boxscore.teams[1]?.statistics || [];

      if (homeStats.length === 0) {
        modalBody.innerHTML = '<div class="status-msg">Data statistik belum tersedia.</div>';
        return;
      }

      homeStats.forEach((stat, idx) => {
        const hVal = parseFloat(stat.displayValue) || 0;
        const aVal = parseFloat(awayStats[idx]?.displayValue) || 0;
        const total = (hVal + aVal) || 1;
        const hPercent = Math.round((hVal / total) * 100);
        const aPercent = 100 - hPercent;

        modalBody.innerHTML += `
          <div class="stat-row">
            <div class="stat-label">
              <span><strong>${stat.displayValue}</strong></span>
              <span>${stat.label}</span>
              <span><strong>${awayStats[idx]?.displayValue || 0}</strong></span>
            </div>
            <div class="stat-bar-container">
              <div class="stat-bar-left" style="width: ${hPercent}%;"></div>
              <div class="stat-bar-right" style="width: ${aPercent}%;"></div>
            </div>
          </div>
        `;
      });
    }

    function switchModalTab(tab, e) {
      document.querySelectorAll('.modal-tab-btn').forEach(btn => btn.classList.remove('active'));
      if (e) e.target.classList.add('active');

      if (tab === 'events') renderModalEvents();
      if (tab === 'stats') renderModalStats();
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    // Inisialisasi awal
    loadSportsSchedule();
  </script>
</body>
</html>
