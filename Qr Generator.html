<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator - Google Lens Ready</title>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h2 {
      margin-bottom: 6px;
      color: #1f2937;
    }
    p.subtitle {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 90px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: none;
      font-size: 14px;
      outline: none;
    }
    textarea:focus {
      border-color: #2563eb;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .btn-download {
      display: none;
      width: 100%;
      padding: 12px;
      background-color: #10b981;
      color: #ffffff;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      margin-top: 10px;
      box-sizing: border-box;
    }
    .btn-download:hover {
      background-color: #059669;
    }
    #qrcode-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      border: 1px dashed #d1d5db;
    }
    #qrcode img, #qrcode canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="card" style="margin-top: 124px;">
    <h2 class="" style="margin-top: 32px;">QR Code Generator</h2>
    <p class="subtitle">Format optimal untuk Google Lens &amp; Unduh PNG</p>
    
    <textarea id="text-input" placeholder="Tulis teks atau URL di sini..."></textarea>
    <button onclick="buatQR()">Buat QR Code</button>
    <a id="download-btn" class="btn-download" download="qrcode.png">Download QR Code</a>
    
    <div id="qrcode-container">
      <div id="qrcode"></div>
    </div>
  </div>

  <script>
    function buatQR() {
      const input = document.getElementById('text-input').value.trim();
      const qrDiv = document.getElementById('qrcode');
      const downloadBtn = document.getElementById('download-btn');
      
      qrDiv.innerHTML = ""; // Bersihkan QR sebelumnya
      downloadBtn.style.display = "none";

      if (!input) {
        alert("Masukkan teks atau link terlebih dahulu!");
        return;
      }

      // 1. Rendisi QR Code persis seperti versi awal
      const qrcode = new QRCode(qrDiv, {
        text: input,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      // 2. Buat Canvas khusus download yang menyertakan area batas putih (Quiet Zone)
      setTimeout(() => {
        const qrCanvas = qrDiv.querySelector('canvas');
        const qrImg = qrDiv.querySelector('img');
        
        let sourceEl = qrCanvas || qrImg;
        if (!sourceEl) return;

        // Tambah margin putih 30px di sekeliling gambar PNG
        const margin = 30;
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = 220 + (margin * 2);
        exportCanvas.height = 220 + (margin * 2);
        const ctx = exportCanvas.getContext('2d');

        // Latar belakang putih bersih
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

        // Gambar QR Code di tengah canvas baru
        ctx.drawImage(sourceEl, margin, margin, 220, 220);

        // Tautkan ke tombol download
        downloadBtn.href = exportCanvas.toDataURL("image/png");
        downloadBtn.style.display = "block";
      }, 200);
    }
  </script>
</body>
</html>
