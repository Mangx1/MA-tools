<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Compressor (Antrean Foto)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-top: 8px;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .upload-area {
            border: 2px dashed var(--accent);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: rgba(56, 189, 248, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-upload {
            padding: 12px 20px;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
        }

        /* INPUT SINGLE POLOS DENGAN SAKTI TERBUKTI TDK AKAN FC */
        input[type="file"] {
            display: none;
        }

        .queue-card {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .queue-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .btn-del {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary { background-color: var(--accent); color: #000; }
        .btn-success { background-color: var(--success); color: #000; }
        .btn-danger { background-color: var(--danger); color: #fff; }

        .progress-bar-container {
            width: 100%;
            background-color: var(--bg-color);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.2s;
        }

        .status-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-thumb {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
            background: #000;
        }

        .result-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .result-filename {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-stats {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Kompres Foto Massal (Bulk Queue)</h1>
        <p>Tambah foto satu per satu ke antrean, lalu kompres sekaligus!</p>
    </div>

    <div class="card">
        <div class="grid-2">
            <div class="form-group">
                <label for="formatSelect">Format Output</label>
                <select id="formatSelect">
                    <option value="image/jpeg" selected>JPEG</option>
                    <option value="image/webp">WebP</option>
                    <option value="image/png">PNG</option>
                </select>
            </div>

            <div class="form-group">
                <label for="resizeMode">Maksimal Dimensi</label>
                <select id="resizeMode">
                    <option value="1280" selected>Max 1280px</option>
                    <option value="1920">Max 1920px</option>
                    <option value="800">Max 800px</option>
                    <option value="0">Ukuran Asli</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Kualitas Foto: <span id="qualVal">80%</span></label>
            <input type="range" id="qualSlider" min="10" max="100" value="80" oninput="document.getElementById('qualVal').innerText = this.value + '%'">
        </div>

        <div class="upload-area">
            <p id="queueStatus">Klik tombol untuk menambah foto ke antrean bulk</p>
            <label class="btn-upload" for="fileInput">➕ Tambah Foto ke Antrean</label>
            <input type="file" id="fileInput" onchange="addFileToQueue(this.files)">
        </div>
    </div>

    <div class="queue-card" id="queueCard">
        <label>Antrean Foto (<span id="queueCount">0</span> Foto):</label>
        <div class="queue-list" id="queueList"></div>

        <div class="btn-group" style="margin-top: 6px;">
            <button class="btn btn-danger" onclick="clearQueue()">Reset Antrean</button>
            <button class="btn btn-primary" onclick="processBulkCompress()">⚡ Kompres Semua Foto</button>
        </div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div id="statusText" class="status-text" style="margin-bottom: 8px;"></div>

        <div class="btn-group" id="downloadZipGroup" style="display: none; margin-bottom: 12px;">
            <button class="btn btn-success" onclick="downloadAllZip()">📦 Download Semua (.ZIP)</button>
        </div>

        <label>Daftar Hasil Kompresi:</label>
        <div id="resultList" class="result-list"></div>
    </div>
</div>

<script>
    let queueFiles = [];
    let processedResults = [];

    function addFileToQueue(files) {
        if (!files || files.length === 0) return;
        const file = files[0];

        queueFiles.push(file);
        renderQueue();

        document.getElementById('fileInput').value = '';
    }

    function renderQueue() {
        const queueCard = document.getElementById('queueCard');
        const queueList = document.getElementById('queueList');
        const queueCount = document.getElementById('queueCount');

        if (queueFiles.length === 0) {
            queueCard.style.display = 'none';
            return;
        }

        queueCard.style.display = 'flex';
        queueCount.innerText = queueFiles.length;
        queueList.innerHTML = '';

        queueFiles.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'queue-item';
            item.innerHTML = `
                <span><strong>${index + 1}.</strong> ${file.name} (${formatSize(file.size)})</span>
                <button class="btn-del" onclick="removeQueueItem(${index})">Hapus</button>
            `;
            queueList.appendChild(item);
        });
    }

    function removeQueueItem(index) {
        queueFiles.splice(index, 1);
        renderQueue();
    }

    function clearQueue() {
        queueFiles = [];
        processedResults = [];
        renderQueue();
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('fileInput').value = '';
    }

    async function processBulkCompress() {
        if (queueFiles.length === 0) return;

        const resultCard = document.getElementById('resultCard');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const resultList = document.getElementById('resultList');
        const downloadZipGroup = document.getElementById('downloadZipGroup');

        resultCard.style.display = 'flex';
        progressContainer.style.display = 'block';
        downloadZipGroup.style.display = 'none';
        resultList.innerHTML = '';
        processedResults = [];
        progressBar.style.width = '0%';

        for (let i = 0; i < queueFiles.length; i++) {
            const file = queueFiles[i];
            statusText.innerText = `Memproses foto ${i + 1} dari ${queueFiles.length}: ${file.name}`;

            try {
                const dataUrl = await readFileAsDataURL(file);
                const result = await compressDataUrl(dataUrl, file.name, file.size);
                
                processedResults.push(result);
                renderResultItem(result, file.size);

            } catch (err) {
                console.error("Gagal kompres: " + file.name, err);
            }

            const pct = Math.round(((i + 1) / queueFiles.length) * 100);
            progressBar.style.width = pct + '%';
        }

        statusText.innerText = `Selesai! ${processedResults.length} foto berhasil dikompres.`;
        if (processedResults.length > 1) {
            downloadZipGroup.style.display = 'flex';
        }
    }

    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(e);
            reader.readAsDataURL(file);
        });
    }

    function compressDataUrl(dataUrl, filename, originalSize) {
        return new Promise((resolve) => {
            const mimeType = document.getElementById('formatSelect').value;
            const maxDim = parseInt(document.getElementById('resizeMode').value);
            const quality = parseInt(document.getElementById('qualSlider').value) / 100;

            const img = new Image();
            img.onload = function() {
                let width = img.width;
                let height = img.height;

                if (maxDim > 0 && (width > maxDim || height > maxDim)) {
                    if (width > height) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');
                if (mimeType === 'image/jpeg') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, width, height);
                }
                ctx.drawImage(img, 0, 0, width, height);

                const compressedDataUrl = canvas.toDataURL(mimeType, quality);
                canvas.width = 0;
                canvas.height = 0;

                const head = "data:" + mimeType + ";base64,";
                const bytes = Math.round((compressedDataUrl.length - head.length) * 3 / 4);

                const ext = mimeType.split('/')[1];
                const cleanName = filename.substring(0, filename.lastIndexOf('.')) || filename;
                const newFilename = `${cleanName}_min.${ext}`;

                resolve({
                    dataUrl: compressedDataUrl,
                    filename: newFilename,
                    bytes: bytes
                });
            };

            img.onerror = function() {
                resolve({
                    dataUrl: dataUrl,
                    filename: filename,
                    bytes: originalSize
                });
            };

            img.src = dataUrl;
        });
    }

    function renderResultItem(item, originalSize) {
        const resultList = document.getElementById('resultList');
        const div = document.createElement('div');
        div.className = 'result-item';

        const savedPct = originalSize > 0 
            ? (((originalSize - item.bytes) / originalSize) * 100).toFixed(0) 
            : 0;

        div.innerHTML = `
            <img src="${item.dataUrl}" class="result-thumb" alt="preview">
            <div class="result-info">
                <div class="result-filename">${item.filename}</div>
                <div class="result-stats">
                    ${formatSize(originalSize)} ➔ <strong>${formatSize(item.bytes)}</strong> (-${savedPct}%)
                </div>
            </div>
            <a href="${item.dataUrl}" download="${item.filename}" class="btn-sm">Download</a>
        `;

        resultList.appendChild(div);
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    async function downloadAllZip() {
        if (!window.JSZip || processedResults.length === 0) return;

        try {
            const zip = new JSZip();
            processedResults.forEach(item => {
                const base64Content = item.dataUrl.split(',')[1];
                zip.file(item.filename, base64Content, { base64: true });
            });

            const base64Data = await zip.generateAsync({ type: 'base64' });
            const dataUrl = 'data:application/zip;base64,' + base64Data;
            
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'foto_massal_terkompresi.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } catch (err) {
            alert('Gagal membuat ZIP: ' + err.message);
        }
    }
</script>

</body>
</html>
