<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kompresor & Crop Gambar Modular</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        :root {
            --bg: #0b0f19;
            --card: #131b2e;
            --card-inner: #0f172a;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        h2 {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text);
        }

        .file-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .file-btn:active { background: var(--primary-hover); }
        input[type="file"] { display: none; }

        /* Pilihan Mode Pengerjaan */
        .mode-selection {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: var(--card-inner);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .mode-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Area Crop & Canvas */
        .crop-container {
            display: none;
            width: 100%;
            max-height: 300px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .crop-container img {
            max-width: 100%;
            display: block;
        }

        /* Preset Ratio Buttons */
        .ratio-buttons {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }

        .ratio-btn {
            background: var(--card-inner);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .ratio-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-process {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-process:active { background-color: var(--primary-hover); }

        .result {
            display: none;
            background: var(--card-inner);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            flex-direction: column;
            gap: 8px;
            font-size: 0.8rem;
        }

        .result h3 {
            font-size: 0.95rem;
            color: var(--accent);
        }

        .result img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-top: 6px;
        }

        .download-btn {
            background-color: var(--success);
            text-align: center;
            text-decoration: none;
            display: block;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 6px;
        }

        .download-btn:active { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit & Kompres Gambar</h2>
    
    <label class="file-btn" for="uploadImage">Pilih Gambar</label>
    <input type="file" id="uploadImage" accept="image/*">

    <!-- Mode Fitur -->
    <div class="mode-selection" id="modeWrapper">
        <button class="mode-btn active" data-mode="both">Crop & Kompres</button>
        <button class="mode-btn" data-mode="crop">Hanya Crop</button>
        <button class="mode-btn" data-mode="compress">Hanya Kompres</button>
    </div>

    <!-- Area Crop -->
    <div class="crop-container" id="cropWrapper">
        <img id="imageToCrop" src="" alt="Preview">
    </div>

    <!-- Rasio Potong -->
    <div class="ratio-buttons" id="ratioWrapper">
        <button class="ratio-btn active" data-ratio="free">Manual</button>
        <button class="ratio-btn" data-ratio="1">1:1 / 2:2</button>
        <button class="ratio-btn" data-ratio="0.75">3:4</button>
        <button class="ratio-btn" data-ratio="0.666">4:6</button>
        <button class="ratio-btn" data-ratio="1.777">16:9</button>
    </div>

    <!-- Slider Kualitas -->
    <div class="form-group" id="qualityGroup">
        <label for="qualityRange">Kualitas Kompresi: <span id="qualityVal" style="color: var(--accent);">0.7</span></label>
        <input type="range" id="qualityRange" min="0.1" max="1.0" step="0.1" value="0.7">
    </div>

    <button class="btn-process" id="compressBtn">Proses Gambar</button>

    <div class="result" id="resultContainer">
        <h3>Hasil Akhir</h3>
        <p><strong>Ukuran Asli:</strong> <span id="originalSize">-</span></p>
        <p><strong>Ukuran Baru:</strong> <span id="compressedSize">-</span></p>
        <img id="outputPreview" src="" alt="Hasil">
        <a id="downloadLink" class="download-btn" download="edited_image.jpg">⬇ Unduh Gambar</a>
    </div>
</div>

<script>
    const uploadImage = document.getElementById('uploadImage');
    const imageToCrop = document.getElementById('imageToCrop');
    const cropWrapper = document.getElementById('cropWrapper');
    const ratioWrapper = document.getElementById('ratioWrapper');
    const ratioBtns = document.querySelectorAll('.ratio-btn');
    
    const modeWrapper = document.getElementById('modeWrapper');
    const modeBtns = document.querySelectorAll('.mode-btn');

    const qualityGroup = document.getElementById('qualityGroup');
    const qualityRange = document.getElementById('qualityRange');
    const qualityVal = document.getElementById('qualityVal');
    const compressBtn = document.getElementById('compressBtn');
    
    const resultContainer = document.getElementById('resultContainer');
    const originalSize = document.getElementById('originalSize');
    const compressedSize = document.getElementById('compressedSize');
    const outputPreview = document.getElementById('outputPreview');
    const downloadLink = document.getElementById('downloadLink');

    let cropper = null;
    let originalFile = null;
    let imageSrc = null;
    let currentMode = 'both'; // 'both', 'crop', 'compress'

    qualityRange.addEventListener('input', () => {
        qualityVal.textContent = qualityRange.value;
    });

    // Pilihan Mode
    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');
            updateUIByMode();
        });
    });

    function updateUIByMode() {
        if (!originalFile) return;

        if (currentMode === 'compress') {
            cropWrapper.style.display = 'none';
            ratioWrapper.style.display = 'none';
            qualityGroup.style.display = 'flex';
            if (cropper) { cropper.destroy(); cropper = null; }
        } else if (currentMode === 'crop') {
            cropWrapper.style.display = 'block';
            ratioWrapper.style.display = 'grid';
            qualityGroup.style.display = 'none';
            initCropper();
        } else { // both
            cropWrapper.style.display = 'block';
            ratioWrapper.style.display = 'grid';
            qualityGroup.style.display = 'flex';
            initCropper();
        }
    }

    function initCropper() {
        if (cropper) cropper.destroy();
        cropper = new Cropper(imageToCrop, {
            aspectRatio: NaN,
            viewMode: 1,
            autoCropArea: 0.9,
            responsive: true,
            background: false
        });
    }

    uploadImage.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        originalFile = file;
        const reader = new FileReader();
        reader.readAsDataURL(file);

        reader.onload = function(event) {
            imageSrc = event.target.result;
            imageToCrop.src = imageSrc;
            
            modeWrapper.style.display = 'grid';
            resultContainer.style.display = 'none';
            
            updateUIByMode();
        };
    });

    // Rasio Crop
    ratioBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            if (!cropper) return;
            ratioBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const ratioAttr = btn.getAttribute('data-ratio');
            cropper.setAspectRatio(ratioAttr === 'free' ? NaN : parseFloat(ratioAttr));
        });
    });

    // Proses Akhir
    compressBtn.addEventListener('click', () => {
        if (!originalFile) {
            alert('Silakan pilih file gambar terlebih dahulu!');
            return;
        }

        let dataUrl = '';
        const quality = parseFloat(qualityRange.value);

        if (currentMode === 'crop') {
            // Hanya Crop (kualitas maksimal 1.0)
            const croppedCanvas = cropper.getCroppedCanvas();
            if (!croppedCanvas) return;
            dataUrl = croppedCanvas.toDataURL('image/jpeg', 1.0);

        } else if (currentMode === 'compress') {
            // Hanya Kompres
            const img = new Image();
            img.src = imageSrc;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                dataUrl = canvas.toDataURL('image/jpeg', quality);
                displayResult(dataUrl);
            };
            return;

        } else {
            // Crop & Kompres
            const croppedCanvas = cropper.getCroppedCanvas();
            if (!croppedCanvas) return;
            dataUrl = croppedCanvas.toDataURL('image/jpeg', quality);
        }

        displayResult(dataUrl);
    });

    function displayResult(dataUrl) {
        const head = 'data:image/jpeg;base64,';
        const sizeInBytes = Math.round((dataUrl.length - head.length) * 3 / 4);

        outputPreview.src = dataUrl;
        downloadLink.href = dataUrl;

        originalSize.textContent = (originalFile.size / 1024).toFixed(2) + ' KB';
        compressedSize.textContent = (sizeInBytes / 1024).toFixed(2) + ' KB';

        resultContainer.style.display = 'flex';
    }
</script>

</body>
</html>
