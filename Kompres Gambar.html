<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Compressor & Resizer Massal</title>

    <!-- JSZip CDN untuk fitur Download Semua (ZIP) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-top: 8px;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            margin-top: 6px;
            font-weight: 700;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        select, input[type="number"], input[type="range"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .drop-zone {
            border: 2px dashed var(--accent);
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            background: rgba(56, 189, 248, 0.03);
            cursor: pointer;
            transition: background 0.2s;
        }

        .drop-zone:hover {
            background: rgba(56, 189, 248, 0.08);
        }

        .drop-zone p {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .drop-zone span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-success { background-color: var(--success); color: #000; }

        .progress-bar-container {
            width: 100%;
            background-color: var(--bg-color);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.2s;
        }

        .summary-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 4px;
            font-size: 0.85rem;
        }

        .summary-box strong {
            color: var(--success);
        }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
        }

        .result-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-thumb {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            background: #000;
            border: 1px solid var(--border);
        }

        .result-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .result-filename {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-stats {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .result-save {
            color: var(--success);
            font-weight: 700;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Pengecil Ukuran Foto Massal</h1>
        <p>Kompresi & Resize Foto Cepat Tanpa Merusak Ketajaman</p>
        <span class="badge">Canvas Downsampling + EXIF Stripper</span>
    </div>

    <div class="card">
        <div class="grid-2">
            <div class="form-group">
                <label for="formatSelect">Format Output</label>
                <select id="formatSelect">
                    <option value="image/webp" selected>WebP (Sangat Kecil & Tajam)</option>
                    <option value="image/jpeg">JPEG (Kompatibilitas Standar)</option>
                    <option value="image/png">PNG (Tanpa Kompresi Hilang)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="resizeMode">Batas Resolusi Miring/Maksimal</label>
                <select id="resizeMode">
                    <option value="1920" selected>Max 1920px (Full HD)</option>
                    <option value="1280">Max 1280px (Standar Formulir)</option>
                    <option value="800">Max 800px (Kecil/Thumbnail)</option>
                    <option value="0">Ukuran Asli (Tanpa Resize)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Tingkat Kualitas (Quality): <span id="qualVal">80%</span></label>
            <input type="range" id="qualSlider" min="10" max="100" value="80" oninput="document.getElementById('qualVal').innerText = this.value + '%'">
        </div>

        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <p>Klik / Tarik Foto ke Sini (Bisa Banyak Foto)</p>
            <span>Format pendukung: JPG, PNG, WebP, HEIC (tergantung browser)</span>
            <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
        </div>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="summaryBox" class="summary-box">
            <div>Total Ukuran Awal: <span id="totalOrig">0 MB</span></div>
            <div>Total Ukuran Hasil: <strong id="totalComp">0 MB</strong></div>
            <div>Total Ruang Dihemat: <strong id="totalSaved" class="result-save">0%</strong></div>
        </div>

        <button id="downloadZipBtn" class="btn btn-success" onclick="downloadAllZip()" style="display: none;">
            Download Semua Foto (.ZIP)
        </button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <label>Daftar Hasil Kompresi:</label>
        <div id="resultList" class="result-list"></div>
    </div>
</div>

<script>
    let processedFiles = [];

    async function handleFiles(files) {
        if (!files || files.length === 0) return;

        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const resultCard = document.getElementById('resultCard');
        const resultList = document.getElementById('resultList');
        const summaryBox = document.getElementById('summaryBox');
        const downloadZipBtn = document.getElementById('downloadZipBtn');

        processedFiles = [];
        resultList.innerHTML = '';
        resultCard.style.display = 'block';
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        summaryBox.style.display = 'none';
        downloadZipBtn.style.display = 'none';

        const mimeType = document.getElementById('formatSelect').value;
        const maxDim = parseInt(document.getElementById('resizeMode').value);
        const quality = parseInt(document.getElementById('qualSlider').value) / 100;

        let totalOriginalSize = 0;
        let totalCompressedSize = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            totalOriginalSize += file.size;

            const compressedBlob = await compressImage(file, maxDim, mimeType, quality);
            totalCompressedSize += compressedBlob.size;

            const ext = mimeType.split('/')[1];
            const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            const newFilename = `${originalName}_min.${ext}`;

            const itemData = {
                blob: compressedBlob,
                filename: newFilename,
                originalSize: file.size,
                compressedSize: compressedBlob.size,
                url: URL.createObjectURL(compressedBlob)
            };

            processedFiles.push(itemData);
            renderResultItem(itemData);

            const pct = Math.round(((i + 1) / files.length) * 100);
            progressBar.style.width = pct + '%';
        }

        // Update Summary Stat
        document.getElementById('totalOrig').innerText = formatSize(totalOriginalSize);
        document.getElementById('totalComp').innerText = formatSize(totalCompressedSize);
        
        const savedPercent = totalOriginalSize > 0 
            ? (((totalOriginalSize - totalCompressedSize) / totalOriginalSize) * 100).toFixed(1)
            : 0;
            
        document.getElementById('totalSaved').innerText = `${savedPercent}% (${formatSize(totalOriginalSize - totalCompressedSize)})`;
        summaryBox.style.display = 'flex';

        if (processedFiles.length > 1 && window.JSZip) {
            downloadZipBtn.style.display = 'block';
        }
    }

    function compressImage(file, maxDim, mimeType, quality) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                let width = img.width;
                let height = img.height;

                // Hitung Downsampling Rasio
                if (maxDim > 0 && (width > maxDim || height > maxDim)) {
                    if (width > height) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                // Bersihkan latar belakang transparan jika ekspor ke JPEG
                if (mimeType === 'image/jpeg') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, width, height);
                }

                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob((blob) => {
                    resolve(blob);
                }, mimeType, quality);

                URL.revokeObjectURL(img.src);
            };
            img.src = URL.createObjectURL(file);
        });
    }

    function renderResultItem(item) {
        const resultList = document.getElementById('resultList');
        const div = document.createElement('div');
        div.className = 'result-item';

        const savedPct = (((item.originalSize - item.compressedSize) / item.originalSize) * 100).toFixed(0);

        div.innerHTML = `
            <img src="${item.url}" class="result-thumb" alt="preview">
            <div class="result-info">
                <div class="result-filename" title="${item.filename}">${item.filename}</div>
                <div class="result-stats">
                    ${formatSize(item.originalSize)} ➔ <strong>${formatSize(item.compressedSize)}</strong>
                    <span class="result-save">(-${savedPct}%)</span>
                </div>
            </div>
            <a href="${item.url}" download="${item.filename}" class="btn-sm">Download</a>
        `;

        resultList.appendChild(div);
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    async function downloadAllZip() {
        if (!window.JSZip || processedFiles.length === 0) return;

        const zip = new JSZip();
        processedFiles.forEach(item => {
            zip.file(item.filename, item.blob);
        });

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = 'foto_terkompresi.zip';
        a.click();
        URL.revokeObjectURL(a.href);
    }
</script>

</body>
</html>
