<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompres & Resize Gambar Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-top: 8px;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }

        .upload-area {
            border: 2px dashed var(--accent);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: rgba(56, 189, 248, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-upload {
            padding: 10px 20px;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-block;
        }

        /* INPUT POLOS TANPA ACCEPT/MULTIPLE SEPERTI PROJEK BRANKAS */
        input[type="file"] {
            display: none;
        }

        .btn-danger {
            background-color: var(--danger);
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .result-card {
            display: none;
            flex-direction: column;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .preview-img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }

        .stats {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
        }

        .btn-download {
            display: block;
            text-align: center;
            padding: 12px;
            background: var(--success);
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Kompres Gambar Pro</h1>
        <p>Aman & Stabil untuk WebView Android</p>
    </div>

    <div class="card">
        <div class="grid-2">
            <div class="form-group">
                <label for="formatSelect">Format Output</label>
                <select id="formatSelect">
                    <option value="image/jpeg" selected>JPEG</option>
                    <option value="image/webp">WebP</option>
                    <option value="image/png">PNG</option>
                </select>
            </div>

            <div class="form-group">
                <label for="resizeMode">Maksimal Dimensi</label>
                <select id="resizeMode">
                    <option value="1280" selected>Max 1280px</option>
                    <option value="1920">Max 1920px (Full HD)</option>
                    <option value="800">Max 800px</option>
                    <option value="0">Ukuran Asli</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Kualitas Foto: <span id="qualVal">80%</span></label>
            <input type="range" id="qualSlider" min="10" max="100" value="80" oninput="document.getElementById('qualVal').innerText = this.value + '%'">
        </div>

        <div class="upload-area">
            <p id="fileStatus">Pilih foto dari galeri HP kamu</p>
            <label class="btn-upload" for="fileInput">Pilih Foto</label>
            <input type="file" id="fileInput" onchange="processSingleFile(this.files)">
        </div>
    </div>

    <div class="result-card" id="resultCard">
        <label>Hasil Kompresi:</label>
        <img id="previewImg" class="preview-img" alt="Preview">
        <div class="stats">
            <span>Awal: <strong id="origSize">-</strong></span>
            <span>Hasil: <strong id="compSize" style="color: var(--success);">-</strong></span>
        </div>
        <a id="downloadBtn" class="btn-download" download="foto_terkompresi.jpg">Download Hasil Foto</a>
        <button class="btn-danger" onclick="resetAll()">Reset / Pilih Foto Lain</button>
    </div>
</div>

<script>
    function processSingleFile(files) {
        if (!files || files.length === 0) return;
        const file = files[0];

        document.getElementById('fileStatus').innerText = "Memproses: " + file.name;

        // FileReader jauh lebih aman di Android WebView dibanding URL.createObjectURL
        const reader = new FileReader();
        reader.onload = function(e) {
            const dataUrl = e.target.result;
            compressDataUrl(dataUrl, file.size, file.name);
        };
        reader.onerror = function() {
            alert("Gagal membaca file foto.");
        };
        reader.readAsDataURL(file);
    }

    function compressDataUrl(dataUrl, originalSize, filename) {
        const mimeType = document.getElementById('formatSelect').value;
        const maxDim = parseInt(document.getElementById('resizeMode').value);
        const quality = parseInt(document.getElementById('qualSlider').value) / 100;

        const img = new Image();
        img.onload = function() {
            let width = img.width;
            let height = img.height;

            if (maxDim > 0 && (width > maxDim || height > maxDim)) {
                if (width > height) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                } else {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            if (mimeType === 'image/jpeg') {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, width, height);
            }
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL(mimeType, quality);

            // Perkiraan ukuran byte Base64
            const head = "data:" + mimeType + ";base64,";
            const compressedBytes = Math.round((compressedDataUrl.length - head.length) * 3 / 4);

            document.getElementById('previewImg').src = compressedDataUrl;
            document.getElementById('origSize').innerText = formatSize(originalSize);
            document.getElementById('compSize').innerText = formatSize(compressedBytes);

            const ext = mimeType.split('/')[1];
            const cleanName = filename.substring(0, filename.lastIndexOf('.')) || filename;
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.href = compressedDataUrl;
            downloadBtn.download = cleanName + "_min." + ext;

            document.getElementById('resultCard').style.display = 'flex';
            document.getElementById('fileStatus').innerText = "Selesai mengompres!";
        };

        img.onerror = function() {
            alert("File yang dipilih bukan format gambar yang valid.");
        };

        img.src = dataUrl;
    }

    function resetAll() {
        document.getElementById('fileInput').value = '';
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('fileStatus').innerText = 'Pilih foto dari galeri HP kamu';
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }
</script>

</body>
</html>
