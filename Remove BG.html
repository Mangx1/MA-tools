<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hapus Background API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #12181b; color: #f0f0f0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; text-align: center; }
    h2 { margin-bottom: 6px; font-size: 1.4rem; color: #4db6ac; }
    p { font-size: 0.85rem; color: #a0a0a0; margin-bottom: 15px; }
    
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #b0bec5;
      margin-bottom: 5px;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #37474f;
      background: #1e272c;
      color: #fff;
      font-size: 0.85rem;
    }

    .upload-area {
      border: 2px dashed #4db6ac;
      border-radius: 12px;
      padding: 25px 15px;
      background: #1e272c;
      cursor: pointer;
      transition: 0.2s;
    }
    .upload-area:hover { background: #263238; }
    input[type="file"] { display: none; }
    
    .btn {
      background: #4db6ac;
      color: #12181b;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      margin-top: 10px;
    }
    
    .status {
      margin: 15px 0;
      font-size: 0.85rem;
      color: #ffca28;
      min-height: 20px;
      word-break: break-word;
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .img-card {
      background: #1e272c;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    .img-card span { display: block; font-size: 0.8rem; margin-bottom: 8px; color: #b0bec5; }
    img { max-width: 100%; max-height: 260px; border-radius: 6px; object-fit: contain; }
    
    .checkerboard {
      background-image: linear-gradient(45deg, #2a3439 25%, transparent 25%), 
                        linear-gradient(-45deg, #2a3439 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #2a3439 75%), 
                        linear-gradient(-45deg, transparent 75%, #2a3439 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      padding: 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Hapus Background API</h2>
  <p>Potong background otomatis via Remove.bg API</p>

  <div class="input-group">
    <label for="apiKey">API Key Remove.bg:</label>
    <input type="password" id="apiKey" placeholder="Masukkan API Key Remove.bg kamu">
  </div>

  <div class="upload-area" onclick="document.getElementById('imageInput').click()">
    <span>Pilih Foto dari Galeri</span>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div id="status" class="status">Masukkan API Key lalu pilih foto...</div>

  <div class="preview-box">
    <div class="img-card" id="originalCard" style="display:none;">
      <span>Foto Asli</span>
      <img id="originalImg">
    </div>
    
    <div class="img-card" id="resultCard" style="display:none;">
      <span>Hasil Transparan</span>
      <div class="checkerboard">
        <img id="resultImg">
      </div>
      <a id="downloadBtn" download="hasil-no-bg.png">
        <button class="btn">Simpan Gambar (PNG)</button>
      </a>
    </div>
  </div>
</div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  const imageInput = document.getElementById('imageInput');
  const originalImg = document.getElementById('originalImg');
  const resultImg = document.getElementById('resultImg');
  const originalCard = document.getElementById('originalCard');
  const resultCard = document.getElementById('resultCard');
  const downloadBtn = document.getElementById('downloadBtn');
  const status = document.getElementById('status');

  // Simpan API Key di LocalStorage HP
  apiKeyInput.value = localStorage.getItem('remove_bg_api_key') || '';
  apiKeyInput.addEventListener('change', () => {
    localStorage.setItem('remove_bg_api_key', apiKeyInput.value.trim());
  });

  imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) {
      status.style.color = '#ff5252';
      status.innerText = 'Harap masukkan API Key Remove.bg terlebih dahulu!';
      return;
    }

    originalImg.src = URL.createObjectURL(file);
    originalCard.style.display = 'block';
    resultCard.style.display = 'none';
    status.style.color = '#ffca28';
    status.innerText = 'Memproses potongan gambar...';

    const formData = new FormData();
    formData.append('image_file', file);
    formData.append('size', 'auto');

    try {
      const response = await fetch('https://api.remove.bg/v1.0/removebg', {
        method: 'POST',
        headers: {
          'X-Api-Key': apiKey
        },
        body: formData
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.errors ? errorData.errors[0].title : 'Gagal memproses gambar');
      }

      const blob = await response.blob();
      const resultUrl = URL.createObjectURL(blob);
      resultImg.src = resultUrl;
      downloadBtn.href = resultUrl;
      resultCard.style.display = 'block';
      status.style.color = '#4db6ac';
      status.innerText = 'Selesai!';
    } catch (error) {
      console.error(error);
      status.style.color = '#ff5252';
      status.innerText = 'Error: ' + error.message;
    }
  });
</script>

</body>
</html>
