<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Arcade Bulletproof</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #05070c; color: #fff; }

    .app-viewport { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }

    /* Header */
    .app-header {
      height: 48px;
      background: #0d121f;
      border-bottom: 2px solid #00f3ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      z-index: 100;
    }
    .app-title { font-size: 0.95rem; font-weight: bold; color: #00f3ff; text-shadow: 0 0 8px #00f3ff; }
    .btn-sound { background: #182238; border: 1px solid #00f3ff; color: #00f3ff; border-radius: 16px; padding: 4px 10px; font-size: 0.72rem; font-weight: bold; cursor: pointer; }

    /* Screens */
    .screen { display: none; width: 100%; height: calc(100vh - 48px); position: relative; }
    .screen.active { display: flex; flex-direction: column; }

    /* HUB MENU GRID */
    #hub-screen { padding: 12px; overflow-y: auto; }
    .hub-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 500px; margin: 0 auto; padding-bottom: 20px; }
    
    button.game-card {
      background: linear-gradient(135deg, #12192c, #0a0e19);
      border: 1.5px solid #00f3ff;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      outline: none;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,243,255,0.15);
    }
    button.game-card:active { transform: scale(0.95); border-color: #ff007f; background: #1a243d; }
    .game-icon { font-size: 2.3rem; margin-bottom: 4px; pointer-events: none; }
    .game-title { font-size: 0.85rem; font-weight: bold; color: #fff; pointer-events: none; }
    .game-badge { font-size: 0.68rem; color: #ffe600; margin-top: 4px; font-weight: bold; background: rgba(255,230,0,0.12); padding: 2px 8px; border-radius: 8px; pointer-events: none; }

    /* HUD BAR */
    .game-hud {
      height: 40px;
      background: #0d121f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #1a243a;
    }
    .btn-back { background: #ff007f; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    .hud-score { font-size: 0.9rem; font-weight: bold; color: #00f3ff; }

    /* CANVAS CONTAINER */
    .canvas-box { flex: 1; width: 100%; position: relative; background: #000; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }

    /* IN-GAME OVERLAY */
    .game-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 7, 12, 0.92);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }
    .overlay-title { font-size: 1.6rem; font-weight: bold; color: #ff007f; text-shadow: 0 0 12px #ff007f; margin-bottom: 8px; }
    .overlay-desc { font-size: 0.95rem; color: #ffe600; margin-bottom: 18px; font-weight: bold; }
    .btn-action { background: #00f3ff; color: #000; border: none; padding: 10px 22px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; margin: 4px; cursor: pointer; }

    /* D-PAD CONTROL BUTTONS */
    .dpad-overlay {
      position: absolute;
      bottom: 15px; left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 6px;
      z-index: 10;
    }
    button.dbtn { background: rgba(24, 34, 56, 0.88); border: 1.5px solid #00f3ff; color: #00f3ff; font-size: 1.3rem; border-radius: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    button.dbtn:active { background: #00f3ff; color: #000; }

    /* MEMORY MATCH STYLES */
    #memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; height: 100%; padding: 12px; }
    button.mem-card { background: #12192c; border: 1.5px solid #00f3ff; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; color: #fff; }
    button.mem-card.flipped { background: #ff007f; border-color: #ff007f; }
  
    /* Android safe-area: turunkan header agar tidak tertutup status bar */
    .app-header {
      padding-top: env(safe-area-inset-top, 0px);
      height: calc(48px + env(safe-area-inset-top, 0px));
    }
    .screen { height: calc(100vh - 48px - env(safe-area-inset-top, 0px)); }
  </style>
</head>
<body>

<div class="app-viewport">
  <!-- Header -->
  <div class="app-header">
    <div class="app-title">⚡ CYBER ARCADE</div>
    <button type="button" class="btn-sound" id="soundBtn">🔊 Audio: ON</button>
  </div>

  <!-- SCREEN 1: HUB MENU -->
  <div id="hub-screen" class="screen active">
    <div class="hub-grid">
      <button type="button" class="game-card" id="btn-snake">
        <span class="game-icon">🐍</span>
        <span class="game-title">Neon Snake HD</span>
        <span class="game-badge" id="hs-snake">Best: 0</span>
      </button>

      <button type="button" class="game-card" id="btn-flappy">
        <span class="game-icon">🐤</span>
        <span class="game-title">Cyber Flappy</span>
        <span class="game-badge" id="hs-flappy">Best: 0</span>
      </button>

      <button type="button" class="game-card" id="btn-breaker">
        <span class="game-icon">🧱</span>
        <span class="game-title">Brick Breaker</span>
        <span class="game-badge" id="hs-breaker">Best: 0</span>
      </button>

      <button type="button" class="game-card" id="btn-shooter">
        <span class="game-icon">🚀</span>
        <span class="game-title">Space Shooter</span>
        <span class="game-badge" id="hs-shooter">Best: 0</span>
      </button>

      <button type="button" class="game-card" id="btn-racer">
        <span class="game-icon">🚗</span>
        <span class="game-title">Cyber Highway</span>
        <span class="game-badge" id="hs-racer">Best: 0</span>
      </button>

      <button type="button" class="game-card" id="btn-memory">
        <span class="game-icon">🧠</span>
        <span class="game-title">Memory Match</span>
        <span class="game-badge" id="hs-memory">Best: -</span>
      </button>
    </div>
  </div>

  <!-- SCREEN 2: GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div class="game-hud">
      <button type="button" class="btn-back" id="btn-menu">← Menu</button>
      <div class="hud-score" id="game-score">Score: 0</div>
    </div>
    
    <div class="canvas-box" id="canvasContainer">
      <canvas id="gameCanvas"></canvas>

      <!-- Memory Grid -->
      <div id="memory-grid" style="display:none;"></div>

      <!-- Snake D-Pad -->
      <div class="dpad-overlay" id="snakeDpad" style="display:none;">
        <div></div><button type="button" class="dbtn" id="dpad-up">▲</button><div></div>
        <button type="button" class="dbtn" id="dpad-left">◀</button><div></div><button type="button" class="dbtn" id="dpad-right">▶</button>
        <div></div><button type="button" class="dbtn" id="dpad-down">▼</button><div></div>
      </div>

      <!-- In-Game Custom Modal Overlay -->
      <div class="game-overlay" id="gameOverlay">
        <div class="overlay-title">GAME OVER</div>
        <div class="overlay-desc" id="overlayScore">Score: 0</div>
        <div>
          <button type="button" class="btn-action" id="btn-restart">Play Again</button>
          <button type="button" class="btn-action" style="background:#ff007f; color:#fff;" id="btn-overlay-menu">Menu</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // --- SAFE STORAGE WRAPPER (MENEMBUS BLOKIR DOM STORAGE CONTENT://) ---
  function safeGet(key, defVal) {
    try {
      return localStorage.getItem(key) || defVal;
    } catch(e) {
      return defVal;
    }
  }

  function safeSet(key, val) {
    try {
      localStorage.setItem(key, val);
    } catch(e) {}
  }

  // --- AUDIO SYNTHESIZER ENGINE ---
  let soundEnabled = true, audioCtx = null;

  function unlockAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    if (!soundEnabled) return;
    unlockAudio();
    try {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      let now = audioCtx.currentTime;

      if (type === 'eat' || type === 'point') {
        osc.frequency.setValueAtTime(587, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'jump' || type === 'shoot') {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      }
    } catch(e) {}
  }

  // --- HUB ROUTER & GAME LAUNCHER ---
  let activeGameKey = '';
  let animLoop = null, gameInterval = null;
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function updateScoresUI() {
    document.getElementById('hs-snake').innerText = 'Best: ' + safeGet('g_snake', 0);
    document.getElementById('hs-flappy').innerText = 'Best: ' + safeGet('g_flappy', 0);
    document.getElementById('hs-breaker').innerText = 'Best: ' + safeGet('g_breaker', 0);
    document.getElementById('hs-shooter').innerText = 'Best: ' + safeGet('g_shooter', 0);
    document.getElementById('hs-racer').innerText = 'Best: ' + safeGet('g_racer', 0);
    document.getElementById('hs-memory').innerText = 'Best: ' + (safeGet('g_memory', null) ? safeGet('g_memory', '') + ' moves' : '-');
  }

  function showHub() {
    stopAllGames();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('hub-screen').classList.add('active');
    updateScoresUI();
  }

  function launchGame(key) {
    stopAllGames();
    activeGameKey = key;

    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('game-screen').classList.add('active');
    
    document.getElementById('memory-grid').style.display = 'none';
    document.getElementById('snakeDpad').style.display = 'none';
    document.getElementById('gameOverlay').style.display = 'none';
    canvas.style.display = 'block';

    setTimeout(() => {
      const box = document.getElementById('canvasContainer');
      canvas.width = box.clientWidth || window.innerWidth;
      canvas.height = box.clientHeight || (window.innerHeight - 50);

      if (key === 'snake') startSnake();
      else if (key === 'flappy') startFlappy();
      else if (key === 'breaker') startBreaker();
      else if (key === 'shooter') startShooter();
      else if (key === 'racer') startRacer();
      else if (key === 'memory') startMemory();
    }, 50);
  }

  function stopAllGames() {
    if (animLoop) cancelAnimationFrame(animLoop);
    if (gameInterval) clearInterval(gameInterval);
    canvas.onclick = null; canvas.ontouchstart = null; canvas.ontouchmove = null;
  }

  function showGameOver(score, key) {
    playSound('lose');
    let hs = parseInt(safeGet('g_' + key, 0));
    if (score > hs) safeSet('g_' + key, score);
    document.getElementById('overlayScore').innerText = 'Final Score: ' + score;
    document.getElementById('gameOverlay').style.display = 'flex';
  }

  // --- 1. NEON SNAKE HD ---
  let snake, snakeDir, snakeFood, snakeScore;
  const sGrid = 18;

  function startSnake() {
    document.getElementById('snakeDpad').style.display = 'grid';
    snake = [{x: sGrid*4, y: sGrid*4}, {x: sGrid*3, y: sGrid*4}];
    snakeDir = 'RIGHT';
    snakeScore = 0;
    spawnSnakeFood();
    document.getElementById('game-score').innerText = 'Score: 0';
    gameInterval = setInterval(updateSnake, 160);
  }

  function setSnakeDir(dir) {
    if (dir === 'UP' && snakeDir !== 'DOWN') snakeDir = 'UP';
    if (dir === 'DOWN' && snakeDir !== 'UP') snakeDir = 'DOWN';
    if (dir === 'LEFT' && snakeDir !== 'RIGHT') snakeDir = 'LEFT';
    if (dir === 'RIGHT' && snakeDir !== 'LEFT') snakeDir = 'RIGHT';
  }

  function spawnSnakeFood() {
    snakeFood = {
      x: Math.floor(Math.random() * (canvas.width / sGrid)) * sGrid,
      y: Math.floor(Math.random() * (canvas.height / sGrid)) * sGrid
    };
  }

  function updateSnake() {
    let head = {x: snake[0].x, y: snake[0].y};
    if (snakeDir === 'UP') head.y -= sGrid;
    if (snakeDir === 'DOWN') head.y += sGrid;
    if (snakeDir === 'LEFT') head.x -= sGrid;
    if (snakeDir === 'RIGHT') head.x += sGrid;

    if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || snake.some(s => s.x === head.x && s.y === head.y)) {
      clearInterval(gameInterval);
      return showGameOver(snakeScore, 'snake');
    }

    snake.unshift(head);
    if (Math.abs(head.x - snakeFood.x) < sGrid && Math.abs(head.y - snakeFood.y) < sGrid) {
      playSound('eat');
      snakeScore += 10;
      document.getElementById('game-score').innerText = 'Score: ' + snakeScore;
      spawnSnakeFood();
    } else {
      snake.pop();
    }

    ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff007f'; ctx.fillRect(snakeFood.x, snakeFood.y, sGrid - 2, sGrid - 2);
    ctx.fillStyle = '#00f3ff'; snake.forEach(s => ctx.fillRect(s.x, s.y, sGrid - 2, sGrid - 2));
  }

  // --- 2. CYBER FLAPPY ---
  let fY, fVel, fPipes, fScore;
  function startFlappy() {
    fY = canvas.height / 2; fVel = 0; fPipes = []; fScore = 0;
    document.getElementById('game-score').innerText = 'Score: 0';
    const doJump = () => { fVel = -6; playSound('jump'); };
    canvas.onclick = doJump; canvas.ontouchstart = doJump;
    updateFlappy();
  }

  function updateFlappy() {
    fVel += 0.35; fY += fVel;
    if (fPipes.length === 0 || fPipes[fPipes.length - 1].x < canvas.width - 150) {
      let gap = 115;
      let topH = Math.floor(Math.random() * (canvas.height - gap - 80)) + 30;
      fPipes.push({x: canvas.width, top: topH, bottom: topH + gap, passed: false});
    }
    fPipes.forEach(p => p.x -= 2.2);

    if (fY < 0 || fY > canvas.height) return showGameOver(fScore, 'flappy');

    for (let p of fPipes) {
      if (p.x < 40 && p.x + 40 > 20) {
        if (fY < p.top || fY > p.bottom) return showGameOver(fScore, 'flappy');
      }
      if (!p.passed && p.x < 20) {
        p.passed = true; fScore++; playSound('point');
        document.getElementById('game-score').innerText = 'Score: ' + fScore;
      }
    }

    ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffe600'; ctx.beginPath(); ctx.arc(30, fY, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00f3ff';
    fPipes.forEach(p => { ctx.fillRect(p.x, 0, 40, p.top); ctx.fillRect(p.x, p.bottom, 40, canvas.height - p.bottom); });
    fPipes = fPipes.filter(p => p.x > -50);
    animLoop = requestAnimationFrame(updateFlappy);
  }

  // --- 3. BRICK BREAKER ---
  let bPadX, bX, bY, bDX, bDY, bBricks, bScore;
  function startBreaker() {
    bPadX = (canvas.width - 70) / 2; bX = canvas.width / 2; bY = canvas.height - 40;
    bDX = 3; bDY = -3; bScore = 0;
    document.getElementById('game-score').innerText = 'Score: 0';
    const movePad = (e) => {
      let clientX = e.touches ? e.touches[0].clientX : e.clientX;
      bPadX = clientX - 35;
    };
    canvas.ontouchmove = movePad; canvas.onmousemove = movePad;
    initBricks(); updateBreaker();
  }

  function initBricks() {
    bBricks = [];
    let cols = 5, rows = 4, w = (canvas.width - 25) / cols;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        bBricks.push({x: 12 + c * w, y: 30 + r * 22, w: w - 4, h: 16, alive: true});
  }

  function updateBreaker() {
    bX += bDX; bY += bDY;
    if (bX < 0 || bX > canvas.width) bDX = -bDX;
    if (bY < 0) bDY = -bDY;
    if (bY >= canvas.height - 30 && bX >= bPadX && bX <= bPadX + 70) { playSound('jump'); bDY = -Math.abs(bDY); }
    if (bY > canvas.height) return showGameOver(bScore, 'breaker');

    bBricks.forEach(b => {
      if (b.alive && bX > b.x && bX < b.x + b.w && bY > b.y && bY < b.y + b.h) {
        bDY = -bDY; b.alive = false; bScore += 10; playSound('eat');
        document.getElementById('game-score').innerText = 'Score: ' + bScore;
      }
    });
    if (bBricks.every(b => !b.alive)) initBricks();

    ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00f3ff'; ctx.fillRect(bPadX, canvas.height - 25, 70, 10);
    ctx.fillStyle = '#ffe600'; ctx.beginPath(); ctx.arc(bX, bY, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff007f'; bBricks.forEach(b => { if (b.alive) ctx.fillRect(b.x, b.y, b.w, b.h); });
    animLoop = requestAnimationFrame(updateBreaker);
  }

  // --- 4. SPACE SHOOTER ---
  let sShipX, sBullets, sAliens, sScore;
  function startShooter() {
    sShipX = canvas.width / 2; sBullets = []; sAliens = []; sScore = 0;
    document.getElementById('game-score').innerText = 'Score: 0';
    const moveShip = (e) => { sShipX = e.touches ? e.touches[0].clientX : e.clientX; };
    canvas.ontouchmove = moveShip; canvas.onmousemove = moveShip;
    const shoot = () => { sBullets.push({x: sShipX, y: canvas.height - 40}); playSound('shoot'); };
    canvas.onclick = shoot; canvas.ontouchstart = shoot;
    updateShooter();
  }

  function updateShooter() {
    if (Math.random() < 0.03) sAliens.push({x: Math.random() * (canvas.width - 30), y: -20});
    sBullets.forEach(b => b.y -= 7);
    sAliens.forEach(a => a.y += 2);

    for (let a of sAliens) {
      if (a.y > canvas.height - 30) return showGameOver(sScore, 'shooter');
      for (let b of sBullets) {
        if (Math.abs(b.x - (a.x + 15)) < 15 && Math.abs(b.y - a.y) < 15) {
          a.dead = true; b.dead = true; sScore += 10; playSound('eat');
          document.getElementById('game-score').innerText = 'Score: ' + sScore;
        }
      }
    }
    sBullets = sBullets.filter(b => !b.dead && b.y > 0);
    sAliens = sAliens.filter(a => !a.dead && a.y < canvas.height);

    ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00f3ff'; ctx.fillRect(sShipX - 15, canvas.height - 30, 30, 15);
    ctx.fillStyle = '#ffe600'; sBullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 10));
    ctx.fillStyle = '#ff007f'; sAliens.forEach(a => ctx.fillRect(a.x, a.y, 25, 18));
    animLoop = requestAnimationFrame(updateShooter);
  }

  // --- 5. CYBER HIGHWAY RACER ---
  let rCarX, rEnemies, rScore;
  function startRacer() {
    rCarX = canvas.width / 2; rEnemies = []; rScore = 0;
    document.getElementById('game-score').innerText = 'Score: 0';
    const steer = (e) => { rCarX = e.touches ? e.touches[0].clientX : e.clientX; };
    canvas.ontouchmove = steer; canvas.onmousemove = steer;
    updateRacer();
  }

  function updateRacer() {
    rScore++; document.getElementById('game-score').innerText = 'Score: ' + Math.floor(rScore/10);
    if (Math.random() < 0.04) rEnemies.push({x: Math.random() * (canvas.width - 35), y: -40});
    rEnemies.forEach(e => e.y += 4);

    for (let e of rEnemies) {
      if (Math.abs(rCarX - (e.x + 17)) < 25 && e.y > canvas.height - 70 && e.y < canvas.height - 10)
        return showGameOver(Math.floor(rScore/10), 'racer');
    }
    rEnemies = rEnemies.filter(e => e.y < canvas.height);

    ctx.fillStyle = '#05070c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00f3ff'; ctx.fillRect(rCarX - 15, canvas.height - 50, 30, 40);
    ctx.fillStyle = '#ff007f'; rEnemies.forEach(e => ctx.fillRect(e.x, e.y, 30, 40));
    animLoop = requestAnimationFrame(updateRacer);
  }

  // --- 6. MEMORY MATCH ---
  let mFlipped = [], mMoves = 0, mMatched = 0;
  function startMemory() {
    canvas.style.display = 'none';
    const grid = document.getElementById('memory-grid');
    grid.style.display = 'grid'; grid.innerHTML = '';
    mMoves = 0; mMatched = 0; mFlipped = [];
    document.getElementById('game-score').innerText = 'Moves: 0';

    let deck = ['🚀','🥊','🏎️','⚽','🏀','🎮','👾','🔥','🚀','🥊','🏎️','⚽','🏀','🎮','👾','🔥'].sort(() => Math.random() - 0.5);
    deck.forEach(emoji => {
      let card = document.createElement('button');
      card.type = 'button';
      card.className = 'mem-card'; card.dataset.emoji = emoji;
      card.onclick = () => {
        if (mFlipped.length < 2 && !card.classList.contains('flipped')) {
          playSound('jump'); card.classList.add('flipped'); card.innerText = emoji; mFlipped.push(card);
          if (mFlipped.length === 2) {
            mMoves++; document.getElementById('game-score').innerText = 'Moves: ' + mMoves;
            if (mFlipped[0].dataset.emoji === mFlipped[1].dataset.emoji) {
              playSound('point'); mMatched++; mFlipped = [];
              if (mMatched === 8) {
                let hs = parseInt(safeGet('g_memory', 999));
                if (mMoves < hs) safeSet('g_memory', mMoves);
                showGameOver(mMoves, 'memory');
              }
            } else {
              setTimeout(() => { mFlipped.forEach(c => { c.classList.remove('flipped'); c.innerText = ''; }); mFlipped = []; }, 600);
            }
          }
        }
      };
      grid.appendChild(card);
    });
  }

  // --- BINDING EVENT LISTENERS SECARA BEBAS ERROR ---
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('soundBtn').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerText = soundEnabled ? '🔊 Audio: ON' : '🔇 Audio: OFF';
    };

    document.getElementById('btn-snake').onclick = () => launchGame('snake');
    document.getElementById('btn-flappy').onclick = () => launchGame('flappy');
    document.getElementById('btn-breaker').onclick = () => launchGame('breaker');
    document.getElementById('btn-shooter').onclick = () => launchGame('shooter');
    document.getElementById('btn-racer').onclick = () => launchGame('racer');
    document.getElementById('btn-memory').onclick = () => launchGame('memory');

    document.getElementById('btn-menu').onclick = showHub;
    document.getElementById('btn-overlay-menu').onclick = showHub;
    document.getElementById('btn-restart').onclick = () => launchGame(activeGameKey);

    document.getElementById('dpad-up').onclick = () => setSnakeDir('UP');
    document.getElementById('dpad-down').onclick = () => setSnakeDir('DOWN');
    document.getElementById('dpad-left').onclick = () => setSnakeDir('LEFT');
    document.getElementById('dpad-right').onclick = () => setSnakeDir('RIGHT');

    updateScoresUI();
  });
</script>
