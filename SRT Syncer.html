<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT Subtitle Syncer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #12181b; color: #f0f0f0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }
    
    .app-header { text-align: center; margin-bottom: 15px; }
    .app-header h2 { color: #4db6ac; font-size: 1.4rem; }
    .app-header p { font-size: 0.85rem; color: #a0a0a0; margin-top: 4px; }
    
    .card { background: #1e272c; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
    
    label { display: block; font-size: 0.8rem; color: #b0bec5; margin-bottom: 5px; }
    input[type="file"] { display: none; }
    
    .file-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #263238;
      border: 1px dashed #4db6ac;
      padding: 10px 12px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .file-btn span.file-name { color: #4db6ac; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

    /* Video Player Box & Subtitle Overlay */
    .video-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    video { width: 100%; max-height: 260px; display: block; }
    
    .sub-overlay {
      position: absolute;
      bottom: 45px;
      left: 10px;
      right: 10px;
      text-align: center;
      pointer-events: none;
    }
    .sub-overlay span {
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 0.95rem;
      padding: 4px 10px;
      border-radius: 4px;
      line-height: 1.4;
      display: inline-block;
      text-shadow: 1px 1px 2px #000;
      font-weight: 500;
    }

    /* Sync Controls */
    .offset-display {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffca28;
      margin: 8px 0;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn {
      background: #4db6ac;
      color: #12181b;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
    }
    .btn-sync { background: #263238; color: #4db6ac; border: 1px solid #4db6ac; }
    .btn-sync:active { background: #4db6ac; color: #12181b; }
    .btn-reset { background: #d32f2f; color: #fff; }

    /* Optimized Live Subtitle List */
    .sub-list-box {
      max-height: 180px;
      overflow-y: auto;
      background: #12181b;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #37474f;
      position: relative;
    }
    .sub-item {
      font-size: 0.78rem;
      padding: 6px;
      border-bottom: 1px solid #263238;
      color: #cfd8dc;
    }
    .sub-item.active { background: #004d40; color: #ffca28; font-weight: bold; border-radius: 4px; }
    .sub-time { color: #4db6ac; font-size: 0.7rem; display: block; margin-bottom: 2px; }

    .action-box { margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="app-header">
    <h2>SRT Subtitle Syncer</h2>
    <p>Geser & pas-kan timing subtitle SRT dengan video</p>
  </div>

  <!-- Upload Section -->
  <div class="card">
    <label>1. Pilih Video & File SRT:</label>
    
    <div class="file-btn" onclick="document.getElementById('videoInput').click()">
      <span>🎥 Video:</span>
      <span class="file-name" id="videoName">Belum dipilih</span>
    </div>
    <input type="file" id="videoInput" accept="video/*">

    <div class="file-btn" onclick="document.getElementById('srtInput').click()">
      <span>📄 File Subtitle (.SRT):</span>
      <span class="file-name" id="srtName">Belum dipilih</span>
    </div>
    <input type="file" id="srtInput" accept=".srt">
  </div>

  <!-- Video Player Box -->
  <div class="video-box" id="videoBox" style="display:none;">
    <video id="videoPlayer" controls></video>
    <div class="sub-overlay"><span id="subText"></span></div>
  </div>

  <!-- Control Sync Box -->
  <div class="card" id="controlCard" style="display:none;">
    <label>2. Atur Pergeseran Waktu (Offset):</label>
    <div class="offset-display" id="offsetText">Offset: 0.00 Detik</div>

    <div class="btn-grid">
      <button class="btn btn-sync" onclick="addOffset(-1.0)">-1.0s</button>
      <button class="btn btn-sync" onclick="addOffset(-0.2)">-0.2s</button>
      <button class="btn btn-sync" onclick="addOffset(+0.2)">+0.2s</button>
      <button class="btn btn-sync" onclick="addOffset(+1.0)">+1.0s</button>
    </div>
    <div class="btn-grid">
      <button class="btn btn-sync" onclick="addOffset(-3.0)">-3.0s</button>
      <button class="btn btn-sync" onclick="addOffset(-0.5)">-0.5s</button>
      <button class="btn btn-sync" onclick="addOffset(+0.5)">+0.5s</button>
      <button class="btn btn-sync" onclick="addOffset(+3.0)">+3.0s</button>
    </div>

    <button class="btn btn-sync" style="width:100%; margin-bottom: 8px;" onclick="syncFirstSubToCurrentTime()">
      ⏱️ Kunci Subtitle Pertama ke Detik Video Saat Ini
    </button>
    <button class="btn btn-reset" style="width:100%;" onclick="resetOffset()">🔄 Reset Offset ke 0</button>
  </div>

  <!-- Live List & Download -->
  <div class="card" id="resultCard" style="display:none;">
    <label>3. Daftar Subtitle (Tersetel):</label>
    <div class="sub-list-box" id="subListBox"></div>

    <div class="action-box">
      <a id="downloadBtn" download="subtitle_synced.srt">
        <button class="btn" style="width:100%;">💾 Simpan & Download File SRT Baru</button>
      </a>
    </div>
  </div>
</div>

<script>
  let rawSubtitles = [];
  let syncedSubtitles = [];
  let currentOffsetSec = 0;
  let lastActiveIdx = -1; // Indeks subtitle aktif sebelumnya
  let currentBlobUrl = null;

  const videoInput = document.getElementById('videoInput');
  const srtInput = document.getElementById('srtInput');
  const videoPlayer = document.getElementById('videoPlayer');
  const videoBox = document.getElementById('videoBox');
  const controlCard = document.getElementById('controlCard');
  const resultCard = document.getElementById('resultCard');
  const subText = document.getElementById('subText');
  const offsetText = document.getElementById('offsetText');
  const subListBox = document.getElementById('subListBox');
  const downloadBtn = document.getElementById('downloadBtn');

  videoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('videoName').innerText = file.name;
    videoPlayer.src = URL.createObjectURL(file);
    videoBox.style.display = 'block';
  });

  srtInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('srtName').innerText = file.name;

    const reader = new FileReader();
    reader.onload = (event) => {
      parseSRT(event.target.result);
      controlCard.style.display = 'block';
      resultCard.style.display = 'block';
      applyOffset(0);
    };
    reader.readAsText(file);
  });

  function parseSRT(srtData) {
    rawSubtitles = [];
    const blocks = srtData.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n\n');

    blocks.forEach(block => {
      const lines = block.trim().split('\n');
      if (lines.length >= 2) {
        let timeIndex = lines[0].includes('-->') ? 0 : 1;
        if (lines[timeIndex] && lines[timeIndex].includes('-->')) {
          const times = lines[timeIndex].split('-->');
          const startSec = srtTimeToSeconds(times[0].trim());
          const endSec = srtTimeToSeconds(times[1].trim());
          const text = lines.slice(timeIndex + 1).join('<br>');

          if (!isNaN(startSec) && !isNaN(endSec)) {
            rawSubtitles.push({ startSec, endSec, text });
          }
        }
      }
    });
  }

  function srtTimeToSeconds(timeStr) {
    const [main, millis] = timeStr.replace('.', ',').split(',');
    const [hrs, mins, secs] = main.split(':').map(Number);
    return (hrs * 3600) + (mins * 60) + secs + (parseInt(millis || 0) / 1000);
  }

  function secondsToSRTTime(sec) {
    if (sec < 0) sec = 0;
    const hrs = Math.floor(sec / 3600).toString().padStart(2, '0');
    const mins = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
    const secs = Math.floor(sec % 60).toString().padStart(2, '0');
    const ms = Math.floor((sec % 1) * 1000).toString().padStart(3, '0');
    return `${hrs}:${mins}:${secs},${ms}`;
  }

  function addOffset(val) {
    applyOffset(currentOffsetSec + val);
  }

  function resetOffset() {
    applyOffset(0);
  }

  function syncFirstSubToCurrentTime() {
    if (rawSubtitles.length === 0) return;
    const videoSec = videoPlayer.currentTime;
    const firstSubSec = rawSubtitles[0].startSec;
    applyOffset(videoSec - firstSubSec);
  }

  // --- OPTIMASI UTAMA: PROSES CEPAT TANPA MEMBEBANI MEMORI HP ---
  function applyOffset(offset) {
    currentOffsetSec = Math.round(offset * 100) / 100;
    const sign = currentOffsetSec >= 0 ? '+' : '';
    offsetText.innerText = `Offset: ${sign}${currentOffsetSec.toFixed(2)} Detik`;

    // 1. Update data offset di array
    syncedSubtitles = rawSubtitles.map(item => ({
      startSec: Math.max(0, item.startSec + currentOffsetSec),
      endSec: Math.max(0, item.endSec + currentOffsetSec),
      text: item.text
    }));

    // 2. Render Single-Pass HTML (Sangat cepat & hemat CPU)
    let htmlContent = '';
    for (let i = 0; i < syncedSubtitles.length; i++) {
      const sub = syncedSubtitles[i];
      htmlContent += `
        <div class="sub-item" id="subItem-${i}">
          <span class="sub-time">[${secondsToSRTTime(sub.startSec)} --> ${secondsToSRTTime(sub.endSec)}]</span>
          <div>${sub.text.replace(/<br>/g, ' ')}</div>
        </div>
      `;
    }
    subListBox.innerHTML = htmlContent;

    // Reset Indeks Aktif
    lastActiveIdx = -1;
    generateDownloadLink();
    updateLiveSubtitle();
  }

  // Live Sync yang Dioptimasi (Hanya berjalan ketika ada perubahan teks)
  videoPlayer.addEventListener('timeupdate', updateLiveSubtitle);

  function updateLiveSubtitle() {
    const curTime = videoPlayer.currentTime;
    let foundIdx = -1;

    // Cari indeks subtitle yang sedang aktif
    for (let i = 0; i < syncedSubtitles.length; i++) {
      if (curTime >= syncedSubtitles[i].startSec && curTime <= syncedSubtitles[i].endSec) {
        foundIdx = i;
        break;
      }
    }

    // Hanya ubah tampilan jika baris subtitle BERGANTI
    if (foundIdx !== lastActiveIdx) {
      if (foundIdx !== -1) {
        subText.innerHTML = syncedSubtitles[foundIdx].text;
        subText.style.display = 'inline-block';
      } else {
        subText.style.display = 'none';
      }

      // Hapus status aktif lama
      if (lastActiveIdx !== -1) {
        const prevEl = document.getElementById(`subItem-${lastActiveIdx}`);
        if (prevEl) prevEl.classList.remove('active');
      }

      // Tandai status aktif baru & scroll ringan (Instant Scroll)
      if (foundIdx !== -1) {
        const newEl = document.getElementById(`subItem-${foundIdx}`);
        if (newEl) {
          newEl.classList.add('active');
          subListBox.scrollTop = newEl.offsetTop - subListBox.offsetTop - 30;
        }
      }

      lastActiveIdx = foundIdx;
    }
  }

  function generateDownloadLink() {
    let srtOutput = '';
    for (let i = 0; i < syncedSubtitles.length; i++) {
      const sub = syncedSubtitles[i];
      srtOutput += `${i + 1}\n`;
      srtOutput += `${secondsToSRTTime(sub.startSec)} --> ${secondsToSRTTime(sub.endSec)}\n`;
      srtOutput += `${sub.text.replace(/<br>/g, '\n')}\n\n`;
    }

    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    
    const blob = new Blob([srtOutput], { type: 'text/plain;charset=utf-8' });
    currentBlobUrl = URL.createObjectURL(blob);
    downloadBtn.href = currentBlobUrl;
  }
</script>

</body>
</html>
