<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bulk Image Compressor Pro</title>
    <!-- Library JSZip untuk membuat ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: max(24px, calc(env(safe-area-inset-top) + 20px));
            padding-bottom: max(24px, calc(env(safe-area-inset-bottom) + 20px));
            padding-left: 16px;
            padding-right: 16px;
        }
        .container {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 520px;
        }
        h2 {
            text-align: center;
            color: var(--text);
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        p.sub {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .mode-toggle {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .val-badge {
            color: var(--primary);
            font-weight: 800;
        }
        .file-box {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .file-box:active {
            border-color: var(--primary);
            background: #eff6ff;
        }
        select, input[type="range"] {
            width: 100%;
        }
        select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
            background: #fff;
            color: var(--text);
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .btn-submit:active {
            transform: scale(0.98);
            background: var(--primary-hover);
        }
        .btn-submit:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        .progress-bar-container {
            width: 100%;
            background: #e2e8f0;
            border-radius: 10px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
            height: 12px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.1s;
        }
        #status {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .stats-card {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 12px;
            margin-top: 16px;
            font-size: 12px;
            color: #166534;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kompresi Foto Batch</h2>
    <p class="sub">Optimasi ratusan foto lokal cepat & hemat memori</p>
    
    <!-- Selector Pilihan Input Mode -->
    <div class="mode-toggle">
        <button type="button" class="mode-btn active" id="btnModeFiles" onclick="setMode('files')">🖼️ Pilih File Foto</button>
        <button type="button" class="mode-btn" id="btnModeFolder" onclick="setMode('folder')">📁 Pilih Folder</button>
    </div>

    <div class="form-group">
        <div class="file-box" onclick="triggerFileInput()">
            <div style="font-size: 28px; margin-bottom: 6px;">📂</div>
            <div id="fileLabel" style="font-weight: 700; font-size: 13px;">Tap untuk memilih foto</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Mendukung hingga 1000 foto sekaligus</div>
        </div>
        <input type="file" id="fileInput" multiple accept="image/*" hidden>
    </div>

    <!-- Opsi Kualitas -->
    <div class="form-group">
        <label for="qualitySlider">Kualitas Kompresi: <span id="qualityValue" class="val-badge">60%</span></label>
        <input type="range" id="qualitySlider" min="5" max="100" value="60">
    </div>

    <!-- Opsi Resize Resolusi -->
    <div class="form-group">
        <label>Batasi Resolusi Maksimal:</label>
        <select id="resizeSelect">
            <option value="0">Ukuran Asli (Tanpa Resize)</option>
            <option value="1920" selected>Full HD (Max 1920px) - Direkomendasikan</option>
            <option value="1280">HD Ready (Max 1280px)</option>
            <option value="800">Hemat Ekstrem (Max 800px)</option>
        </select>
    </div>

    <!-- Opsi Format Output -->
    <div class="form-group">
        <label>Format File Output:</label>
        <select id="formatSelect">
            <option value="image/jpeg">JPEG (.jpg)</option>
            <option value="image/webp">WebP (.webp - Ukuran Lebih Kecil)</option>
        </select>
    </div>

    <button id="compressBtn" class="btn-submit">⚡ Mulai Kompresi & Unduh ZIP</button>

    <div class="progress-bar-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div id="status"></div>

    <div class="stats-card" id="statsCard">
        <b>🎉 Hasil Penghematan Memori:</b><br>
        • Ukuran Asli: <span id="origSize">-</span><br>
        • Hasil Kompresi: <span id="compSize">-</span><br>
        • Berhasil Dihemat: <b id="savedSize">-</b>
    </div>
</div>

<script>
    let inputMode = 'files';
    const fileInput = document.getElementById('fileInput');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityValue = document.getElementById('qualityValue');
    const resizeSelect = document.getElementById('resizeSelect');
    const formatSelect = document.getElementById('formatSelect');
    const compressBtn = document.getElementById('compressBtn');
    const status = document.getElementById('status');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const statsCard = document.getElementById('statsCard');

    qualitySlider.addEventListener('input', (e) => {
        qualityValue.textContent = e.target.value + '%';
    });

    function setMode(mode) {
        inputMode = mode;
        document.getElementById('btnModeFiles').classList.toggle('active', mode === 'files');
        document.getElementById('btnModeFolder').classList.toggle('active', mode === 'folder');
        
        fileInput.value = '';
        if (mode === 'folder') {
            fileInput.setAttribute('webkitdirectory', '');
            fileInput.setAttribute('directory', '');
            document.getElementById('fileLabel').textContent = 'Tap untuk memilih 1 Folder Utuh';
        } else {
            fileInput.removeAttribute('webkitdirectory');
            fileInput.removeAttribute('directory');
            document.getElementById('fileLabel').textContent = 'Tap untuk memilih File Foto';
        }
    }

    function triggerFileInput() {
        fileInput.click();
    }

    fileInput.addEventListener('change', () => {
        const files = Array.from(fileInput.files).filter(f => f.type.startsWith('image/'));
        if (files.length > 0) {
            document.getElementById('fileLabel').textContent = `${files.length} Foto Terpilih`;
        }
    });

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Fungsi kompresi gambar tingkat lanjut
    function processImage(file, quality, maxDim, outputMime) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const objectUrl = URL.createObjectURL(file);
            img.src = objectUrl;

            img.onload = () => {
                URL.revokeObjectURL(objectUrl);
                
                let width = img.width;
                let height = img.height;

                // Hitung resize proporsional
                if (maxDim > 0 && (width > maxDim || height > maxDim)) {
                    if (width > height) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob((blob) => {
                    const ext = outputMime === 'image/webp' ? '.webp' : '.jpg';
                    const newName = file.name.replace(/\.[^/.]+$/, "") + ext;
                    
                    canvas.width = 0;
                    canvas.height = 0;
                    resolve({ name: newName, blob: blob, origSize: file.size, compSize: blob.size });
                }, outputMime, quality);
            };

            img.onerror = (err) => {
                URL.revokeObjectURL(objectUrl);
                reject(err);
            };
        });
    }

    compressBtn.addEventListener('click', async () => {
        let files = Array.from(fileInput.files).filter(f => f.type.startsWith('image/'));

        if (files.length === 0) {
            alert('Silakan pilih foto atau folder terlebih dahulu!');
            return;
        }

        if (files.length > 1000) {
            alert(`Anda memilih ${files.length} foto. Dibatasi 1000 foto pertama.`);
            files = files.slice(0, 1000);
        }

        const quality = parseInt(qualitySlider.value) / 100;
        const maxDim = parseInt(resizeSelect.value);
        const outputMime = formatSelect.value;

        compressBtn.disabled = true;
        progressContainer.style.display = 'block';
        statsCard.style.display = 'none';

        const zip = new JSZip();
        const imgFolder = zip.folder("Foto_Terkompresi");

        let totalOrigBytes = 0;
        let totalCompBytes = 0;

        for (let i = 0; i < files.length; i++) {
            status.textContent = `Memproses foto ${i + 1} dari ${files.length}...`;
            progressBar.style.width = ((i + 1) / files.length * 100) + '%';

            try {
                const res = await processImage(files[i], quality, maxDim, outputMime);
                imgFolder.file(res.name, res.blob);
                totalOrigBytes += res.origSize;
                totalCompBytes += res.compSize;
            } catch (err) {
                console.error(`Gagal memproses ${files[i].name}`, err);
            }

            // Async yield untuk menjaga UI tetap responsif
            if (i % 5 === 0) {
                await new Promise(r => setTimeout(r, 0));
            }
        }

        status.textContent = 'Membungkus file ke ZIP...';

        zip.generateAsync({ type: "blob" }).then((content) => {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `Batch_${files.length}_Foto_Kompresi.zip`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            status.textContent = `Selesai! ${files.length} foto berhasil diunduh.`;
            compressBtn.disabled = false;

            // Tampilkan laporan statistik
            const savedBytes = totalOrigBytes - totalCompBytes;
            const savedPct = totalOrigBytes > 0 ? Math.round((savedBytes / totalOrigBytes) * 100) : 0;

            document.getElementById('origSize').textContent = formatBytes(totalOrigBytes);
            document.getElementById('compSize').textContent = formatBytes(totalCompBytes);
            document.getElementById('savedSize').textContent = `${formatBytes(savedBytes)} (${savedPct}%)`;
            statsCard.style.display = 'block';
        });
    });
</script>

</body>
</html>
