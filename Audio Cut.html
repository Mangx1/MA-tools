<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Audio Extractor & Trimmer</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-inner: #0f172a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .header {
      text-align: center;
    }

    .header h2 {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 2px;
    }

    .header p {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .file-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .file-btn:active { background: var(--primary-hover); }
    input[type="file"] { display: none; }

    .editor-section {
      display: none;
      flex-direction: column;
      gap: 14px;
      background: var(--card-inner);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .waveform-container {
      position: relative;
      width: 100%;
      height: 90px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    /* Fix Grid Overflow Android WebView */
    .time-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0; /* Mencegah elemen keluar dari sel grid */
    }

    .time-box label {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .time-box input {
      width: 100%;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 8px 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.9rem;
      outline: none;
      text-align: center;

      /* Hilangkan spinner bawaan browser */
      -moz-appearance: textfield;
    }

    .time-box input::-webkit-outer-spin-button,
    .time-box input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .range-slider {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-secondary {
      flex: 1;
      padding: 12px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-action {
      flex: 1.5;
      padding: 12px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-action:active { background: #059669; }

    .status-text {
      font-size: 0.75rem;
      color: var(--accent);
      text-align: center;
      word-break: break-all;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Audio Extractor & Trimmer</h2>
      <p>Ekstrak audio dari video atau potong lagu lokal</p>
    </div>

    <label class="file-btn" for="mediaInput">Pilih File (Video / Audio)</label>
    <input type="file" id="mediaInput" accept="video/*,audio/*">

    <div class="status-text" id="statusText"></div>

    <div class="editor-section" id="editorSection">
      <div class="waveform-container">
        <canvas id="waveformCanvas"></canvas>
      </div>

      <div class="time-controls">
        <div class="time-box">
          <label>Mulai (Detik):</label>
          <input type="number" id="startTime" step="0.1" min="0" value="0">
        </div>
        <div class="time-box">
          <label>Selesai (Detik):</label>
          <input type="number" id="endTime" step="0.1" min="0" value="0">
        </div>
      </div>

      <div>
        <label style="font-size: 0.75rem; color: var(--text-sub);">Posisi Preview Slider:</label>
        <input type="range" id="seekSlider" class="range-slider" min="0" max="100" value="0">
      </div>

      <div class="action-row">
        <button class="btn-secondary" id="btnPlayPreview">▶ Play Preview</button>
        <button class="btn-action" id="btnExport">⬇ Unduh Audio</button>
      </div>
    </div>
  </div>

  <script>
    const mediaInput = document.getElementById('mediaInput');
    const editorSection = document.getElementById('editorSection');
    const statusText = document.getElementById('statusText');
    const waveformCanvas = document.getElementById('waveformCanvas');
    const startTimeInput = document.getElementById('startTime');
    const endTimeInput = document.getElementById('endTime');
    const seekSlider = document.getElementById('seekSlider');
    const btnPlayPreview = document.getElementById('btnPlayPreview');
    const btnExport = document.getElementById('btnExport');

    let audioCtx = null;
    let audioBuffer = null;
    let previewSourceNode = null;
    let isPlayingPreview = false;

    mediaInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.textContent = "Membaca & mendecode audio...";
      editorSection.style.display = 'none';

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        const arrayBuffer = await file.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        startTimeInput.value = "0.0";
        endTimeInput.value = audioBuffer.duration.toFixed(1);
        startTimeInput.max = audioBuffer.duration;
        endTimeInput.max = audioBuffer.duration;
        seekSlider.value = 0;

        drawWaveform(audioBuffer);
        editorSection.style.display = 'flex';
        statusText.textContent = `File Siap: ${file.name} (${audioBuffer.duration.toFixed(1)}s)`;

      } catch (err) {
        console.error(err);
        statusText.textContent = "Gagal membaca audio. Format mungkin tidak didukung.";
      }
    });

    function drawWaveform(buffer) {
      const ctx = waveformCanvas.getContext('2d');
      const width = waveformCanvas.width = waveformCanvas.offsetWidth;
      const height = waveformCanvas.height = waveformCanvas.offsetHeight;
      const rawData = buffer.getChannelData(0);
      const step = Math.ceil(rawData.length / width);
      
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#38bdf8';
      
      for (let i = 0; i < width; i++) {
        let min = 1.0;
        let max = -1.0;
        for (let j = 0; j < step; j++) {
          const datum = rawData[i * step + j];
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        ctx.fillRect(i, (1 + min) * 0.5 * height, 1, Math.max(1, (max - min) * 0.5 * height));
      }
    }

    btnPlayPreview.addEventListener('click', () => {
      if (isPlayingPreview) stopPreview();
      else startPreview();
    });

    function startPreview() {
      if (!audioBuffer) return;
      stopPreview();

      const start = parseFloat(startTimeInput.value) || 0;
      const end = parseFloat(endTimeInput.value) || audioBuffer.duration;
      const duration = end - start;

      if (duration <= 0) return alert("Waktu selesai harus lebih besar dari waktu mulai!");

      previewSourceNode = audioCtx.createBufferSource();
      previewSourceNode.buffer = audioBuffer;
      previewSourceNode.connect(audioCtx.destination);
      previewSourceNode.start(0, start, duration);

      isPlayingPreview = true;
      btnPlayPreview.textContent = "⏸ Pause Preview";

      previewSourceNode.onended = () => {
        isPlayingPreview = false;
        btnPlayPreview.textContent = "▶ Play Preview";
      };
    }

    function stopPreview() {
      if (previewSourceNode) {
        previewSourceNode.stop();
        previewSourceNode.disconnect();
        previewSourceNode = null;
      }
      isPlayingPreview = false;
      btnPlayPreview.textContent = "▶ Play Preview";
    }

    btnExport.addEventListener('click', () => {
      if (!audioBuffer) return;

      const start = parseFloat(startTimeInput.value) || 0;
      const end = parseFloat(endTimeInput.value) || audioBuffer.duration;
      const duration = end - start;

      if (duration <= 0) return alert("Durasi pemotongan tidak valid!");

      statusText.textContent = "Memproses pemotongan audio...";

      const sampleRate = audioBuffer.sampleRate;
      const startOffset = Math.floor(start * sampleRate);
      const endOffset = Math.floor(end * sampleRate);
      const frameCount = endOffset - startOffset;

      const trimmedBuffer = audioCtx.createBuffer(
        audioBuffer.numberOfChannels,
        frameCount,
        sampleRate
      );

      for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
        const channelData = audioBuffer.getChannelData(channel);
        const trimmedData = trimmedBuffer.getChannelData(channel);
        trimmedData.set(channelData.subarray(startOffset, endOffset));
      }

      const wavBlob = bufferToWavBlob(trimmedBuffer);
      const url = URL.createObjectURL(wavBlob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `extracted_${Math.floor(Date.now()/1000)}.wav`;
      a.click();

      statusText.textContent = "Ekspor audio berhasil diunduh!";
    });

    function bufferToWavBlob(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sampleRate = buffer.sampleRate, offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952);
      setUint32(length - 8);
      setUint32(0x45564157);
      setUint32(0x20746d66);
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(sampleRate);
      setUint32(sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164);
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: 'audio/wav' });
    }
  </script>
</body>
</html>
